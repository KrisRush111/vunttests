<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты - TheVuntgram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap');
        
        :root {
            --tg-primary: #3390ec;
            --tg-primary-dark: #2b7dd6;
            --tg-secondary: #40a7e3;
            --tg-bg: #ffffff;
            --tg-bg-secondary: #f7f7f7;
            --tg-surface: #ffffff;
            --tg-text: #000000;
            --tg-text-secondary: #707579;
            --tg-text-hint: #a2acb0;
            --tg-divider: rgba(0, 0, 0, 0.06);
            --tg-shadow-light: 0 0.5px 2px rgba(0, 0, 0, 0.04);
            --tg-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            --tg-shadow-large: 0 4px 20px rgba(0, 0, 0, 0.08);
            --tg-success: #00c03e;
            --tg-destructive: #e53e3e;
            --tg-warning: #ff8c00;
            --tg-online: #0ac630;
            --tg-border-radius: 12px;
            --tg-border-radius-large: 16px;
            --tg-transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --tg-transition-bounce: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --tg-bg: #1c1c1e;
                --tg-bg-secondary: #2c2c2e;
                --tg-surface: #2c2c2e;
                --tg-text: #ffffff;
                --tg-text-secondary: #8e8e93;
                --tg-text-hint: #636366;
                --tg-divider: rgba(255, 255, 255, 0.1);
                --tg-shadow-light: 0 0.5px 2px rgba(0, 0, 0, 0.3);
                --tg-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
                --tg-shadow-large: 0 4px 20px rgba(0, 0, 0, 0.35);
            }
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, var(--tg-bg-secondary) 0%, var(--tg-bg) 100%);
            color: var(--tg-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: 17px;
            line-height: 1.47;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }
        
        .contacts-container {
            flex: 1;
            max-width: 428px;
            margin: 0 auto;
            width: 100%;
            padding: 8px 16px 88px;
            animation: slideInUp 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .search-container {
            margin-bottom: 16px;
            padding: 20px;
            background: var(--tg-surface);
            border-radius: var(--tg-border-radius-large);
            box-shadow: var(--tg-shadow);
            transition: var(--tg-transition);
            backdrop-filter: blur(20px);
            border: 1px solid var(--tg-divider);
            animation: slideInDown 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }
        
        .search-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--tg-primary), transparent);
            opacity: 0;
            transition: var(--tg-transition);
        }
        
        .search-container:hover {
            transform: translateY(-2px);
            box-shadow: var(--tg-shadow-large);
        }
        
        .search-container:hover::before {
            opacity: 1;
        }
        
        .search-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--tg-text);
            letter-spacing: -0.02em;
            animation: fadeInLeft 0.5s ease-out 0.1s both;
        }
        
        .search-input-container {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            animation: fadeInUp 0.5s ease-out 0.2s both;
        }
        
        .search-input {
            flex: 1;
            padding: 14px 16px 14px 48px;
            border: 2px solid var(--tg-divider);
            border-radius: var(--tg-border-radius);
            font-size: 17px;
            font-weight: 400;
            transition: var(--tg-transition);
            background: var(--tg-bg-secondary);
            color: var(--tg-text);
            backdrop-filter: blur(20px);
        }
        
        .search-input::placeholder {
            color: var(--tg-text-hint);
            transition: var(--tg-transition);
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--tg-primary);
            background: var(--tg-surface);
            box-shadow: 0 0 0 4px rgba(51, 144, 236, 0.1);
            transform: scale(1.02);
        }
        
        .search-input:focus::placeholder {
            opacity: 0.6;
            transform: translateX(8px);
        }
        
        .search-icon {
            position: absolute;
            left: 16px;
            color: var(--tg-text-hint);
            font-size: 18px;
            pointer-events: none;
            transition: var(--tg-transition);
            z-index: 2;
        }
        
        .search-input:focus + .search-icon {
            color: var(--tg-primary);
            transform: scale(1.1) rotate(15deg);
        }
        
        .search-button {
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--tg-primary), var(--tg-secondary));
            color: white;
            border: none;
            border-radius: var(--tg-border-radius);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: var(--tg-transition-bounce);
            min-width: 100px;
            box-shadow: var(--tg-shadow);
            position: relative;
            overflow: hidden;
        }
        
        .search-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transition: var(--tg-transition);
            transform: translate(-50%, -50%);
        }
        
        .search-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: var(--tg-shadow-large);
        }
        
        .search-button:hover::before {
            width: 100px;
            height: 100px;
        }
        
        .search-button:active {
            transform: translateY(-1px) scale(0.95);
        }
        
        .contacts-content {
            background: var(--tg-surface);
            border-radius: var(--tg-border-radius-large);
            padding: 0;
            box-shadow: var(--tg-shadow);
            min-height: 300px;
            display: flex;
            flex-direction: column;
            animation: slideInUp 0.5s ease-out 0.3s both;
            backdrop-filter: blur(20px);
            border: 1px solid var(--tg-divider);
            overflow: hidden;
            position: relative;
        }
        
        .contacts-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--tg-primary), transparent);
            opacity: 0.3;
        }
        
        .no-contacts {
            color: var(--tg-text-hint);
            font-size: 16px;
            text-align: center;
            margin: auto;
            padding: 60px 32px;
            animation: fadeIn 0.6s ease-out 0.5s both;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        
        .no-contacts::before {
            content: '👥';
            font-size: 48px;
            opacity: 0.5;
            animation: float 3s ease-in-out infinite;
        }
        
        .user-result {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--tg-divider);
            margin: 0;
            background: var(--tg-surface);
            cursor: pointer;
            transition: var(--tg-transition);
            position: relative;
            overflow: hidden;
            animation: slideInRight 0.4s ease-out both;
        }

        .user-result:nth-child(n) {
            animation-delay: calc(0.1s * var(--index, 0));
        }

        .user-result:last-child {
            border-bottom: none;
        }

        .user-result::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0;
            background: linear-gradient(90deg, var(--tg-primary), transparent);
            transition: var(--tg-transition);
        }

        .user-result:hover {
            background: var(--tg-bg-secondary);
            transform: translateX(8px);
        }

        .user-result:hover::before {
            width: 4px;
        }

        .user-result:active {
            transform: translateX(4px) scale(0.98);
            background: var(--tg-divider);
        }
        
        .user-avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 20px;
            margin-right: 16px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: var(--tg-shadow);
            transition: var(--tg-transition-bounce);
            flex-shrink: 0;
            border: 2px solid var(--tg-divider);
            position: relative;
            overflow: hidden;
        }

        .user-avatar::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--tg-primary), var(--tg-secondary));
            z-index: -1;
            opacity: 0;
            transition: var(--tg-transition);
        }

        .user-result:hover .user-avatar {
            transform: scale(1.1) rotate(5deg);
            box-shadow: var(--tg-shadow-large);
        }

        .user-result:hover .user-avatar::before {
            opacity: 1;
        }
        
        .user-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .user-nickname {
            font-weight: 600;
            font-size: 17px;
            color: var(--tg-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: var(--tg-transition);
        }
        
        .user-result:hover .user-nickname {
            color: var(--tg-primary);
        }
        
        .user-id {
            font-size: 15px;
            color: var(--tg-text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .request-label {
            font-size: 14px;
            color: var(--tg-primary);
            font-weight: 500;
            margin-top: 2px;
        }
        
        .add-button, .accept-button, .reject-button, .sent-button, .added-button {
            padding: 10px 20px;
            border: none;
            border-radius: var(--tg-border-radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--tg-transition-bounce);
            min-width: 90px;
            text-align: center;
            box-shadow: var(--tg-shadow-light);
            position: relative;
            overflow: hidden;
        }

        .add-button::before,
        .accept-button::before,
        .reject-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transition: var(--tg-transition);
            transform: translate(-50%, -50%);
        }

        .add-button {
            background: linear-gradient(135deg, var(--tg-primary), var(--tg-secondary));
            color: white;
        }
        
        .add-button:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: var(--tg-shadow-large);
        }

        .add-button:hover::before {
            width: 80px;
            height: 80px;
        }

        .add-button:active {
            transform: scale(0.95);
        }

        .accept-button {
            background: linear-gradient(135deg, var(--tg-success), #00a832);
            color: white;
            margin-right: 8px;
        }

        .accept-button:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: var(--tg-shadow-large);
        }

        .accept-button:hover::before {
            width: 80px;
            height: 80px;
        }

        .accept-button:active {
            transform: scale(0.95);
        }

        .reject-button {
            background: linear-gradient(135deg, var(--tg-destructive), #d32f2f);
            color: white;
        }

        .reject-button:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: var(--tg-shadow-large);
        }

        .reject-button:hover::before {
            width: 80px;
            height: 80px;
        }

        .reject-button:active {
            transform: scale(0.95);
        }
        
        .sent-button {
            background: rgba(51, 144, 236, 0.1);
            color: var(--tg-primary);
            cursor: not-allowed;
            backdrop-filter: blur(20px);
        }
        
        .added-button {
            background: rgba(0, 192, 62, 0.1);
            color: var(--tg-success);
            cursor: default;
            backdrop-filter: blur(20px);
        }

        .chevron-icon {
            color: var(--tg-text-hint);
            font-size: 18px;
            transition: var(--tg-transition-bounce);
        }

        .user-result:hover .chevron-icon {
            color: var(--tg-primary);
            transform: translateX(6px) scale(1.2);
        }
        
        .friend-request-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(10px);
            opacity: 0;
            visibility: hidden;
            transition: var(--tg-transition);
        }
        
        .loading-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(51, 144, 236, 0.2);
            border-radius: 50%;
            border-top-color: var(--tg-primary);
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        .loading-text {
            color: white;
            font-size: 16px;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 24px;
            border-radius: var(--tg-border-radius);
            backdrop-filter: blur(20px);
        }
        
        .message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 16px 24px;
            border-radius: var(--tg-border-radius);
            font-size: 15px;
            font-weight: 500;
            z-index: 10000;
            box-shadow: var(--tg-shadow-large);
            backdrop-filter: blur(20px);
            transition: var(--tg-transition-bounce);
            opacity: 0;
        }

        .message-box.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .message-box.error {
            background: var(--tg-destructive);
            color: white;
        }

        .message-box.success {
            background: var(--tg-success);
            color: white;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--tg-surface);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--tg-divider);
            backdrop-filter: blur(20px);
            z-index: 100;
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.1);
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--tg-text-hint);
            font-size: 10px;
            font-weight: 500;
            transition: var(--tg-transition-bounce);
            padding: 8px 16px;
            border-radius: var(--tg-border-radius);
            min-width: 70px;
            position: relative;
        }
        
        .nav-item i {
            font-size: 24px;
            margin-bottom: 4px;
            transition: var(--tg-transition-bounce);
        }

        .nav-item span {
            transition: var(--tg-transition);
        }
        
        .nav-item.active {
            color: var(--tg-primary);
        }

        .nav-item.active i {
            animation: bounceIn 0.6s ease;
        }
        
        .nav-item:hover i {
            transform: translateY(-4px) scale(1.15);
        }

        .nav-item:active {
            transform: scale(0.9);
        }

        /* Profile Modal Improvements */
        .profile-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--tg-bg-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: var(--tg-transition);
            overflow-y: auto;
            padding: 20px;
            padding-top: 40px;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.4s ease;
        }

        .profile-modal.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1999;
            opacity: 0;
            visibility: hidden;
            transition: var(--tg-transition);
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .profile-modal-content {
            width: 100%;
            max-width: 428px;
            background: transparent;
            border-radius: 0;
            padding: 0;
            position: relative;
            animation: slideInUp 0.4s ease;
        }

        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 16px;
            padding: 28px 24px;
            background: var(--tg-surface);
            border-radius: var(--tg-border-radius-large);
            box-shadow: var(--tg-shadow);
            transition: var(--tg-transition);
            position: relative;
            width: 100%;
            backdrop-filter: blur(20px);
            border: 1px solid var(--tg-divider);
            overflow: hidden;
        }

        .profile-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--tg-primary), transparent);
            opacity: 0.5;
        }

        .profile-header:hover {
            transform: translateY(-2px);
            box-shadow: var(--tg-shadow-large);
        }

        .profile-back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--tg-primary);
            font-size: 22px;
            cursor: pointer;
            transition: var(--tg-transition-bounce);
            width: 44px;
            height: 44px;
            border-radius: var(--tg-border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: rgba(51, 144, 236, 0.1);
            backdrop-filter: blur(20px);
        }

        .profile-back-button:hover {
            background: rgba(51, 144, 236, 0.2);
            transform: scale(1.1) rotate(-10deg);
        }

        .profile-back-button:active {
            transform: scale(0.9);
        }

        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 600;
            color: white;
            margin-bottom: 20px;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--tg-primary), var(--tg-secondary));
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: var(--tg-transition-bounce);
            position: relative;
            border: 3px solid var(--tg-divider);
            box-shadow: var(--tg-shadow-large);
        }

        .profile-avatar::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--tg-primary), var(--tg-secondary));
            z-index: -1;
            animation: rotate 3s linear infinite;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 8px;
        }

        .profile-nickname {
            font-size: 24px;
            font-weight: 700;
            color: var(--tg-text);
            text-align: center;
            letter-spacing: -0.02em;
        }

        .profile-id {
            font-size: 16px;
            color: var(--tg-text-secondary);
            font-weight: 500;
        }

        .profile-status {
            display: inline-flex;
            align-items: center;
            font-size: 15px;
            color: var(--tg-online);
            font-weight: 500;
            background: rgba(10, 198, 48, 0.1);
            padding: 6px 16px;
            border-radius: var(--tg-border-radius);
            backdrop-filter: blur(20px);
        }

        .profile-status::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--tg-online);
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        /* Profile Action Buttons */
        .profile-actions {
            background: var(--tg-surface);
            border-radius: var(--tg-border-radius-large);
            padding: 20px;
            box-shadow: var(--tg-shadow);
            animation: fadeInUp 0.5s ease-out 0.1s both;
            width: 100%;
            margin-bottom: 16px;
            backdrop-filter: blur(20px);
            border: 1px solid var(--tg-divider);
        }

        .action-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .action-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--tg-text);
            transition: var(--tg-transition-bounce);
            cursor: pointer;
            padding: 12px 8px;
            border-radius: var(--tg-border-radius);
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .action-button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--tg-bg-secondary);
            border-radius: var(--tg-border-radius);
            opacity: 0;
            transition: var(--tg-transition);
        }

        .action-button:hover::before {
            opacity: 1;
        }

        .action-button:hover {
            transform: translateY(-4px) scale(1.05);
        }

        .action-button:active {
            transform: translateY(-2px) scale(0.95);
        }

        .action-button-icon {
            width: 50px;
            height: 50px;
            border-radius: var(--tg-border-radius);
            background: linear-gradient(135deg, var(--tg-primary), var(--tg-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            font-size: 20px;
            color: white;
            transition: var(--tg-transition-bounce);
            box-shadow: var(--tg-shadow);
            z-index: 2;
            position: relative;
        }

        .action-button:hover .action-button-icon {
            transform: scale(1.1) rotate(10deg);
            box-shadow: var(--tg-shadow-large);
        }

        .action-button-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--tg-text);
            text-align: center;
            z-index: 2;
            position: relative;
        }

        .profile-details {
            background: var(--tg-surface);
            border-radius: var(--tg-border-radius-large);
            padding: 0;
            box-shadow: var(--tg-shadow);
            animation: fadeInUp 0.5s ease-out 0.2s both;
            width: 100%;
            backdrop-filter: blur(20px);
            border: 1px solid var(--tg-divider);
            overflow: hidden;
        }

        .profile-details-title {
            font-size: 16px;
            color: var(--tg-text-secondary);
            padding: 20px 20px 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .detail-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            animation: fadeIn 0.4s ease-out both;
            opacity: 0;
            border-bottom: 1px solid var(--tg-divider);
            transition: var(--tg-transition);
            position: relative;
            overflow: hidden;
        }

        .detail-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0;
            background: linear-gradient(90deg, var(--tg-primary), transparent);
            transition: var(--tg-transition);
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-item:hover {
            background: var(--tg-bg-secondary);
            transform: translateX(8px);
        }

        .detail-item:hover::before {
            width: 4px;
        }

        .detail-label {
            width: 110px;
            color: var(--tg-text);
            font-size: 16px;
            flex-shrink: 0;
            margin-right: 20px;
            font-weight: 500;
        }

        .detail-value {
            flex: 1;
            font-size: 16px;
            font-weight: 400;
            color: var(--tg-text-secondary);
            min-width: 0;
            word-break: break-word;
        }

        .detail-item:nth-child(2) { animation-delay: 0.1s; }
        .detail-item:nth-child(3) { animation-delay: 0.15s; }
        .detail-item:nth-child(4) { animation-delay: 0.2s; }
        .detail-item:nth-child(5) { animation-delay: 0.25s; }
        .detail-item:nth-child(6) { animation-delay: 0.3s; }
        .detail-item:nth-child(7) { animation-delay: 0.35s; }

        @media (max-width: 428px) {
            .contacts-container {
                padding: 8px 12px 88px;
            }
            
            .search-container {
                padding: 16px;
                margin-bottom: 12px;
            }
            
            .search-title {
                font-size: 24px;
                margin-bottom: 16px;
            }
            
            .search-input {
                padding: 12px 14px 12px 44px;
                font-size: 16px;
            }
            
            .search-button {
                padding: 12px 20px;
                font-size: 15px;
                min-width: 80px;
            }
            
            .user-avatar {
                width: 48px;
                height: 48px;
                font-size: 18px;
                margin-right: 12px;
            }
            
            .add-button, .accept-button, .reject-button, .sent-button {
                padding: 8px 16px;
                font-size: 14px;
                min-width: 80px;
            }
            
            .profile-avatar {
                width: 90px;
                height: 90px;
                font-size: 32px;
            }
            
            .profile-nickname {
                font-size: 22px;
            }

            .action-buttons {
                gap: 20px;
            }

            .action-button-icon {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }

            .action-button-label {
                font-size: 12px;
            }
            
            .detail-item {
                flex-direction: column;
                align-items: flex-start;
                padding: 16px 20px;
            }
            
            .detail-label {
                width: 100%;
                margin-bottom: 6px;
                font-size: 14px;
                color: var(--tg-text-secondary);
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            .detail-value {
                font-size: 16px;
                color: var(--tg-text);
            }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        
        @keyframes rotate {
            to { transform: rotate(360deg); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes bounceIn {
            0%, 20%, 53%, 100% { transform: translateY(0) scale(1); }
            40%, 43% { transform: translateY(-8px) scale(1.1); }
            70% { transform: translateY(-4px) scale(1.05); }
            90% { transform: translateY(-2px) scale(1.02); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Загрузка данных...</div>
    </div>

    <div class="contacts-container">
        <!-- Message box -->
        <div id="messageBox" class="message-box"></div>
        
        <!-- Search section -->
        <div class="search-container">
            <div class="search-title">Контакты</div>
            <div class="search-input-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Введите ID пользователя">
                <i class="fas fa-search search-icon"></i>
                <button id="searchButton" class="search-button">Найти</button>
            </div>
        </div>
        
        <!-- Contacts content -->
        <div class="contacts-content">

    <!-- Profile Modal -->
    <div id="modalOverlay" class="modal-overlay"></div>
    <div id="profileModal" class="profile-modal">
        <div class="profile-modal-content">

                <div class="profile-info">

                    <div id="modal-profile-id" class="profile-id">ID: </div>
                    <div class="profile-status">В сети</div>
                </div>
            </div>
            
            <div class="profile-actions">
                <div class="action-buttons">
                    <div class="action-button" id="chatButton">
                        <div class="action-button-icon">
                            <i class="fas fa-comment"></i>
                        </div>
                        <div class="action-button-label">Чат</div>

                    <div class="action-button" id="soundButton">
                        <div class="action-button-icon">

                        </div>
                        <div class="action-button-label">Звук</div>
                    </div>
                    <div class="action-button" id="moreButton">
                        <div class="action-button-icon">
                            <i class="fas fa-ellipsis-h"></i>
                        </div>

            <!-- Profile details -->
            <div class="profile-details">
                <div class="profile-details-title">О себе</div>
                <div class="detail-item">
                    <div class="detail-label">Школа</div>
                    <div id="modal-main-school" class="detail-value">Загрузка...</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Класс</div>
                    <div id="modal-user-class" class="detail-value">Загрузка...</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Роль</div>
                    <div id="modal-user-role" class="detail-value">Загрузка...</div>
                </div>
                <div id="modal-additional-school-container" class="detail-item">
                    <div class="detail-label">Доп. школа</div>
                    <div id="modal-additional-school" class="detail-value">Загрузка...</div>
                </div>
                <div id="modal-specialization-container" class="detail-item">
                    <div class="detail-label">Направление</div>
                    <div id="modal-user-specialization" class="detail-value">Загрузка...</div>
                </div>
                <div id="modal-course-container" class="detail-item">
                    <div class="detail-label">Курс</div>
                    <div id="modal-user-course" class="detail-value">Загрузка...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom navigation -->
    <div class="bottom-nav">
        <a href="contacts.html" class="nav-item active">
            <i class="fas fa-user-circle"></i>
            <span>Контакты</span>
        </a>
        
        <a href="chats.html" class="nav-item">
            <i class="fas fa-comments"></i>
            <span>Чаты</span>
        </a>
     
        <a href="profile.html" class="nav-item">
            <i class="fas fa-cog"></i>
            <span>Профиль</span>
        </a>
    </div>

    <script>
        // Configuration
        const SERVER_URL = 'https://vuntserver-p1cx.onrender.com';
        
        // DOM elements
        const loadingOverlay = document.getElementById('loadingOverlay');
        const noContacts = document.getElementById('noContacts');
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const searchResults = document.getElementById('searchResults');
        const messageBox = document.getElementById('messageBox');
        const profileModal = document.getElementById('profileModal');
        const profileBackButton = document.getElementById('profileBackButton');
        const modalOverlay = document.getElementById('modalOverlay');
        // Profile modal elements
        const modalProfileAvatar = document.getElementById('modal-profile-avatar');
        const modalProfileNickname = document.getElementById('modal-profile-nickname');
        const modalProfileId = document.getElementById('modal-profile-id');
        const modalMainSchool = document.getElementById('modal-main-school');
        const modalUserClass = document.getElementById('modal-user-class');
        const modalUserRole = document.getElementById('modal-user-role');
        const modalAdditionalSchool = document.getElementById('modal-additional-school');
        const modalUserSpecialization = document.getElementById('modal-user-specialization');
        const modalUserCourse = document.getElementById('modal-user-course');
        const modalAdditionalSchoolContainer = document.getElementById('modal-additional-school-container');
        const modalSpecializationContainer = document.getElementById('modal-specialization-container');
        const modalCourseContainer = document.getElementById('modal-course-container');

        // User data from profile page
        let userData = {};
        
        // Show loading overlay
        function showLoading(text = 'Загрузка...') {
            loadingOverlay.querySelector('.loading-text').textContent = text;
            loadingOverlay.classList.add('show');
        }
        
        // Hide loading overlay
        function hideLoading() {
            loadingOverlay.classList.remove('show');
        }
        
        // Show message (error or success)
        function showMessage(message, type = 'error') {
            messageBox.textContent = message;
            messageBox.className = `message-box ${type} show`;
            setTimeout(() => {
                messageBox.classList.remove('show');
            }, 5000);
        }
        
        // Load user data from sessionStorage
        function loadUserData() {
            showLoading('Загрузка данных пользователя...');
            
            try {
                const data = JSON.parse(sessionStorage.getItem('userData'));
                
                if (data && data.platform_user_id) {
                    userData = {
                        nickname: data.nickname || "не указано",
                        identity: data.identity || "не указано",
                        main_school_code: data.main_school_code || "не указано",
                        main_school_name: data.main_school_name || "не указано",
                        class_number: data.class_number || "не указано",
                        class_letter: data.class_letter || "не указано",
                        additional_school_code: data.additional_school_code || "не указано",
                        additional_school_name: data.additional_school_name || "не указано",
                        specialization: data.specialization || "не указано",
                        course: data.course || "не указано",
                        platform_user_id: data.platform_user_id
                    };
                    
                    console.log('User data loaded:', userData);
                    hideLoading();
                } else {
                    throw new Error('No user data found');
                }
            } catch (error) {
                console.error('Error loading user data:', error);
                hideLoading();
                // Redirect to profile if no data
                window.location.href = 'profile.html';
            }
        }
        
        // Open profile modal
        function openProfileModal(userId) {
            showLoading('Загрузка профиля...');
            loadUserProfile(userId);
            profileModal.classList.add('active');
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Close profile modal
        function closeProfileModal() {
            profileModal.classList.remove('active');
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Add event handler for overlay
        modalOverlay.addEventListener('click', closeProfileModal);

        // Load user profile
        async function loadUserProfile(userId) {
            try {
                const response = await fetch(`${SERVER_URL}/get_user_data`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        platform_user_id: userId
                    }),
                    credentials: 'include'
                });

                const data = await response.json();
                console.log('User data from server:', data);

                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка загрузки профиля');
                }

                if (data.status === 'success' && data.user) {
                    updateProfileModalUI(data.user);
                } else {
                    throw new Error('Пользователь не найден');
                }
            } catch (error) {
                console.error('Profile loading error:', error);
                showMessage('Ошибка загрузки профиля: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        // Update profile modal UI
        function updateProfileModalUI(user) {
            if (user.has_avatar || user.has_avatar_photo) {
                const avatarUrl = `${SERVER_URL}/avatar/${user.platform_user_id}?t=${Date.now()}`;
                modalProfileAvatar.style.backgroundImage = `url(${avatarUrl})`;
                modalProfileAvatar.textContent = '';
                modalProfileAvatar.style.backgroundColor = '';
            } else {
                const initial = user.nickname?.charAt(0).toUpperCase() || '?';
                modalProfileAvatar.textContent = initial;
                modalProfileAvatar.style.backgroundImage = '';
                
                if (user.avatar_background) {
                    modalProfileAvatar.style.background = `linear-gradient(135deg, ${user.avatar_background}, ${lightenColor(user.avatar_background, 20)})`;
                } else {
                    modalProfileAvatar.style.background = 'linear-gradient(135deg, #3390ec, #40a7e3)';
                }
            }

            modalProfileNickname.textContent = user.nickname || 'Не указано';
            modalProfileId.textContent = `ID: ${user.platform_user_id || 'Не указано'}`;
            modalUserRole.textContent = user.identity || 'Не указано';
            modalMainSchool.textContent = user.main_school_name || 'Не указано';
            
            if (user.class_number && user.class_letter) {
                modalUserClass.textContent = `${user.class_number}${user.class_letter}`;
            } else {
                modalUserClass.textContent = 'Не указано';
            }
            
            const additionalSchoolValue = user.additional_school_name;
            const hasAdditionalSchool = additionalSchoolValue && 
                                      additionalSchoolValue !== 'Не указано' && 
                                      additionalSchoolValue !== 'не указано' && 
                                      additionalSchoolValue.trim() !== '';
            
            if (!hasAdditionalSchool) {
                modalAdditionalSchoolContainer.style.display = 'none';
                modalSpecializationContainer.style.display = 'none';
                modalCourseContainer.style.display = 'none';
            } else {
                modalAdditionalSchoolContainer.style.display = 'flex';
                modalSpecializationContainer.style.display = 'flex';
                modalCourseContainer.style.display = 'flex';

                modalAdditionalSchool.textContent = additionalSchoolValue;
                modalUserSpecialization.textContent = user.specialization || 'Не указано';
                modalUserCourse.textContent = user.course || 'Не указано';
            }
        }

        // Event handlers for modal
        profileBackButton.addEventListener('click', closeProfileModal);
        profileModal.addEventListener('click', (e) => {
            if (e.target === profileModal) {
                closeProfileModal();
            }
        });
        
        // Load contacts
        async function loadContacts() {
            showLoading('Загрузка контактов...');
            searchResults.innerHTML = '';
            noContacts.style.display = 'none';
            
            try {
                const response = await fetch(`${SERVER_URL}/get_friends`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        platform_user_id: userData.platform_user_id
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка загрузки контактов');
                }
                
                if (data.status === 'success') {
                    sessionStorage.setItem('userContacts', JSON.stringify(data.friends));
                    // Display friends
                    if (data.friends.length > 0) {
                        data.friends.forEach((user, index) => {
                            displayUserResult(user, 'added', index);
                        });
                    }
                    
                    // Display incoming requests
                    if (data.incoming_requests.length > 0) {
                        data.incoming_requests.forEach((user, index) => {
                            displayFriendRequest(user, index + data.friends.length);
                        });
                    }
                    
                    // If no friends or requests
                    if (data.friends.length === 0 && data.incoming_requests.length === 0) {
                        noContacts.textContent = 'Нет контактов';
                        noContacts.style.display = 'flex';
                    }
                } else {
                    throw new Error(data.error || 'Ошибка загрузки контактов');
                }
            } catch (error) {
                console.error('Load contacts error:', error);
                showMessage('Ошибка загрузки контактов: ' + error.message);
                noContacts.textContent = 'Ошибка при загрузке контактов';
                noContacts.style.display = 'flex';
            } finally {
                hideLoading();
            }
        }
        
        // Display user result
        async function displayUserResult(user, status = 'default', index = 0) {
            const userElement = document.createElement('div');
            userElement.className = 'user-result';
            userElement.style.setProperty('--index', index);
            
            // Click handler for opening profile
            userElement.addEventListener('click', (e) => {
                // Проверяем, не было ли клика по кнопке
                if (e.target.tagName !== 'BUTTON') {
                    userElement.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        userElement.style.transform = '';
                        openProfileModal(user.platform_user_id);
                    }, 100);
                }
            });
    
            // Avatar
            const avatarElement = document.createElement('div');
            avatarElement.className = 'user-avatar';
            
            if (user.has_avatar_photo || user.avatar_photo) {
                const avatarUrl = `${SERVER_URL}/avatar/${user.platform_user_id}?t=${Date.now()}`;
                avatarElement.style.backgroundImage = `url(${avatarUrl})`;
                avatarElement.textContent = '';
            } else {
                const initial = user.nickname?.charAt(0).toUpperCase() || '?';
                avatarElement.textContent = initial;
                if (user.avatar_background) {
                    avatarElement.style.background = `linear-gradient(135deg, ${user.avatar_background}, ${lightenColor(user.avatar_background, 20)})`;
                } else {
                    avatarElement.style.background = 'linear-gradient(135deg, #3390ec, #40a7e3)';
                }
            }
            
            // User info
            const infoElement = document.createElement('div');
            infoElement.className = 'user-info';
            
            const nicknameElement = document.createElement('div');
            nicknameElement.className = 'user-nickname';
            nicknameElement.textContent = user.nickname || 'Не указано';
            
            const idElement = document.createElement('div');
            idElement.className = 'user-id';
            idElement.textContent = `ID: ${user.platform_user_id}`;
            
            infoElement.appendChild(nicknameElement);
            infoElement.appendChild(idElement);
            
            // Action button
            const actionContainer = document.createElement('div');
            
            if (status === 'added') {
                const arrowIcon = document.createElement('i');
                arrowIcon.className = 'fas fa-chevron-right chevron-icon';
                actionContainer.appendChild(arrowIcon);
            } else if (status === 'request_sent') {
                const sentButton = document.createElement('button');
                sentButton.className = 'sent-button';
                sentButton.innerHTML = '<i class="fas fa-clock"></i> Отправлено';
                actionContainer.appendChild(sentButton);
            } else {
                const addButton = document.createElement('button');
                addButton.className = 'add-button';
                addButton.innerHTML = '<i class="fas fa-user-plus"></i> Добавить';
                addButton.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await sendFriendRequest(user.platform_user_id);
                });
                actionContainer.appendChild(addButton);
            }
            
            // Assemble the elements
            userElement.appendChild(avatarElement);
            userElement.appendChild(infoElement);
            userElement.appendChild(actionContainer);
            
            searchResults.appendChild(userElement);
        }
        
        // Lighten color
        function lightenColor(hex, percent) {
            const num = parseInt(hex.replace("#", ""), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            
            return `#${
                (0x1000000 +
                (R < 255 ? (R < 1 ? 0 : R) : 255) * 0x10000 +
                (G < 255 ? (G < 1 ? 0 : G) : 255) * 0x100 +
                (B < 255 ? (B < 1 ? 0 : B) : 255)
            ).toString(16).slice(1)}`;
        }

        function displayFriendRequest(user, index = 0) {
            const requestElement = document.createElement('div');
            requestElement.className = 'user-result';
            requestElement.style.setProperty('--index', index);
            
            // Обработчик клика на весь элемент пользователя
            requestElement.addEventListener('click', (e) => {
                if (e.target.tagName !== 'BUTTON') {
                    openProfileModal(user.platform_user_id);
                }
            });

            // Avatar
            const avatarElement = document.createElement('div');
            avatarElement.className = 'user-avatar';
            
            if (user.has_avatar_photo || user.avatar_photo) {
                const avatarUrl = `${SERVER_URL}/avatar/${user.platform_user_id}?t=${Date.now()}`;
                avatarElement.style.backgroundImage = `url(${avatarUrl})`;
                avatarElement.textContent = '';
            } else {
                const initial = user.nickname?.charAt(0).toUpperCase() || '?';
                avatarElement.textContent = initial;
                if (user.avatar_background) {
                    avatarElement.style.background = `linear-gradient(135deg, ${user.avatar_background}, ${lightenColor(user.avatar_background, 20)})`;
                } else {
                    avatarElement.style.background = 'linear-gradient(135deg, #3390ec, #40a7e3)';
                }
            }
            
            // User info
            const infoElement = document.createElement('div');
            infoElement.className = 'user-info';
            
            const nicknameElement = document.createElement('div');
            nicknameElement.className = 'user-nickname';
            nicknameElement.textContent = user.nickname || 'Не указано';
            
            const idElement = document.createElement('div');
            idElement.className = 'user-id';
            idElement.textContent = `ID: ${user.platform_user_id}`;
            
            const requestText = document.createElement('div');
            requestText.className = 'request-label';
            requestText.textContent = 'Запрос на добавление в друзья';
            
            infoElement.appendChild(nicknameElement);
            infoElement.appendChild(idElement);
            infoElement.appendChild(requestText);
            
            // Action buttons
            const actionsContainer = document.createElement('div');
            actionsContainer.className = 'friend-request-actions';
            
            const acceptButton = document.createElement('button');
            acceptButton.className = 'accept-button';
            acceptButton.innerHTML = '<i class="fas fa-check"></i>';
            acceptButton.addEventListener('click', async (e) => {
                e.stopPropagation();
                await handleFriendRequest(user.request_id, 'accept');
            });
            
            const rejectButton = document.createElement('button');
            rejectButton.className = 'reject-button';
            rejectButton.innerHTML = '<i class="fas fa-times"></i>';
            rejectButton.addEventListener('click', async (e) => {
                e.stopPropagation();
                await handleFriendRequest(user.request_id, 'reject');
            });
            
            actionsContainer.appendChild(acceptButton);
            actionsContainer.appendChild(rejectButton);
            
            // Assemble the elements
            requestElement.appendChild(avatarElement);
            requestElement.appendChild(infoElement);
            requestElement.appendChild(actionsContainer);
            
            searchResults.appendChild(requestElement);
        }
        
        // Send friend request
        async function sendFriendRequest(receiverId) {
            showLoading('Отправка запроса...');
            
            try {
                const response = await fetch(`${SERVER_URL}/send_friend_request`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sender_id: userData.platform_user_id,
                        receiver_id: receiverId
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка отправки запроса');
                }
                
                if (data.status === 'success') {
                    showMessage('Запрос на дружбу отправлен', 'success');
                    // Обновляем список контактов и сохраняем в sessionStorage
                    loadContacts();
                } else {
                    throw new Error(data.error || 'Ошибка отправки запроса');
                }
            } catch (error) {
                console.error('Send friend request error:', error);
                showMessage('Ошибка отправки запроса: ' + error.message);
            } finally {
                hideLoading();
            }
        }
        
        async function handleFriendRequest(requestId, action) {
            showLoading(action === 'accept' ? 'Принятие запроса...' : 'Отклонение запроса...');
            
            try {
                const response = await fetch(`${SERVER_URL}/handle_friend_request`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        request_id: requestId,
                        receiver_id: userData.platform_user_id,
                        action: action
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка обработки запроса');
                }
                
                if (data.status === 'success') {
                    showMessage(
                        action === 'accept' ? 
                        'Запрос принят! Пользователь добавлен в контакты' : 
                        'Запрос отклонен',
                        action === 'accept' ? 'success' : 'success'
                    );
                    // Обновляем список контактов
                    loadContacts();
                } else {
                    throw new Error(data.error || 'Ошибка обработки запроса');
                }
            } catch (error) {
                console.error('Handle friend request error:', error);
                showMessage('Ошибка обработки запроса: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        // Check friendship status
        async function checkFriendshipStatus(userId) {
            try {
                const response = await fetch(`${SERVER_URL}/check_friendship`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user1_id: userData.platform_user_id,
                        user2_id: userId
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка проверки статуса');
                }
                
                return data.friendship_status || 'not_friends';
            } catch (error) {
                console.error('Check friendship error:', error);
                return 'not_friends';
            }
        }
        
        // Search user by ID
        async function searchUserById(userId) {
            if (!userId || userId.trim() === '') {
                showMessage('Пожалуйста, введите ID пользователя');
                return;
            }
            
            if (userId === userData.platform_user_id) {
                showMessage('Нельзя искать самого себя');
                return;
            }
            
            showLoading('Поиск пользователя...');
            searchResults.innerHTML = '';
            noContacts.style.display = 'none';
            
            try {
                // Сначала проверяем статус дружбы
                const friendshipStatus = await checkFriendshipStatus(userId);
                
                if (friendshipStatus === 'accepted') {
                    // Если уже друзья, получаем полные данные
                    const response = await fetch(`${SERVER_URL}/get_user_data`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            platform_user_id: userId
                        }),
                        credentials: 'include'
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || 'Неизвестная ошибка поиска');
                    }
                    
                    if (data.status === 'success' && data.user) {
                        displayUserResult(data.user, 'added');
                    } else {
                        noContacts.textContent = 'Пользователь не найден';
                        noContacts.style.display = 'flex';
                    }
                } else if (friendshipStatus === 'request_sent') {
                    // Если запрос уже отправлен
                    const response = await fetch(`${SERVER_URL}/get_user_data`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            platform_user_id: userId
                        }),
                        credentials: 'include'
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || 'Неизвестная ошибка поиска');
                    }
                    
                    if (data.status === 'success' && data.user) {
                        displayUserResult(data.user, 'request_sent');
                    } else {
                        noContacts.textContent = 'Пользователь не найден';
                        noContacts.style.display = 'flex';
                    }
                } else {
                    // Если нет отношений, ищем пользователя
                    const response = await fetch(`${SERVER_URL}/search_user`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            platform_user_id: userId,
                            requester_id: userData.platform_user_id
                        }),
                        credentials: 'include'
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || 'Неизвестная ошибка поиска');
                    }
                    
                    if (data.status === 'success' && data.user) {
                        displayUserResult(data.user, 'default');
                    } else {
                        noContacts.textContent = 'Пользователь не найден';
                        noContacts.style.display = 'flex';
                    }
                }
            } catch (error) {
                console.error('Search error:', error);
                showMessage('Ошибка поиска: ' + error.message);
                noContacts.textContent = 'Ошибка при поиске';
                noContacts.style.display = 'flex';
            } finally {
                hideLoading();
            }
        }
        
        // Event listeners
        window.addEventListener('DOMContentLoaded', () => {
            loadUserData();
            loadContacts(); // Загружаем контакты при открытии страницы
            
            searchButton.addEventListener('click', () => {
                const searchId = searchInput.value.trim();
                searchUserById(searchId);
            });
            
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const searchId = searchInput.value.trim();
                    searchUserById(searchId);
                }
            });
        });
        
        // Handle back/forward cache (BFCache)
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                loadUserData();
                loadContacts();
            }
        });
    </script>
</body>
</html>
