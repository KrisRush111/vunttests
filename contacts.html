<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты - TheVuntgram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --tg-theme-bg-color: #17212b;
            --tg-theme-secondary-bg-color: #242f3d;
            --tg-theme-header-bg-color: #242f3d;
            --tg-theme-section-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #708499;
            --tg-theme-link-color: #2481cc;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-destructive-text-color: #ee686f;
            --telegram-blue: #0088cc;
            --telegram-light-blue: #40a7e3;
            --telegram-bg: #ffffff;
            --telegram-secondary-bg: #f4f4f5;
            --telegram-text: #000000;
            --telegram-hint: #8e8e93;
            --online-green: #00c73c;
            --telegram-divider: rgba(0,0,0,0.08);
            --telegram-shadow: 0 1px 3px rgba(0,0,0,0.06);
            --telegram-shadow-large: 0 4px 16px rgba(0,0,0,0.08);
            --telegram-destructive: #ee686f;
            --telegram-success: #00c73c;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --telegram-bg: #212121;
                --telegram-secondary-bg: #1d1d1d;
                --telegram-text: #ffffff;
                --telegram-hint: #8e8e93;
                --telegram-divider: rgba(255,255,255,0.12);
                --telegram-shadow: 0 1px 3px rgba(0,0,0,0.24);
                --telegram-shadow-large: 0 4px 16px rgba(0,0,0,0.24);
            }
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background-color: var(--telegram-secondary-bg);
            color: var(--telegram-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .contacts-container {
            flex: 1;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            padding: 12px 12px 80px;
            animation: fadeInUp 0.3s ease-out;
        }
        
        .search-container {
            margin-bottom: 12px;
            padding: 16px;
            background: var(--telegram-bg);
            border-radius: 12px;
            box-shadow: var(--telegram-shadow);
            transition: all 0.2s ease;
            animation: fadeInUp 0.3s ease-out;
        }
        
        .search-container:active {
            transform: scale(0.99);
        }
        
        .search-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--telegram-text);
            letter-spacing: -0.02em;
        }
        
        .search-input-container {
            display: flex;
            align-items: center;
            position: relative;
        }
        
        .search-input {
            flex: 1;
            padding: 12px 16px;
            padding-left: 44px;
            border: 1px solid var(--telegram-divider);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s ease;
            background-color: var(--telegram-secondary-bg);
            color: var(--telegram-text);
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--telegram-blue);
            box-shadow: 0 0 0 2px rgba(36, 129, 204, 0.1);
            background-color: var(--telegram-bg);
        }
        
        .search-icon {
            position: absolute;
            left: 16px;
            color: var(--telegram-hint);
            font-size: 16px;
            pointer-events: none;
        }
        
        .search-button {
            margin-left: 12px;
            padding: 12px 20px;
            background-color: var(--telegram-blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 80px;
        }
        
        .search-button:hover {
            background-color: #006ba1;
            transform: translateY(-1px);
            box-shadow: var(--telegram-shadow-large);
        }

        .search-button:active {
            transform: scale(0.98);
        }
        
        .contacts-content {
            background: var(--telegram-bg);
            border-radius: 12px;
            padding: 0;
            box-shadow: var(--telegram-shadow);
            min-height: 200px;
            display: flex;
            flex-direction: column;
            animation: fadeInUp 0.3s ease-out 0.1s;
            animation-fill-mode: both;
            overflow: hidden;
        }
        
        .no-contacts {
            color: var(--telegram-hint);
            font-size: 15px;
            text-align: center;
            margin: auto;
            opacity: 0;
            animation: fadeIn 0.3s ease-out 0.2s forwards;
            padding: 40px 20px;
        }
        
        .user-result {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--telegram-divider);
            margin: 0;
            background-color: var(--telegram-bg);
            animation: fadeIn 0.3s ease-out;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .user-result:last-child {
            border-bottom: none;
        }

        .user-result:hover {
            background-color: rgba(0,0,0,0.02);
        }

        .user-result:active {
            background-color: rgba(0,0,0,0.04);
            transform: scale(0.98);
        }

        @media (prefers-color-scheme: dark) {
            .user-result:hover {
                background-color: rgba(255,255,255,0.04);
            }

            .user-result:active {
                background-color: rgba(255,255,255,0.08);
            }
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
            margin-right: 12px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: var(--telegram-shadow);
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        .user-avatar:hover {
            transform: scale(1.02);
        }
        
        .user-info {
            flex: 1;
            min-width: 0;
        }
        
        .user-nickname {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--telegram-text);
        }
        
        .user-id {
            font-size: 14px;
            color: var(--telegram-hint);
            margin-bottom: 2px;
        }

        .request-label {
            font-size: 13px;
            color: var(--telegram-blue);
            font-weight: 500;
        }
        
        .add-button, .accept-button, .reject-button, .sent-button, .added-button {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 80px;
            text-align: center;
        }

        .add-button {
            background-color: var(--telegram-blue);
            color: white;
        }
        
        .add-button:hover {
            background-color: #006ba1;
            transform: translateY(-1px);
            box-shadow: var(--telegram-shadow);
        }

        .add-button:active {
            transform: scale(0.95);
        }

        .accept-button {
            background-color: var(--telegram-success);
            color: white;
            margin-right: 8px;
        }

        .accept-button:hover {
            background-color: #00a832;
            transform: translateY(-1px);
        }

        .accept-button:active {
            transform: scale(0.95);
        }

        .reject-button {
            background-color: var(--telegram-destructive);
            color: white;
        }

        .reject-button:hover {
            background-color: #d85960;
            transform: translateY(-1px);
        }

        .reject-button:active {
            transform: scale(0.95);
        }
        
        .sent-button {
            background-color: rgba(36, 129, 204, 0.1);
            color: var(--telegram-blue);
            cursor: not-allowed;
        }
        
        .added-button {
            background-color: rgba(0, 199, 60, 0.1);
            color: var(--telegram-success);
            cursor: default;
        }

        .chevron-icon {
            color: var(--telegram-hint);
            font-size: 16px;
            transition: transform 0.2s ease;
        }

        .user-result:hover .chevron-icon {
            transform: translateX(2px);
        }
        
        .friend-request-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.3s ease-in-out;
            backdrop-filter: blur(8px);
        }
        
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(36, 129, 204, 0.2);
            border-radius: 50%;
            border-top-color: var(--telegram-blue);
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        
        .loading-text {
            color: var(--telegram-text);
            font-size: 15px;
            font-weight: 500;
            background: var(--telegram-bg);
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: var(--telegram-shadow-large);
        }
        
        .message-box {
            text-align: center;
            padding: 12px 16px;
            margin: 12px;
            border-radius: 12px;
            display: none;
            font-size: 15px;
            font-weight: 500;
            animation: slideDown 0.3s ease;
        }

        .message-box.error {
            color: white;
            background: var(--telegram-destructive);
        }

        .message-box.success {
            color: white;
            background: var(--telegram-success);
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--telegram-bg);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--telegram-divider);
            backdrop-filter: blur(20px);
            z-index: 100;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--telegram-hint);
            font-size: 10px;
            font-weight: 500;
            transition: all 0.2s ease;
            padding: 8px 12px;
            border-radius: 12px;
            min-width: 60px;
        }
        
        .nav-item i {
            font-size: 22px;
            margin-bottom: 2px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-item span {
            transition: all 0.2s ease;
        }
        
        .nav-item.active {
            color: var(--telegram-blue);
        }

        .nav-item.active i {
            animation: bounce 0.6s ease;
        }
        
        .nav-item:hover i {
            transform: translateY(-2px) scale(1.1);
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        /* Profile Modal */
        .profile-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--telegram-secondary-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            overflow-y: auto;
            padding: 20px;
            padding-top: 20px;
        }

        .profile-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .profile-modal-content {
            width: 100%;
            max-width: 480px;
            background: transparent;
            border-radius: 0;
            padding: 0;
            position: relative;
            animation: slideInUp 0.3s ease;
        }

        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
            padding: 24px 20px;
            background: var(--telegram-bg);
            border-radius: 12px;
            box-shadow: var(--telegram-shadow);
            transition: all 0.2s ease;
            position: relative;
            width: 100%;
            margin-top: 0;
        }

        .profile-header:active {
            transform: scale(0.98);
        }

        .profile-back-button {
            position: absolute;
            top: 16px;
            left: 16px;
            color: var(--telegram-text);
            font-size: 20px;
            cursor: pointer;
            opacity: 0.8;
            transition: all 0.2s ease;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .profile-back-button:hover {
            opacity: 1;
            background: rgba(0,0,0,0.04);
        }

        .profile-back-button:active {
            transform: scale(0.9);
        }

        @media (prefers-color-scheme: dark) {
            .profile-back-button:hover {
                background: rgba(255,255,255,0.08);
            }
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 600;
            color: white;
            margin-bottom: 16px;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--telegram-blue), var(--telegram-light-blue));
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: all 0.2s ease;
            position: relative;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .profile-nickname {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            text-align: center;
            color: var(--telegram-text);
        }

        .profile-id {
            font-size: 15px;
            color: var(--telegram-hint);
            margin-bottom: 8px;
        }

        .profile-status {
            display: inline-flex;
            align-items: center;
            font-size: 14px;
            color: var(--online-green);
            font-weight: 500;
        }

        .profile-status::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--online-green);
            margin-right: 6px;
            animation: pulse 2s infinite;
        }

/* Profile Action Buttons */
.profile-actions {
    background: var(--telegram-bg);
    border-radius: 12px;
    padding: 16px;
    box-shadow: var(--telegram-shadow);
    animation: fadeInUp 0.3s ease-out 0.05s;
    animation-fill-mode: both;
    width: 100%;
    margin-bottom: 12px;
}

.action-buttons {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 0 4px;
}

.action-button {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: var(--telegram-text);
    transition: all 0.2s ease;
    cursor: pointer;
    padding: 8px 4px;
    border-radius: 8px;
    min-width: 0;
    flex: 1;
}

.action-button:hover {
    background-color: rgba(0,0,0,0.04);
}

.action-button:active {
    background-color: rgba(0,0,0,0.08);
    transform: scale(0.98);
}

@media (prefers-color-scheme: dark) {
    .action-button:hover {
        background-color: rgba(255,255,255,0.04);
    }

    .action-button:active {
        background-color: rgba(255,255,255,0.08);
    }
}

.action-button-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--telegram-secondary-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
    font-size: 18px;
    color: var(--telegram-blue);
    transition: all 0.2s ease;
}

.action-button:hover .action-button-icon {
    background: var(--telegram-blue);
    color: white;
}

.action-button-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--telegram-text);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
}

        .profile-details {
            background: var(--telegram-bg);
            border-radius: 12px;
            padding: 0;
            box-shadow: var(--telegram-shadow);
            animation: fadeInUp 0.3s ease-out 0.1s;
            animation-fill-mode: both;
            width: 100%;
            margin-top: 20px;
            overflow: hidden;
        }

        .profile-details-title {
            font-size: 15px;
            color: var(--telegram-hint);
            padding: 16px 16px 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .detail-item {
            display: flex;
            padding: 12px 16px;
            animation: fadeIn 0.3s ease-out forwards;
            opacity: 0;
            align-items: center;
            border-bottom: 1px solid var(--telegram-divider);
            transition: background-color 0.2s ease;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-item:hover {
            background-color: rgba(0,0,0,0.02);
        }

        @media (prefers-color-scheme: dark) {
            .detail-item:hover {
                background-color: rgba(255,255,255,0.04);
            }
        }

        .detail-label {
            width: 100px;
            color: var(--telegram-text);
            font-size: 15px;
            flex-shrink: 0;
            margin-right: 16px;
            font-weight: 400;
        }

        .detail-value {
            flex: 1;
            font-size: 15px;
            font-weight: 400;
            min-width: 0;
            word-break: break-word;
            color: var(--telegram-text);
        }

        .detail-item:nth-child(2) { animation-delay: 0.05s; }
        .detail-item:nth-child(3) { animation-delay: 0.1s; }
        .detail-item:nth-child(4) { animation-delay: 0.15s; }
        .detail-item:nth-child(5) { animation-delay: 0.2s; }
        .detail-item:nth-child(6) { animation-delay: 0.25s; }
        .detail-item:nth-child(7) { animation-delay: 0.3s; }

        @media (max-width: 480px) {
            .contacts-container {
                padding: 8px 8px 80px;
            }
            
            .search-container {
                padding: 12px;
            }
            
            .search-title {
                font-size: 20px;
                margin-bottom: 12px;
            }
            
            .search-input {
                padding: 10px 14px;
                padding-left: 40px;
                font-size: 16px;
            }
            
            .search-button {
                padding: 10px 16px;
                font-size: 14px;
                min-width: 70px;
            }
            
            .user-avatar {
                width: 40px;
                height: 40px;
                font-size: 16px;
                margin-right: 10px;
            }
            
            .add-button, .accept-button, .reject-button, .sent-button {
                padding: 6px 12px;
                font-size: 13px;
                min-width: 70px;
            }
            
            .profile-avatar {
                width: 80px;
                height: 80px;
                font-size: 32px;
            }
            
            .profile-nickname {
                font-size: 20px;
            }

            .action-buttons {
                gap: 24px;
            }

            .action-button-icon {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }

            .action-button-label {
                font-size: 11px;
            }
            
            .detail-item {
                flex-direction: column;
                align-items: flex-start;
                padding: 14px 16px;
            }
            
            .detail-label {
                width: 100%;
                margin-bottom: 4px;
                font-size: 13px;
                color: var(--telegram-hint);
                text-transform: uppercase;
                letter-spacing: 0.02em;
            }

            .detail-value {
                font-size: 15px;
            }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes fadeInUp {
            from { 
                opacity: 0;
                transform: translateY(20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 20%, 53%, 100% {
                transform: translateY(0);
            }
            40%, 43% {
                transform: translateY(-8px);
            }
            70% {
                transform: translateY(-4px);
            }
            90% {
                transform: translateY(-2px);
            }
        }
    </style>
</head>
<body>
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Загрузка данных...</div>
    </div>

    <div class="contacts-container">
        <!-- Message box -->
        <div id="messageBox" class="message-box"></div>
        
        <!-- Search section -->
        <div class="search-container">
            <div class="search-title">Контакты</div>
            <div class="search-input-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Введите ID пользователя">
                <button id="searchButton" class="search-button">Найти</button>
            </div>
        </div>
        
        <!-- Contacts content -->
        <div class="contacts-content">
            <div id="noContacts" class="no-contacts">Нет контактов</div>
            <div id="searchResults"></div>
        </div>

    <script>
        // Configuration
        const SERVER_URL = 'https://vuntserver-p1cx.onrender.com';
        
        // DOM elements
        const loadingOverlay = document.getElementById('loadingOverlay');
        const noContacts = document.getElementById('noContacts');
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const searchResults = document.getElementById('searchResults');
        const messageBox = document.getElementById('messageBox');
        const profileModal = document.getElementById('profileModal');
        const profileBackButton = document.getElementById('profileBackButton');
        
        // Profile modal elements
        const modalProfileAvatar = document.getElementById('modal-profile-avatar');
        const modalProfileNickname = document.getElementById('modal-profile-nickname');
        const modalProfileId = document.getElementById('modal-profile-id');
        const modalMainSchool = document.getElementById('modal-main-school');
        const modalUserClass = document.getElementById('modal-user-class');
        const modalUserRole = document.getElementById('modal-user-role');
        const modalAdditionalSchool = document.getElementById('modal-additional-school');
        const modalUserSpecialization = document.getElementById('modal-user-specialization');
        const modalUserCourse = document.getElementById('modal-user-course');
        const modalAdditionalSchoolContainer = document.getElementById('modal-additional-school-container');
        const modalSpecializationContainer = document.getElementById('modal-specialization-container');
        const modalCourseContainer = document.getElementById('modal-course-container');

        // User data from profile page
        let userData = {};
        
        // Show loading overlay
        function showLoading(text = 'Загрузка...') {
            loadingOverlay.querySelector('.loading-text').textContent = text;
            loadingOverlay.style.display = 'flex';
            loadingOverlay.style.opacity = '1';
        }
        
        // Hide loading overlay
        function hideLoading() {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => {
                loadingOverlay.style.display = 'none';
            }, 300);
        }
        
        // Show message (error or success)
        function showMessage(message, type = 'error') {
            messageBox.textContent = message;
            messageBox.className = `message-box ${type}`;
            messageBox.style.display = 'block';
            setTimeout(() => {
                messageBox.style.display = 'none';
            }, 5000);
        }
        
        // Load user data from sessionStorage
        function loadUserData() {
            showLoading('Загрузка данных пользователя...');
            
            try {
                const data = JSON.parse(sessionStorage.getItem('userData'));
                
                if (data && data.platform_user_id) {
                    userData = {
                        nickname: data.nickname || "не указано",
                        identity: data.identity || "не указано",
                        main_school_code: data.main_school_code || "не указано",
                        main_school_name: data.main_school_name || "не указано",
                        class_number: data.class_number || "не указано",
                        class_letter: data.class_letter || "не указано",
                        additional_school_code: data.additional_school_code || "не указано",
                        additional_school_name: data.additional_school_name || "не указано",
                        specialization: data.specialization || "не указано",
                        course: data.course || "не указано",
                        platform_user_id: data.platform_user_id
                    };
                    
                    console.log('User data loaded:', userData);
                    hideLoading();
                } else {
                    throw new Error('No user data found');
                }
            } catch (error) {
                console.error('Error loading user data:', error);
                hideLoading();
                // Redirect to profile if no data
                window.location.href = 'profile.html';
            }
        }
        
        // Open profile modal
        function openProfileModal(userId) {
            showLoading('Загрузка профиля...');
            loadUserProfile(userId);
            profileModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Close profile modal
        function closeProfileModal() {
            profileModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Load user profile
        async function loadUserProfile(userId) {
            try {
                const response = await fetch(`${SERVER_URL}/get_user_data`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        platform_user_id: userId
                    }),
                    credentials: 'include'
                });

                const data = await response.json();
                console.log('User data from server:', data);

                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка загрузки профиля');
                }

                if (data.status === 'success' && data.user) {
                    updateProfileModalUI(data.user);
                } else {
                    throw new Error('Пользователь не найден');
                }
            } catch (error) {
                console.error('Profile loading error:', error);
                showMessage('Ошибка загрузки профиля: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        // Update profile modal UI
        function updateProfileModalUI(user) {
            if (user.has_avatar || user.has_avatar_photo) {
                const avatarUrl = `${SERVER_URL}/avatar/${user.platform_user_id}?t=${Date.now()}`;
                modalProfileAvatar.style.backgroundImage = `url(${avatarUrl})`;
                modalProfileAvatar.textContent = '';
                modalProfileAvatar.style.backgroundColor = '';
            } else {
                const initial = user.nickname?.charAt(0).toUpperCase() || '?';
                modalProfileAvatar.textContent = initial;
                modalProfileAvatar.style.backgroundImage = '';
                
                if (user.avatar_background) {
                    modalProfileAvatar.style.backgroundColor = user.avatar_background;
                } else {
                    modalProfileAvatar.style.backgroundColor = '#0088cc';
                }
            }

            modalProfileNickname.textContent = user.nickname || 'Не указано';
            modalProfileId.textContent = `ID: ${user.platform_user_id || 'Не указано'}`;
            modalUserRole.textContent = user.identity || 'Не указано';
            modalMainSchool.textContent = user.main_school_name || 'Не указано';
            
            if (user.class_number && user.class_letter) {
                modalUserClass.textContent = `${user.class_number}${user.class_letter}`;
            } else {
                modalUserClass.textContent = 'Не указано';
            }
            
            const additionalSchoolValue = user.additional_school_name;
            const hasAdditionalSchool = additionalSchoolValue && 
                                      additionalSchoolValue !== 'Не указано' && 
                                      additionalSchoolValue !== 'не указано' && 
                                      additionalSchoolValue.trim() !== '';
            
            if (!hasAdditionalSchool) {
                modalAdditionalSchoolContainer.style.display = 'none';
                modalSpecializationContainer.style.display = 'none';
                modalCourseContainer.style.display = 'none';
            } else {
                modalAdditionalSchoolContainer.style.display = 'flex';
                modalSpecializationContainer.style.display = 'flex';
                modalCourseContainer.style.display = 'flex';

                modalAdditionalSchool.textContent = additionalSchoolValue;
                modalUserSpecialization.textContent = user.specialization || 'Не указано';
                modalUserCourse.textContent = user.course || 'Не указано';
            }
        }

        // Event handlers for modal
        profileBackButton.addEventListener('click', closeProfileModal);
        profileModal.addEventListener('click', (e) => {
            if (e.target === profileModal) {
                closeProfileModal();
            }
        });
        
        // Load contacts
        async function loadContacts() {
            showLoading('Загрузка контактов...');
            searchResults.innerHTML = '';
            noContacts.style.display = 'none';
            
            try {
                const response = await fetch(`${SERVER_URL}/get_friends`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        platform_user_id: userData.platform_user_id
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка загрузки контактов');
                }
                
                if (data.status === 'success') {
                    // Display friends
                    if (data.friends.length > 0) {
                        data.friends.forEach(user => {
                            displayUserResult(user, 'added');
                        });
                    }
                    
                    // Display incoming requests
                    if (data.incoming_requests.length > 0) {
                        data.incoming_requests.forEach(user => {
                            displayFriendRequest(user);
                        });
                    }
                    
                    // If no friends or requests
                    if (data.friends.length === 0 && data.incoming_requests.length === 0) {
                        noContacts.textContent = 'Нет контактов';
                        noContacts.style.display = 'block';
                    }
                } else {
                    throw new Error(data.error || 'Ошибка загрузки контактов');
                }
            } catch (error) {
                console.error('Load contacts error:', error);
                showMessage('Ошибка загрузки контактов: ' + error.message);
                noContacts.textContent = 'Ошибка при загрузке контактов';
                noContacts.style.display = 'block';
            } finally {
                hideLoading();
            }
        }
        
        // Display user result
        async function displayUserResult(user, status = 'default') {
            const userElement = document.createElement('div');
            userElement.className = 'user-result';
            
            // Click handler for opening profile
            userElement.addEventListener('click', () => {
                openProfileModal(user.platform_user_id);
            });
    
            // Avatar
            const avatarElement = document.createElement('div');
            avatarElement.className = 'user-avatar';
            
            if (user.has_avatar_photo || user.avatar_photo) {
                const avatarUrl = `${SERVER_URL}/avatar/${user.platform_user_id}?t=${Date.now()}`;
                avatarElement.style.backgroundImage = `url(${avatarUrl})`;
                avatarElement.textContent = '';
            } else {
                const initial = user.nickname?.charAt(0).toUpperCase() || '?';
                avatarElement.textContent = initial;
                if (user.avatar_background) {
                    const colors = [user.avatar_background, adjustColor(user.avatar_background, 20)];
                    avatarElement.style.background = `linear-gradient(135deg, ${colors[0]}, ${colors[1]})`;
                } else {
                    avatarElement.style.background = 'linear-gradient(135deg, #0088cc, #40a7e3)';
                }
            }
            
            // User info
            const infoElement = document.createElement('div');
            infoElement.className = 'user-info';
            
            const nicknameElement = document.createElement('div');
            nicknameElement.className = 'user-nickname';
            nicknameElement.textContent = user.nickname || 'Не указано';
            
            const idElement = document.createElement('div');
            idElement.className = 'user-id';
            idElement.textContent = `ID: ${user.platform_user_id}`;
            
            infoElement.appendChild(nicknameElement);
            infoElement.appendChild(idElement);
            
            // Action button
            const actionContainer = document.createElement('div');
            
            if (status === 'added') {
                const arrowIcon = document.createElement('i');
                arrowIcon.className = 'fas fa-chevron-right chevron-icon';
                actionContainer.appendChild(arrowIcon);
            } else if (status === 'request_sent') {
                const sentButton = document.createElement('button');
                sentButton.className = 'sent-button';
                sentButton.innerHTML = '<i class="fas fa-clock"></i> Отправлено';
                actionContainer.appendChild(sentButton);
            } else {
                const addButton = document.createElement('button');
                addButton.className = 'add-button';
                addButton.innerHTML = '<i class="fas fa-user-plus"></i> Добавить';
                addButton.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await sendFriendRequest(user.platform_user_id);
                });
                actionContainer.appendChild(addButton);
            }
            
            // Assemble the elements
            userElement.appendChild(avatarElement);
            userElement.appendChild(infoElement);
            userElement.appendChild(actionContainer);
            
            searchResults.appendChild(userElement);
        }
        
        // Adjust color brightness
        function adjustColor(hex, percent) {
            const num = parseInt(hex.replace("#", ""), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            
            return `#${
                (0x1000000 +
                (R < 255 ? (R < 1 ? 0 : R) : 255) * 0x10000 +
                (G < 255 ? (G < 1 ? 0 : G) : 255) * 0x100 +
                (B < 255 ? (B < 1 ? 0 : B) : 255)
            ).toString(16).slice(1)}`;
        }

        function displayFriendRequest(user) {
            const requestElement = document.createElement('div');
            requestElement.className = 'user-result';
            
            // Обработчик клика на весь элемент пользователя
            requestElement.addEventListener('click', () => {
                openProfileModal(user.platform_user_id);
            });

            // Avatar
            const avatarElement = document.createElement('div');
            avatarElement.className = 'user-avatar';
            
            if (user.has_avatar_photo || user.avatar_photo) {
                const avatarUrl = `${SERVER_URL}/avatar/${user.platform_user_id}?t=${Date.now()}`;
                avatarElement.style.backgroundImage = `url(${avatarUrl})`;
                avatarElement.textContent = '';
            } else {
                const initial = user.nickname?.charAt(0).toUpperCase() || '?';
                avatarElement.textContent = initial;
                if (user.avatar_background) {
                    const colors = [user.avatar_background, adjustColor(user.avatar_background, 20)];
                    avatarElement.style.background = `linear-gradient(135deg, ${colors[0]}, ${colors[1]})`;
                } else {
                    avatarElement.style.background = 'linear-gradient(135deg, #0088cc, #40a7e3)';
                }
            }
            
            // User info
            const infoElement = document.createElement('div');
            infoElement.className = 'user-info';
            
            const nicknameElement = document.createElement('div');
            nicknameElement.className = 'user-nickname';
            nicknameElement.textContent = user.nickname || 'Не указано';
            
            const idElement = document.createElement('div');
            idElement.className = 'user-id';
            idElement.textContent = `ID: ${user.platform_user_id}`;
            
            const requestText = document.createElement('div');
            requestText.className = 'request-label';
            requestText.textContent = 'Запрос на добавление в друзья';
            
            infoElement.appendChild(nicknameElement);
            infoElement.appendChild(idElement);
            infoElement.appendChild(requestText);
            
            // Action buttons
            const actionsContainer = document.createElement('div');
            actionsContainer.className = 'friend-request-actions';
            
            const acceptButton = document.createElement('button');
            acceptButton.className = 'accept-button';
            acceptButton.innerHTML = '<i class="fas fa-check"></i>';
            acceptButton.addEventListener('click', async (e) => {
                e.stopPropagation();
                await handleFriendRequest(user.request_id, 'accept');
            });
            
            const rejectButton = document.createElement('button');
            rejectButton.className = 'reject-button';
            rejectButton.innerHTML = '<i class="fas fa-times"></i>';
            rejectButton.addEventListener('click', async (e) => {
                e.stopPropagation();
                await handleFriendRequest(user.request_id, 'reject');
            });
            
            actionsContainer.appendChild(acceptButton);
            actionsContainer.appendChild(rejectButton);
            
            // Assemble the elements
            requestElement.appendChild(avatarElement);
            requestElement.appendChild(infoElement);
            requestElement.appendChild(actionsContainer);
            
            searchResults.appendChild(requestElement);
        }
        
        // Send friend request
        async function sendFriendRequest(receiverId) {
            showLoading('Отправка запроса...');
            
            try {
                const response = await fetch(`${SERVER_URL}/send_friend_request`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sender_id: userData.platform_user_id,
                        receiver_id: receiverId
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка отправки запроса');
                }
                
                if (data.status === 'success') {
                    showMessage('Запрос на дружбу отправлен', 'success');
                    // Обновляем список контактов
                    loadContacts();
                } else {
                    throw new Error(data.error || 'Ошибка отправки запроса');
                }
            } catch (error) {
                console.error('Send friend request error:', error);
                showMessage('Ошибка отправки запроса: ' + error.message);
            } finally {
                hideLoading();
            }
        }
        
        async function handleFriendRequest(requestId, action) {
            showLoading(action === 'accept' ? 'Принятие запроса...' : 'Отклонение запроса...');
            
            try {
                const response = await fetch(`${SERVER_URL}/handle_friend_request`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        request_id: requestId,
                        receiver_id: userData.platform_user_id,
                        action: action
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка обработки запроса');
                }
                
                if (data.status === 'success') {
                    showMessage(
                        action === 'accept' ? 
                        'Запрос принят! Пользователь добавлен в контакты' : 
                        'Запрос отклонен',
                        action === 'accept' ? 'success' : 'info'
                    );
                    // Обновляем список контактов
                    loadContacts();
                } else {
                    throw new Error(data.error || 'Ошибка обработки запроса');
                }
            } catch (error) {
                console.error('Handle friend request error:', error);
                showMessage('Ошибка обработки запроса: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        // Check friendship status
        async function checkFriendshipStatus(userId) {
            try {
                const response = await fetch(`${SERVER_URL}/check_friendship`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user1_id: userData.platform_user_id,
                        user2_id: userId
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка проверки статуса');
                }
                
                return data.friendship_status || 'not_friends';
            } catch (error) {
                console.error('Check friendship error:', error);
                return 'not_friends';
            }
        }
        
        // Search user by ID
        async function searchUserById(userId) {
            if (!userId || userId.trim() === '') {
                showMessage('Пожалуйста, введите ID пользователя');
                return;
            }
            
            if (userId === userData.platform_user_id) {
                showMessage('Нельзя искать самого себя');
                return;
            }
            
            showLoading('Поиск пользователя...');
            searchResults.innerHTML = '';
            noContacts.style.display = 'none';
            
            try {
                // Сначала проверяем статус дружбы
                const friendshipStatus = await checkFriendshipStatus(userId);
                
                if (friendshipStatus === 'accepted') {
                    // Если уже друзья, получаем полные данные
                    const response = await fetch(`${SERVER_URL}/get_user_data`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            platform_user_id: userId
                        }),
                        credentials: 'include'
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || 'Неизвестная ошибка поиска');
                    }
                    
                    if (data.status === 'success' && data.user) {
                        displayUserResult(data.user, 'added');
                    } else {
                        noContacts.textContent = 'Пользователь не найден';
                        noContacts.style.display = 'block';
                    }
                } else if (friendshipStatus === 'request_sent') {
                    // Если запрос уже отправлен
                    const response = await fetch(`${SERVER_URL}/get_user_data`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            platform_user_id: userId
                        }),
                        credentials: 'include'
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || 'Неизвестная ошибка поиска');
                    }
                    
                    if (data.status === 'success' && data.user) {
                        displayUserResult(data.user, 'request_sent');
                    } else {
                        noContacts.textContent = 'Пользователь не найден';
                        noContacts.style.display = 'block';
                    }
                } else {
                    // Если нет отношений, ищем пользователя
                    const response = await fetch(`${SERVER_URL}/search_user`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            platform_user_id: userId,
                            requester_id: userData.platform_user_id
                        }),
                        credentials: 'include'
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || 'Неизвестная ошибка поиска');
                    }
                    
                    if (data.status === 'success' && data.user) {
                        displayUserResult(data.user, 'default');
                    } else {
                        noContacts.textContent = 'Пользователь не найден';
                        noContacts.style.display = 'block';
                    }
                }
            } catch (error) {
                console.error('Search error:', error);
                showMessage('Ошибка поиска: ' + error.message);
                noContacts.textContent = 'Ошибка при поиске';
                noContacts.style.display = 'block';
            } finally {
                hideLoading();
            }
        }
        
        // Event listeners
        window.addEventListener('DOMContentLoaded', () => {
            loadUserData();
            loadContacts(); // Загружаем контакты при открытии страницы
            
            searchButton.addEventListener('click', () => {
                const searchId = searchInput.value.trim();
                searchUserById(searchId);
            });
            
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const searchId = searchInput.value.trim();
                    searchUserById(searchId);
                }
            });
        });
        
        // Handle back/forward cache (BFCache)
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                loadUserData();
                loadContacts();
            }
        });
    </script>
</body>
</html>
