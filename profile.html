<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - TheVuntgram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap');
        
        :root {
            --tg-primary: #3390ec;
            --tg-primary-dark: #2b7dd6;
            --tg-secondary: #40a7e3;
            --tg-bg: #ffffff;
            --tg-bg-secondary: #f7f7f7;
            --tg-surface: #ffffff;
            --tg-text: #000000;
            --tg-text-secondary: #707579;
            --tg-text-hint: #a2acb0;
            --tg-divider: rgba(0, 0, 0, 0.06);
            --tg-shadow-light: 0 0.5px 2px rgba(0, 0, 0, 0.04);
            --tg-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            --tg-shadow-large: 0 4px 20px rgba(0, 0, 0, 0.08);
            --tg-success: #00c03e;
            --tg-destructive: #e53e3e;
            --tg-warning: #ff8c00;
            --tg-online: #0ac630;
            --tg-border-radius: 12px;
            --tg-border-radius-large: 16px;
            --tg-transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --tg-transition-bounce: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --tg-bg: #1c1c1e;
                --tg-bg-secondary: #2c2c2e;
                --tg-surface: #2c2c2e;
                --tg-text: #ffffff;
                --tg-text-secondary: #8e8e93;
                --tg-text-hint: #636366;
                --tg-divider: rgba(255, 255, 255, 0.1);
                --tg-shadow-light: 0 0.5px 2px rgba(0, 0, 0, 0.3);
                --tg-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
                --tg-shadow-large: 0 4px 20px rgba(0, 0, 0, 0.35);
            }
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, var(--tg-bg-secondary) 0%, var(--tg-bg) 100%);
            color: var(--tg-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: 17px;
            line-height: 1.47;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }
        
        .profile-container {
            flex: 1;
            max-width: 428px;
            margin: 0 auto;
            width: 100%;
            padding: 8px 16px 88px;
            animation: slideInUp 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 16px;
            padding: 28px 24px;
            background: var(--tg-surface);
            border-radius: var(--tg-border-radius-large);
            box-shadow: var(--tg-shadow);
            transition: var(--tg-transition);
            position: relative;
            backdrop-filter: blur(20px);
            border: 1px solid var(--tg-divider);
            overflow: hidden;
            animation: slideInDown 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .profile-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--tg-primary), transparent);
            opacity: 0.5;
        }
        
        .profile-header:hover {
            transform: translateY(-3px);
            box-shadow: var(--tg-shadow-large);
        }
        
        .edit-button {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--tg-primary);
            font-size: 16px;
            font-weight: 500;
            background: rgba(51, 144, 236, 0.1);
            border: none;
            cursor: pointer;
            padding: 10px 16px;
            text-decoration: none;
            border-radius: var(--tg-border-radius);
            transition: var(--tg-transition-bounce);
            backdrop-filter: blur(20px);
        }

        .edit-button:hover {
            background: rgba(51, 144, 236, 0.2);
            transform: translateY(-2px) scale(1.05);
        }

        .edit-button:active {
            transform: scale(0.95);
        }
        
        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 600;
            color: white;
            margin-bottom: 20px;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--tg-primary), var(--tg-secondary));
            cursor: pointer;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: var(--tg-transition-bounce);
            position: relative;
            border: 3px solid var(--tg-divider);
            box-shadow: var(--tg-shadow-large);
            animation: fadeInScale 0.6s ease-out 0.2s both;
        }

        .profile-avatar::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--tg-primary), var(--tg-secondary));
            z-index: -1;
            animation: rotate 4s linear infinite;
        }

        .profile-avatar:hover {
            transform: scale(1.08) rotate(5deg);
            box-shadow: var(--tg-shadow-large);
        }

        .profile-avatar:active {
            transform: scale(0.95);
        }
        
        .profile-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 8px;
            animation: fadeInUp 0.5s ease-out 0.3s both;
        }
        
        .profile-nickname {
            font-size: 24px;
            font-weight: 700;
            color: var(--tg-text);
            text-align: center;
            letter-spacing: -0.02em;
        }
        
        .profile-id {
            font-size: 16px;
            color: var(--tg-text-secondary);
            font-weight: 500;
        }
        
        .profile-status {
            display: inline-flex;
            align-items: center;
            font-size: 15px;
            color: var(--tg-online);
            font-weight: 500;
            background: rgba(10, 198, 48, 0.1);
            padding: 6px 16px;
            border-radius: var(--tg-border-radius);
            backdrop-filter: blur(20px);
        }
        
        .profile-status::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--tg-online);
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        .profile-details {
            background: var(--tg-surface);
            border-radius: var(--tg-border-radius-large);
            padding: 0;
            box-shadow: var(--tg-shadow);
            animation: slideInUp 0.5s ease-out 0.4s both;
            backdrop-filter: blur(20px);
            border: 1px solid var(--tg-divider);
            overflow: hidden;
            position: relative;
        }

        .profile-details::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--tg-primary), transparent);
            opacity: 0.3;
        }

        .profile-details-title {
            font-size: 16px;
            color: var(--tg-text-secondary);
            padding: 20px 20px 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .detail-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            animation: fadeIn 0.4s ease-out both;
            opacity: 0;
            border-bottom: 1px solid var(--tg-divider);
            transition: var(--tg-transition);
            position: relative;
            overflow: hidden;
        }

        .detail-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0;
            background: linear-gradient(90deg, var(--tg-primary), transparent);
            transition: var(--tg-transition);
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-item:hover {
            background: var(--tg-bg-secondary);
            transform: translateX(8px);
        }

        .detail-item:hover::before {
            width: 4px;
        }

        .detail-label {
            width: 110px;
            color: var(--tg-text);
            font-size: 16px;
            flex-shrink: 0;
            margin-right: 20px;
            font-weight: 500;
        }

        .detail-value {
            flex: 1;
            font-size: 16px;
            font-weight: 400;
            color: var(--tg-text-secondary);
            min-width: 0;
            word-break: break-word;
        }
        
        .detail-item:nth-child(2) { animation-delay: 0.1s; }
        .detail-item:nth-child(3) { animation-delay: 0.15s; }
        .detail-item:nth-child(4) { animation-delay: 0.2s; }
        .detail-item:nth-child(5) { animation-delay: 0.25s; }
        .detail-item:nth-child(6) { animation-delay: 0.3s; }
        .detail-item:nth-child(7) { animation-delay: 0.35s; }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--tg-surface);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--tg-divider);
            backdrop-filter: blur(20px);
            z-index: 100;
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.1);
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--tg-text-hint);
            font-size: 10px;
            font-weight: 500;
            transition: var(--tg-transition-bounce);
            padding: 8px 16px;
            border-radius: var(--tg-border-radius);
            min-width: 70px;
            position: relative;
        }
        
        .nav-item i {
            font-size: 24px;
            margin-bottom: 4px;
            transition: var(--tg-transition-bounce);
        }

        .nav-item span {
            transition: var(--tg-transition);
        }
        
        .nav-item.active {
            color: var(--tg-primary);
        }

        .nav-item.active i {
            animation: bounceIn 0.6s ease;
        }
        
        .nav-item:hover i {
            transform: translateY(-4px) scale(1.15);
        }

        .nav-item:active {
            transform: scale(0.9);
        }
        
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(10px);
            opacity: 0;
            visibility: hidden;
            transition: var(--tg-transition);
        }
        
        .loading-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(51, 144, 236, 0.2);
            border-radius: 50%;
            border-top-color: var(--tg-primary);
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        .loading-text {
            color: white;
            font-size: 16px;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 24px;
            border-radius: var(--tg-border-radius);
            backdrop-filter: blur(20px);
        }
        
        .message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 16px 24px;
            border-radius: var(--tg-border-radius);
            font-size: 15px;
            font-weight: 500;
            z-index: 10000;
            box-shadow: var(--tg-shadow-large);
            backdrop-filter: blur(20px);
            transition: var(--tg-transition-bounce);
            opacity: 0;
        }

        .message-box.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .message-box.error {
            background: var(--tg-destructive);
            color: white;
        }

        .message-box.success {
            background: var(--tg-success);
            color: white;
        }
        
        /* Avatar Modal Styles */
        .avatar-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: var(--tg-transition);
            backdrop-filter: blur(20px);
            overflow-y: auto;
        }

        .avatar-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .avatar-modal-content {
            width: 90%;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            animation: zoomIn 0.4s ease;
            position: relative;
        }

        .avatar-modal img {
            max-width: 100%;
            max-height: 60vh;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            border-radius: var(--tg-border-radius-large);
            box-shadow: var(--tg-shadow-large);
        }

        .avatar-modal-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-top: 30px;
            animation: fadeInUp 0.4s ease-out 0.1s both;
        }

        .avatar-modal-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            padding: 14px 24px;
            transition: var(--tg-transition-bounce);
            border-radius: var(--tg-border-radius);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 120px;
            justify-content: center;
        }

        .avatar-modal-btn.change {
            background: rgba(51, 144, 236, 0.15);
            color: var(--tg-primary);
            border: 1px solid rgba(51, 144, 236, 0.3);
        }

        .avatar-modal-btn.delete {
            background: rgba(229, 62, 62, 0.15);
            color: var(--tg-destructive);
            border: 1px solid rgba(229, 62, 62, 0.3);
        }

        .avatar-modal-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: var(--tg-shadow-large);
        }

        .avatar-modal-btn:active {
            transform: scale(0.95);
        }

        .avatar-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: var(--tg-transition-bounce);
            background: rgba(0, 0, 0, 0.6);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(20px);
        }

        .avatar-modal-close:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: scale(1.1) rotate(90deg);
        }

        .avatar-modal-close:active {
            transform: scale(0.9);
        }
        
        @media (max-width: 428px) {
            .profile-container {
                padding: 8px 12px 88px;
            }

            .profile-avatar {
                width: 90px;
                height: 90px;
                font-size: 32px;
            }
            
            .profile-nickname {
                font-size: 22px;
            }
            
            .detail-item {
                flex-direction: column;
                align-items: flex-start;
                padding: 16px 20px;
            }
            
            .detail-label {
                width: 100%;
                margin-bottom: 6px;
                font-size: 14px;
                color: var(--tg-text-secondary);
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            .detail-value {
                font-size: 16px;
                color: var(--tg-text);
            }

            .avatar-modal-content {
                width: 95%;
                padding: 15px;
            }
            
            .avatar-modal img {
                max-height: 50vh;
            }
            
            .avatar-modal-close {
                top: 10px;
                right: 10px;
                font-size: 24px;
                width: 40px;
                height: 40px;
            }

            .avatar-modal-actions {
                gap: 16px;
                flex-wrap: wrap;
            }

            .avatar-modal-btn {
                min-width: 100px;
                padding: 12px 20px;
            }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        
        @keyframes rotate {
            to { transform: rotate(360deg); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes bounceIn {
            0%, 20%, 53%, 100% { transform: translateY(0) scale(1); }
            40%, 43% { transform: translateY(-8px) scale(1.1); }
            70% { transform: translateY(-4px) scale(1.05); }
            90% { transform: translateY(-2px) scale(1.02); }
        }
    </style>
</head>
<body>
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Загрузка профиля...</div>
    </div>

    <div class="profile-container">
        <!-- Message box for errors/success -->
        <div id="messageBox" class="message-box"></div>
        
        <!-- Profile header -->
        <div class="profile-header">
            <a href="https://t.me/VuntgramBot?start=myprofile" class="edit-button">Изменить</a>
            <div id="profile-avatar" class="profile-avatar"></div>
            <div class="profile-info">
                <div id="profile-nickname" class="profile-nickname">Загрузка...</div>
                <div id="profile-id" class="profile-id">ID: </div>
                <div class="profile-status">В сети</div>
            </div>
        </div>
        
        <!-- Profile details -->
        <div class="profile-details">
            <div class="profile-details-title">О себе</div>
            <div class="detail-item">
                <div class="detail-label">Школа</div>
                <div id="main-school" class="detail-value">Загрузка...</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Класс</div>
                <div id="user-class" class="detail-value">Загрузка...</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Роль</div>
                <div id="user-role" class="detail-value">Загрузка...</div>
            </div>
            <div id="additional-school-container" class="detail-item">
                <div class="detail-label">Доп. школа</div>
                <div id="additional-school" class="detail-value">Загрузка...</div>
            </div>
            <div id="specialization-container" class="detail-item">
                <div class="detail-label">Направление</div>
                <div id="user-specialization" class="detail-value">Загрузка...</div>
            </div>
            <div id="course-container" class="detail-item">
                <div class="detail-label">Курс</div>
                <div id="user-course" class="detail-value">Загрузка...</div>
            </div>
        </div>
    </div>

    <!-- Avatar Modal -->
    <div id="avatarModal" class="avatar-modal">
        <span class="avatar-modal-close">&times;</span>
        <div class="avatar-modal-content">
            <img id="avatarModalImage" src="" alt="Аватар">
            <div class="avatar-modal-actions">
                <button id="changeAvatarBtn" class="avatar-modal-btn change">
                    <i class="fas fa-camera"></i>
                    Изменить
                </button>
                <button id="deleteAvatarBtn" class="avatar-modal-btn delete">
                    <i class="fas fa-trash-alt"></i> 
                    Удалить
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom navigation -->
    <div class="bottom-nav">
        <a href="contacts.html" class="nav-item">
            <i class="fas fa-user-circle"></i>
            <span>Контакты</span>
        </a>
        
        <a href="chats.html" class="nav-item">
            <i class="fas fa-comments"></i>
            <span>Чаты</span>
        </a>
     
        <a href="profile.html" class="nav-item active">
            <i class="fas fa-cog"></i>
            <span>Профиль</span>
        </a>
    </div>

    <!-- Hidden file input for avatar upload -->
    <input type="file" id="avatar-input" accept="image/*" style="display: none;">

    <script>
        // Configuration - SET YOUR SERVER URL HERE
        const SERVER_URL = 'https://vuntserver-p1cx.onrender.com';
        
        // DOM elements
        const loadingOverlay = document.getElementById('loadingOverlay');
        const messageBox = document.getElementById('messageBox');
        const profileAvatar = document.getElementById('profile-avatar');
        const profileNickname = document.getElementById('profile-nickname');
        const profileId = document.getElementById('profile-id');
        const profileStatus = document.getElementById('profile-status');
        const mainSchool = document.getElementById('main-school');
        const userClass = document.getElementById('user-class');
        const userRole = document.getElementById('user-role');
        const additionalSchool = document.getElementById('additional-school');
        const userSpecialization = document.getElementById('user-specialization');
        const userCourse = document.getElementById('user-course');
        const additionalSchoolContainer = document.getElementById('additional-school-container');
        const specializationContainer = document.getElementById('specialization-container');
        const courseContainer = document.getElementById('course-container');
        const avatarInput = document.getElementById('avatar-input');
        
        // Avatar modal elements
        const avatarModal = document.getElementById('avatarModal');
        const avatarModalImage = document.getElementById('avatarModalImage');
        const avatarModalClose = document.querySelector('.avatar-modal-close');
        const changeAvatarBtn = document.getElementById('changeAvatarBtn');
        const deleteAvatarBtn = document.getElementById('deleteAvatarBtn');

        // Get user data from sessionStorage
        let userData = JSON.parse(sessionStorage.getItem('userData'));
        if (!userData || !userData.id) {
            window.location.href = 'index.html';
        }

        // Show message (error or success)
        function showMessage(message, type = 'error') {
            messageBox.textContent = message;
            messageBox.className = `message-box ${type} show`;
            setTimeout(() => {
                messageBox.classList.remove('show');
            }, 5000);
        }

        // Show loading overlay
        function showLoading(text = 'Загрузка...') {
            loadingOverlay.querySelector('.loading-text').textContent = text;
            loadingOverlay.classList.add('show');
        }

        // Hide loading overlay
        function hideLoading() {
            loadingOverlay.classList.remove('show');
        }

        // Adjust color brightness
        function adjustColor(hex, percent) {
            const num = parseInt(hex.replace("#", ""), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            
            return `#${
                (0x1000000 +
                (R < 255 ? (R < 1 ? 0 : R) : 255) * 0x10000 +
                (G < 255 ? (G < 1 ? 0 : G) : 255) * 0x100 +
                (B < 255 ? (B < 1 ? 0 : B) : 255)
            ).toString(16).slice(1)}`;
        }

        // Set avatar background (generated from letter)
        function setAvatarBackground(color, letter) {
            profileAvatar.textContent = letter;
            profileAvatar.style.backgroundImage = '';
            
            if (color) {
                const lighterColor = adjustColor(color, 20);
                profileAvatar.style.background = 
                    `linear-gradient(135deg, ${color}, ${lighterColor})`;
            } else {
                const avatarColors = [
                    ['#3390ec', '#40a7e3'],
                    ['#00c03e', '#4ade80'],
                    ['#e53e3e', '#f87171'],
                    ['#8b5cf6', '#c084fc'],
                    ['#f59e0b', '#fbbf24'],
                    ['#06b6d4', '#67e8f9'],
                    ['#ff8c00', '#fb923c'],
                ];
                const colorPair = avatarColors[Math.floor(Math.random() * avatarColors.length)];
                profileAvatar.style.background = 
                    `linear-gradient(135deg, ${colorPair[0]}, ${colorPair[1]})`;
            }
        }

        // Load avatar from server
        function loadAvatar(userId) {
            const avatarUrl = `${SERVER_URL}/avatar/${userId}?t=${Date.now()}`;
            const img = new Image();
            
            img.onload = function() {
                profileAvatar.style.backgroundImage = `url(${avatarUrl})`;
                profileAvatar.style.backgroundSize = 'cover';
                profileAvatar.style.backgroundPosition = 'center';
                profileAvatar.textContent = '';
                sessionStorage.removeItem('tempAvatar');
                
                if (userData) {
                    userData.has_avatar_photo = true;
                    sessionStorage.setItem('userData', JSON.stringify(userData));
                }
            };
            
            img.onerror = function() {
                console.error('Failed to load avatar from server, generating background.');
                if (userData) {
                    setAvatarBackground(
                        userData.avatar_background,
                        userData.nickname?.charAt(0).toUpperCase() || '?'
                    );
                    userData.has_avatar_photo = false;
                    sessionStorage.setItem('userData', JSON.stringify(userData));
                }
            };
            
            img.src = avatarUrl;
        }

        // Handle avatar upload
        async function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            avatarInput.value = '';

            if (!file.type.match('image.*')) {
                showMessage('Пожалуйста, выберите файл изображения (PNG, JPG, GIF).');
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                showMessage('Размер изображения не должен превышать 5MB.');
                return;
            }

            showLoading('Загрузка аватарки...');

            const formData = new FormData();
            formData.append('avatar', file);
            formData.append('platform_user_id', userData.platform_user_id);

            try {
                const response = await fetch(`${SERVER_URL}/upload_avatar`, {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Неизвестная ошибка загрузки.');
                }
                
                if (data.status !== 'success') {
                    throw new Error(data.message || data.error || 'Ошибка загрузки.');
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    profileAvatar.style.backgroundImage = `url(${e.target.result})`;
                    profileAvatar.style.backgroundSize = 'cover';
                    profileAvatar.style.backgroundPosition = 'center';
                    profileAvatar.textContent = '';
                    sessionStorage.setItem('tempAvatar', e.target.result);
                    showMessage('Аватар успешно загружен!', 'success');
                    hideLoading();
                };
                reader.readAsDataURL(file);

                userData.has_avatar_photo = true;
                userData.avatar_background = data.avatar_background || userData.avatar_background;
                sessionStorage.setItem('userData', JSON.stringify(userData));

                setTimeout(() => {
                    loadAvatar(userData.platform_user_id);
                }, 1000);

            } catch (error) {
                showMessage('Ошибка загрузки: ' + error.message);
                hideLoading();
                
                if (userData) {
                    if (userData.has_avatar_photo) {
                        loadAvatar(userData.platform_user_id);
                    } else {
                        setAvatarBackground(
                            userData.avatar_background, 
                            userData.nickname.charAt(0).toUpperCase()
                        );
                    }
                }
                sessionStorage.removeItem('tempAvatar');
            }
        }

        // Handle avatar removal
        async function handleAvatarRemove() {
            showLoading('Удаление аватарки...');

            try {
                const response = await fetch(`${SERVER_URL}/remove_avatar`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        platform_user_id: userData.platform_user_id
                    })
                });
                
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Неизвестная ошибка удаления.');
                }
                
                if (data.status !== 'success') {
                    throw new Error(data.message || data.error || 'Ошибка удаления.');
                }
                
                userData.has_avatar_photo = false;
                userData.avatar_background = data.avatar_background || userData.avatar_background;
                sessionStorage.setItem('userData', JSON.stringify(userData));
                sessionStorage.removeItem('tempAvatar');
                
                setAvatarBackground(
                    userData.avatar_background,
                    userData.nickname.charAt(0).toUpperCase()
                );
                
                showMessage('Аватар успешно удален!', 'success');
            } catch (error) {
                showMessage('Ошибка удаления: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        // Fetch updated user data from server
        async function fetchUserData() {
            try {
                const response = await fetch(`${SERVER_URL}/get_user_data`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        platform_user_id: userData.platform_user_id
                    }),
                    credentials: 'include'
                });

                const data = await response.json();

                if (data.status === 'success') {
                    userData = {
                        ...userData,
                        ...data.user,
                        has_avatar_photo: data.user.has_avatar
                    };
                    sessionStorage.setItem('userData', JSON.stringify(userData));
                    return true;
                } else {
                    throw new Error(data.error || 'Ошибка загрузки данных');
                }
            } catch (error) {
                console.error('Error fetching user data:', error);
                return false;
            }
        }

        // Update profile UI with user data
        function updateProfileUI() {
            const nickname = userData.nickname || '';
            const firstLetter = nickname.charAt(0).toUpperCase() || '?';
            const bgColor = userData.avatar_background;
            
            const tempAvatar = sessionStorage.getItem('tempAvatar');
            
            if (tempAvatar) {
                profileAvatar.style.backgroundImage = `url(${tempAvatar})`;
                profileAvatar.textContent = '';
            } else if (userData.has_avatar_photo) {
                loadAvatar(userData.platform_user_id);
            } else {
                setAvatarBackground(bgColor, firstLetter);
            }
            
            profileNickname.textContent = nickname || 'Не указано';
            profileId.textContent = `ID: ${userData.platform_user_id || 'Не указано'}`;
            
            userRole.textContent = userData.identity || 'Не указано';
            
            mainSchool.textContent = userData.main_school_name || 'Не указано';
            
            if (userData.class_number && userData.class_letter) {
                userClass.textContent = `${userData.class_number}${userData.class_letter}`;
            } else {
                userClass.textContent = 'Не указано';
            }
            
            const additionalSchoolValue = userData.additional_school_name;
            const hasAdditionalSchool = additionalSchoolValue && 
                                      additionalSchoolValue !== 'Не указано' && 
                                      additionalSchoolValue !== 'не указано' && 
                                      additionalSchoolValue.trim() !== '';
            
            if (!hasAdditionalSchool) {
                additionalSchoolContainer.style.display = 'none';
                specializationContainer.style.display = 'none';
                courseContainer.style.display = 'none';
            } else {
                additionalSchoolContainer.style.display = 'flex';
                specializationContainer.style.display = 'flex';
                courseContainer.style.display = 'flex';

                additionalSchool.textContent = additionalSchoolValue;
                userSpecialization.textContent = userData.specialization || 'Не указано';
                userCourse.textContent = userData.course || 'Не указано';
            }
        }

        // Open avatar modal
        function openAvatarModal() {
            if (!userData.has_avatar_photo && !sessionStorage.getItem('tempAvatar')) return;
            
            const avatarUrl = sessionStorage.getItem('tempAvatar') || 
                             `${SERVER_URL}/avatar/${userData.platform_user_id}?t=${Date.now()}`;
            
            avatarModalImage.src = avatarUrl;
            avatarModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Close avatar modal
        function closeAvatarModal() {
            avatarModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Load profile data
        async function loadProfileData() {
            showLoading();
            try {
                const dataUpdated = await fetchUserData();
                
                if (!dataUpdated) {
                    console.warn('Using cached data from sessionStorage');
                }
                
                updateProfileUI();
            } catch (error) {
                console.error('Profile loading error:', error);
                showMessage('Ошибка загрузки профиля. Пожалуйста, попробуйте войти снова.', 'error');
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 5000);
            } finally {
                hideLoading();
            }
        }

        // Event listeners
        profileAvatar.addEventListener('click', () => {
            if (userData.has_avatar_photo || sessionStorage.getItem('tempAvatar')) {
                openAvatarModal();
            } else {
                avatarInput.click();
            }
        });

        avatarInput.addEventListener('change', handleAvatarUpload);

        // Avatar modal events
        avatarModalClose.addEventListener('click', closeAvatarModal);
        avatarModal.addEventListener('click', (e) => {
            if (e.target === avatarModal) {
                closeAvatarModal();
            }
        });

        changeAvatarBtn.addEventListener('click', () => {
            closeAvatarModal();
            avatarInput.click();
        });

        deleteAvatarBtn.addEventListener('click', () => {
            closeAvatarModal();
            if (confirm('Удалить аватар?')) {
                handleAvatarRemove();
            }
        });

        // Initialize profile
        window.addEventListener('DOMContentLoaded', loadProfileData);

        // Handle back/forward cache (BFCache)
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                loadProfileData();
            }
        });
    </script>
</body>
</html>
