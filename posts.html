<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Посты - TheVuntgram</title>
    <link rel="stylesheet" href="assets/animate/animate.min.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">

    <!-- Мультяшный «желейный» шрифт для заголовка «Рекомендации» (кириллица) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2d5e4f">
    <link rel="icon" type="image/png" href="icon-192x192.png">
    <link rel="apple-touch-icon" href="icon-192x192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vuntgram">
    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#2d5e4f">
    <meta name="msapplication-TileImage" content="icon-512x512.png">

    <style>
        @import url('assets/fonts/inter.css');

        :root {
            --telegram-bg: #ffffff;
            --telegram-secondary-bg: #f4f4f5;
            --telegram-text: #000000;
            --telegram-hint: #8e8e93;
            --telegram-divider: rgba(0,0,0,0.08);
            --telegram-shadow: 0 1px 3px rgba(0,0,0,0.06);
            --desktop-sidebar-width: 340px;

            --vg-blue: #0a84ff;                 /* как кнопка «+» в списке чатов */
            --vg-purple: #9501ff;               /* как исходящее сообщение */
            --vg-purple-2: #a043fd;
            --vg-purple-gradient: linear-gradient(135deg, #9501ff, #a043fd);
            --rec-title-color: #000000;
            --rec-row-hover: rgba(120, 120, 128, 0.08);
            --rec-row-active: rgba(149, 1, 255, 0.07);

            --animation-timing: cubic-bezier(0.4, 0, 0.2, 1);
            --jelly-timing: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --telegram-bg: #212121;
                --telegram-secondary-bg: #1d1d1d;
                --telegram-text: #ffffff;
                --telegram-hint: #8e8e93;
                --telegram-divider: rgba(255,255,255,0.12);
                --telegram-shadow: 0 1px 3px rgba(0,0,0,0.24);
                --rec-title-color: #ffffff;
                --rec-row-hover: rgba(120, 120, 128, 0.18);
                --rec-row-active: rgba(160, 67, 253, 0.16);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes telegramPageIn { from { opacity: 0; } to { opacity: 1; } }
        html { animation: telegramPageIn 0.35s ease-out both; }

        body {
            background-color: var(--telegram-secondary-bg);
            color: var(--telegram-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        button { font: inherit; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounceIn {
            0%   { opacity: 0; transform: scale(0.6); }
            60%  { opacity: 1; transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* ============ Видимость мобильных / десктопных частей ============ */
        .desktop-sidebar,
        .desktop-content,
        .desktop-only-nav { display: none; }
        .mobile-only-nav { display: flex; }

        /* ============ Кнопка «три полоски» (фиолетовая, без рамки) ============ */
        .rec-toggle {
            width: 30px;
            height: 30px;
            border: none;
            background: transparent;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 10px;
            transition: transform 0.2s var(--animation-timing), opacity 0.2s ease;
            animation: bounceIn 0.5s var(--animation-timing);
        }
        .rec-toggle:active { transform: scale(0.88); }
        .rec-toggle svg { width: 24px; height: 24px; display: block; }
        .rec-toggle .bar {
            stroke: var(--vg-purple);
            stroke-width: 2.4;
            stroke-linecap: round;
            transition: transform 0.3s var(--jelly-timing);
            transform-origin: left center;
        }
        .rec-toggle:hover .bar-2 { transform: scaleX(0.78); }
        .rec-toggle:hover .bar-3 { transform: scaleX(0.55); }

        /* ============ Круглая фиолетовая кнопка «+» ============ */
        .add-post-button {
            background: var(--vg-purple-gradient);
            color: #fff;
            border: none;
            width: 30px;
            height: 30px;
            min-width: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(149, 1, 255, 0.35);
            transition: transform 0.3s var(--animation-timing), box-shadow 0.3s var(--animation-timing);
            animation: bounceIn 0.5s var(--animation-timing);
        }
        .add-post-button:hover {
            transform: translateY(-1px) scale(1.08) rotate(90deg);
            box-shadow: 0 4px 12px rgba(149, 1, 255, 0.45);
        }
        .add-post-button:active { transform: scale(0.92) rotate(90deg); }

        /* ============ Мобильная страница ============ */
        .posts-container {
            flex: 1;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .posts-header-sticky {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--telegram-bg);
            border-bottom: 1px solid var(--telegram-divider);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: calc(16px + env(safe-area-inset-top)) 12px 14px 12px;
            flex-shrink: 0;
            animation: slideInDown 0.3s var(--animation-timing);
        }

        .posts-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--telegram-text);
        }
        .posts-title .header-side {
            flex: 0 0 auto;
            width: 33px;
            display: flex;
        }
        .posts-title .header-side.right { justify-content: flex-end; }

        .posts-feed {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding: 12px 12px 110px;
            display: flex;
            flex-direction: column;
            scrollbar-width: thin;
            scrollbar-color: var(--telegram-hint) transparent;
        }
        .posts-feed::-webkit-scrollbar { width: 4px; }
        .posts-feed::-webkit-scrollbar-thumb { background: var(--telegram-hint); border-radius: 2px; }

        .posts-list { display: flex; flex-direction: column; gap: 12px; }
        .posts-list:empty { display: none; }

        /* «Пусто» строго по центру экрана */
        .posts-empty {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            color: var(--telegram-hint);
            font-size: 17px;
            font-weight: 500;
            letter-spacing: 0.2px;
            animation: fadeIn 0.4s ease-out 0.15s both;
        }
        .posts-empty[hidden] { display: none; }

        /* ============ Окно «Рекомендации» (мобильное, выезжает слева) ============ */
        .rec-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);   /* чёрная, прозрачность 80% */
            z-index: 900;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0s linear 0.3s;
        }
        .rec-backdrop.open {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.3s ease, visibility 0s;
        }

        .rec-drawer {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            width: 66%;
            min-width: 250px;
            max-width: 330px;
            z-index: 1000;
            background: transparent;
            border-radius: 0 34px 34px 0;
            padding: calc(26px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)) 18px;
            transform: translateX(calc(-100% - 90px));
            transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
            will-change: transform;
        }
        .rec-drawer.open { transform: translateX(0); }
        .rec-bg {
            position: absolute;
            inset: 0;
            background: var(--telegram-bg);
            border-radius: inherit;
            z-index: -1;
            pointer-events: none;
        }
        .rec-drawer.dragging { transition: none; }

        /* Воздушное полукруглое фиолетовое свечение, которое переливается */
        .rec-glow {
            position: absolute;
            top: 8%;
            bottom: 8%;
            right: -46px;
            width: 92px;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            background:
                radial-gradient(ellipse at 30% 30%, rgba(160, 67, 253, 0.85), transparent 62%),
                radial-gradient(ellipse at 40% 75%, rgba(149, 1, 255, 0.75), transparent 60%),
                radial-gradient(ellipse at 20% 50%, rgba(214, 140, 255, 0.7), transparent 70%);
            filter: blur(26px);
            opacity: 0;
            transition: opacity 0.5s ease 0.1s;
        }
        .rec-drawer.open .rec-glow {
            opacity: 1;
            animation: glowShimmer 4.5s ease-in-out infinite;
        }
        .rec-glow.second {
            top: 25%;
            bottom: 25%;
            right: -30px;
            width: 60px;
            filter: blur(20px);
            background: radial-gradient(ellipse at center, rgba(197, 120, 255, 0.9), transparent 70%);
        }
        .rec-drawer.open .rec-glow.second { animation: glowShimmer2 3.2s ease-in-out infinite; }

        @keyframes glowShimmer {
            0%   { transform: translateY(-6%) scaleY(0.94); filter: blur(26px) hue-rotate(0deg);   opacity: 0.75; }
            50%  { transform: translateY(6%)  scaleY(1.06); filter: blur(30px) hue-rotate(-28deg); opacity: 1; }
            100% { transform: translateY(-6%) scaleY(0.94); filter: blur(26px) hue-rotate(0deg);   opacity: 0.75; }
        }
        @keyframes glowShimmer2 {
            0%   { transform: translateY(14%)  scale(0.9); opacity: 0.4; filter: blur(20px) hue-rotate(0deg); }
            50%  { transform: translateY(-14%) scale(1.1); opacity: 0.9; filter: blur(24px) hue-rotate(24deg); }
            100% { transform: translateY(14%)  scale(0.9); opacity: 0.4; filter: blur(20px) hue-rotate(0deg); }
        }

        /* ============ Содержимое окна рекомендаций ============ */
        .rec-title {
            font-family: 'Nunito', 'Arial Rounded MT Bold', 'Comfortaa', 'Trebuchet MS', sans-serif;
            font-weight: 900;
            font-size: 27px;
            line-height: 1.1;
            letter-spacing: -0.01em;
            color: var(--rec-title-color);
            text-align: left;
            padding: 0 6px;
            margin-bottom: 18px;
            transform-origin: left bottom;
            display: inline-block;
            align-self: flex-start;
        }
        .rec-drawer.open .rec-title { animation: jelly 0.9s var(--animation-timing) 0.12s both; }
        .rec-title:active { animation: jelly 0.7s var(--animation-timing); }

        @keyframes jelly {
            0%   { transform: scale(1, 1); }
            25%  { transform: scale(0.9, 1.12); }
            40%  { transform: scale(1.12, 0.9); }
            55%  { transform: scale(0.96, 1.04); }
            70%  { transform: scale(1.03, 0.98); }
            100% { transform: scale(1, 1); }
        }

        .rec-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow-y: auto;
            margin: 0 -4px;
            padding: 0 4px;
            scrollbar-width: none;
        }
        .rec-list::-webkit-scrollbar { display: none; }

        .rec-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            border: none;
            background: transparent;
            color: var(--telegram-text);
            text-align: left;
            padding: 11px 8px 11px 10px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: -0.01em;
            transition: background-color 0.2s ease, transform 0.18s var(--animation-timing);
        }
        .rec-item:hover { background-color: var(--rec-row-hover); }
        .rec-item:active { transform: scale(0.97); }

        .rec-item-label {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .rec-item.active { background-color: var(--rec-row-active); font-weight: 700; }
        .rec-item.active .rec-item-label { color: var(--vg-purple); }
        @media (prefers-color-scheme: dark) {
            .rec-item.active .rec-item-label { color: #c78bff; }
        }

        /* Белая стрелка в круглой синей рамке, без теней */
        .rec-arrow {
            flex: 0 0 auto;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--vg-blue);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            box-shadow: none;
            transition: transform 0.25s var(--jelly-timing);
        }
        .rec-item:hover .rec-arrow { transform: translateX(3px); }

        /* Появление пунктов лесенкой */
        .rec-drawer .rec-item { opacity: 0; transform: translateX(-12px); }
        .rec-drawer.open .rec-item {
            animation: recItemIn 0.38s var(--animation-timing) both;
            animation-delay: calc(0.08s + var(--i) * 0.035s);
        }
        @keyframes recItemIn {
            from { opacity: 0; transform: translateX(-12px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* ============ Футер (как на остальных страницах) ============ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            margin: 0 auto calc(20px + env(safe-area-inset-bottom));
            width: calc(100% - 84px);
            max-width: 396px;
            background: rgba(255, 255, 255, 0.92);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            backdrop-filter: blur(20px) saturate(180%);
            justify-content: space-evenly;
            align-items: center;
            gap: 10px;
            padding: 4px 14px;
            border: none;
            border-radius: 34px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
            z-index: 100;
            overflow: hidden;
        }
        @media (prefers-color-scheme: dark) {
            .bottom-nav {
                background: rgba(33, 33, 33, 0.85);
                box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.24);
            }
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--telegram-hint);
            font-size: 10px;
            font-weight: 500;
            transition: all 0.22s ease;
            padding: 6px 4px;
            border-radius: 30px;
            flex: 1 1 0;
            min-width: 0;
        }
        .nav-icon-wrap {
            position: relative;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 34px;
            border-radius: 17px;
            margin-bottom: 1px;
            transition: background-color 0.25s ease, transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-badge {
            position: absolute;
            top: 1px;
            left: 50%;
            margin-left: 4px;
            display: none;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff5252;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
            pointer-events: none;
            z-index: 5;
        }
        .nav-badge.visible { display: flex; }
        .nav-item i { font-size: 22px; transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .nav-item .nav-svg {
            width: 23px;
            height: 23px;
            display: block;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-item span {
            transition: all 0.2s ease;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .nav-item.active { color: #0a84ff; background-color: rgba(120, 120, 128, 0.16); }
        @media (prefers-color-scheme: dark) {
            .nav-item.active { background-color: rgba(120, 120, 128, 0.32); }
        }
        .nav-item.active i,
        .nav-item.active .nav-svg { transform: scale(1.05); }
        .nav-item:hover .nav-icon-wrap { transform: scale(1.05); }
        .nav-item:active .nav-icon-wrap { transform: scale(0.93); }


        /* ============ Десктоп ============ */
        @media (min-width: 768px) {
            body { flex-direction: row; }

            .mobile-only,
            .mobile-only-nav,
            .rec-backdrop { display: none !important; }

            .desktop-only-nav { display: flex; }

            .desktop-sidebar {
                display: flex;
                flex-direction: column;
                width: var(--desktop-sidebar-width);
                height: 100vh;
                position: fixed;
                left: 0;
                top: 0;
                z-index: 10;
                background-color: var(--telegram-bg);
                border-right: 1px solid var(--telegram-divider);
                overflow: hidden;
            }

            /* Окно рекомендаций на десктопе: всегда открыто, без свечения и затемнения */
            .rec-panel-desktop {
                flex: 1;
                display: flex;
                flex-direction: column;
                min-height: 0;
                padding: 26px 18px 110px 20px;
                animation: fadeIn 0.3s ease-out;
            }
            .rec-panel-desktop .rec-title { animation: jelly 0.9s var(--animation-timing) 0.15s both; }
            .rec-panel-desktop .rec-item { animation: recItemIn 0.38s var(--animation-timing) both; animation-delay: calc(0.08s + var(--i) * 0.035s); }

            .bottom-nav.desktop-only-nav {
                position: fixed;
                bottom: 0;
                left: 28px;
                right: auto;
                width: calc(var(--desktop-sidebar-width) - 56px);
                max-width: none;
                margin: 0 0 calc(20px + env(safe-area-inset-bottom)) 0;
                z-index: 20;
            }

            .desktop-content {
                display: flex;
                flex-direction: column;
                margin-left: var(--desktop-sidebar-width);
                flex: 1;
                height: 100vh;
                position: relative;
                background-color: var(--telegram-secondary-bg);
                overflow: hidden;
            }

            .posts-topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                min-height: 62px;
                padding: 14px 20px;
                background: var(--telegram-bg);
                border-bottom: 1px solid var(--telegram-divider);
                flex-shrink: 0;
                animation: slideInDown 0.3s var(--animation-timing);
            }
            .posts-topbar-title {
                font-size: 18px;
                font-weight: 700;
                letter-spacing: -0.02em;
                color: var(--telegram-text);
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .posts-feed-desktop {
                flex: 1;
                position: relative;
                overflow-y: auto;
                padding: 20px;
            }
            .posts-feed-desktop .posts-list {
                max-width: 600px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <!-- Градиент для «трёх полосок» (цвет как у исходящего сообщения) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <linearGradient id="vgPurpleStroke" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#9501ff"/>
                <stop offset="1" stop-color="#a043fd"/>
            </linearGradient>
        </defs>
    </svg>

    <!-- ===================== ДЕСКТОП ===================== -->
    <div class="desktop-sidebar">
        <div class="rec-panel-desktop">
            <div class="rec-title">Рекомендации</div>
            <ul class="rec-list" data-rec-list></ul>
        </div>

        <div class="bottom-nav desktop-only-nav">
            <a href="contacts.html" class="nav-item">
                <span class="nav-icon-wrap"><i class="fas fa-user-circle"></i></span>
                <span>Контакты</span>
            </a>

            <a href="posts.html" class="nav-item active">
                <span class="nav-icon-wrap"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M9 2.5h6A6.5 6.5 0 0 1 21.5 9v6a6.5 6.5 0 0 1-6.5 6.5H9A6.5 6.5 0 0 1 2.5 15V9A6.5 6.5 0 0 1 9 2.5Zm3 4.3c-.55 2.95-2.25 4.65-5.2 5.2 2.95.55 4.65 2.25 5.2 5.2.55-2.95 2.25-4.65 5.2-5.2-2.95-.55-4.65-2.25-5.2-5.2Z"/></svg></span>
                <span>Посты</span>
            </a>

            <a href="chats.html" class="nav-item">
                <span class="nav-icon-wrap"><i class="fas fa-comments"></i><span class="nav-badge" data-nav-badge="chats"></span></span>
                <span>Чаты</span>
            </a>

            <a href="profile.html" class="nav-item">
                <span class="nav-icon-wrap"><i class="fas fa-cog"></i></span>
                <span>Профиль</span>
            </a>
        </div>
    </div>

    <div class="desktop-content">
        <div class="posts-topbar">
            <div class="posts-topbar-title" id="currentCategoryDesktop">Всё сразу</div>
            <button class="add-post-button" id="addPostButtonDesktop" type="button" aria-label="Новый пост">
                <i class="fas fa-plus"></i>
            </button>
        </div>
        <div class="posts-feed-desktop">
            <div class="posts-list" id="postsListDesktop"></div>
            <div class="posts-empty" id="postsEmptyDesktop">Пусто</div>
        </div>
    </div>

    <!-- ===================== МОБИЛЬНАЯ ВЕРСИЯ ===================== -->
    <div class="posts-container mobile-only">
        <div class="posts-header-sticky">
            <div class="posts-title">
                <div class="header-side">
                    <button class="rec-toggle" id="recToggle" type="button" aria-label="Рекомендации" aria-controls="recDrawer" aria-expanded="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <line class="bar bar-1" x1="3.5" y1="6"  x2="20.5" y2="6"/>
                            <line class="bar bar-2" x1="3.5" y1="12" x2="20.5" y2="12"/>
                            <line class="bar bar-3" x1="3.5" y1="18" x2="20.5" y2="18"/>
                        </svg>
                    </button>
                </div>
                <div class="header-center">Посты</div>
                <div class="header-side right">
                    <button class="add-post-button" id="addPostButtonMobile" type="button" aria-label="Новый пост">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="posts-feed">
            <div class="posts-list" id="postsListMobile"></div>
        </div>
        <div class="posts-empty" id="postsEmptyMobile">Пусто</div>
    </div>

    <!-- Затемнение поверх постов и само окно рекомендаций (мобильная версия) -->
    <div class="rec-backdrop" id="recBackdrop"></div>
    <aside class="rec-drawer mobile-only" id="recDrawer" aria-hidden="true">
        <div class="rec-glow"></div>
        <div class="rec-glow second"></div>
        <div class="rec-bg"></div>
        <div class="rec-title">Рекомендации</div>
        <ul class="rec-list" data-rec-list></ul>
    </aside>

    <div class="bottom-nav mobile-only-nav">
        <a href="contacts.html" class="nav-item">
            <span class="nav-icon-wrap"><i class="fas fa-user-circle"></i></span>
            <span>Контакты</span>
        </a>

        <a href="posts.html" class="nav-item active">
            <span class="nav-icon-wrap"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M9 2.5h6A6.5 6.5 0 0 1 21.5 9v6a6.5 6.5 0 0 1-6.5 6.5H9A6.5 6.5 0 0 1 2.5 15V9A6.5 6.5 0 0 1 9 2.5Zm3 4.3c-.55 2.95-2.25 4.65-5.2 5.2 2.95.55 4.65 2.25 5.2 5.2.55-2.95 2.25-4.65 5.2-5.2-2.95-.55-4.65-2.25-5.2-5.2Z"/></svg></span>
            <span>Посты</span>
        </a>

        <a href="chats.html" class="nav-item">
            <span class="nav-icon-wrap"><i class="fas fa-comments"></i><span class="nav-badge" data-nav-badge="chats"></span></span>
            <span>Чаты</span>
        </a>

        <a href="profile.html" class="nav-item">
            <span class="nav-icon-wrap"><i class="fas fa-cog"></i></span>
            <span>Профиль</span>
        </a>
    </div>

    <script>
    (function () {
        'use strict';

        // Разделы рекомендаций (порядок важен)
        var CATEGORIES = [
            { id: 'all',          title: 'Всё сразу' },
            { id: 'education',    title: 'Образование' },
            { id: 'sport',        title: 'Спорт' },
            { id: 'lifehacks',    title: 'Лайфхаки' },
            { id: 'creativity',   title: 'Творчество' },
            { id: 'achievements', title: 'Достижения' },
            { id: 'nature',       title: 'Природа' },
            { id: 'travel',       title: 'Путешествия' }
        ];

        // Пока без сервера: постов нет. Позже сюда придут данные с бэкенда.
        var posts = [];
        var current = 'all';
        try {
            var saved = localStorage.getItem('vg_posts_category');
            if (saved && CATEGORIES.some(function (c) { return c.id === saved; })) current = saved;
        } catch (e) {}

        var drawer   = document.getElementById('recDrawer');
        var backdrop = document.getElementById('recBackdrop');
        var toggle   = document.getElementById('recToggle');
        var isDesktop = window.matchMedia('(min-width: 768px)');

        // ---------- Список рекомендаций ----------
        function buildLists() {
            document.querySelectorAll('[data-rec-list]').forEach(function (list) {
                list.innerHTML = '';
                CATEGORIES.forEach(function (cat, i) {
                    var li = document.createElement('li');
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'rec-item' + (cat.id === current ? ' active' : '');
                    btn.dataset.category = cat.id;
                    btn.style.setProperty('--i', i);
                    btn.innerHTML =
                        '<span class="rec-item-label"></span>' +
                        '<span class="rec-arrow" aria-hidden="true"><i class="fas fa-chevron-right"></i></span>';
                    btn.querySelector('.rec-item-label').textContent = cat.title;
                    li.appendChild(btn);
                    list.appendChild(li);
                });
            });
        }

        function selectCategory(id) {
            current = id;
            try { localStorage.setItem('vg_posts_category', id); } catch (e) {}
            document.querySelectorAll('.rec-item').forEach(function (el) {
                el.classList.toggle('active', el.dataset.category === id);
            });
            var cat = CATEGORIES.filter(function (c) { return c.id === id; })[0];
            var t = document.getElementById('currentCategoryDesktop');
            if (t && cat) t.textContent = cat.title;
            renderPosts();
            if (!isDesktop.matches) setTimeout(closeDrawer, 160);
        }

        // Нажатие на строку или на стрелку — одинаково
        document.addEventListener('click', function (e) {
            var item = e.target.closest('.rec-item');
            if (item) selectCategory(item.dataset.category);
        });

        // ---------- Посты ----------
        function renderPosts() {
            var visible = posts.filter(function (p) {
                return current === 'all' || p.category === current;
            });
            ['Mobile', 'Desktop'].forEach(function (suffix) {
                var list  = document.getElementById('postsList' + suffix);
                var empty = document.getElementById('postsEmpty' + suffix);
                list.innerHTML = '';
                // Здесь будет отрисовка карточек постов, когда появится сервер
                empty.hidden = visible.length > 0;
            });
        }

        // ---------- Открытие / закрытие окна (мобильная версия) ----------
        function openDrawer() {
            drawer.classList.add('open');
            backdrop.classList.add('open');
            drawer.setAttribute('aria-hidden', 'false');
            toggle.setAttribute('aria-expanded', 'true');
        }
        function closeDrawer() {
            drawer.classList.remove('open');
            backdrop.classList.remove('open');
            drawer.setAttribute('aria-hidden', 'true');
            toggle.setAttribute('aria-expanded', 'false');
            drawer.style.transform = '';
        }

        toggle.addEventListener('click', function () {
            drawer.classList.contains('open') ? closeDrawer() : openDrawer();
        });
        backdrop.addEventListener('click', closeDrawer);
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeDrawer();
        });
        isDesktop.addEventListener && isDesktop.addEventListener('change', function (e) {
            if (e.matches) closeDrawer();
        });

        // Смахивание окна влево
        var startX = null, dx = 0;
        drawer.addEventListener('touchstart', function (e) {
            startX = e.touches[0].clientX; dx = 0;
            drawer.classList.add('dragging');
        }, { passive: true });
        drawer.addEventListener('touchmove', function (e) {
            if (startX === null) return;
            dx = Math.min(0, e.touches[0].clientX - startX);
            drawer.style.transform = 'translateX(' + dx + 'px)';
        }, { passive: true });
        drawer.addEventListener('touchend', function () {
            drawer.classList.remove('dragging');
            drawer.style.transform = '';
            if (dx < -60) closeDrawer();
            startX = null;
        });

        // ---------- Кнопка «+» (пока только визуально) ----------
        ['addPostButtonMobile', 'addPostButtonDesktop'].forEach(function (id) {
            var b = document.getElementById(id);
            if (b) b.addEventListener('click', function () { /* создание поста — позже */ });
        });

        buildLists();
        selectCategory(current);
    })();
    </script>
</body>
