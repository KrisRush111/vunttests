<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чаты - TheVuntgram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    :root {
        --tg-theme-bg-color: #17212b;
        --tg-theme-secondary-bg-color: #242f3d;
        --tg-theme-header-bg-color: #242f3d;
        --tg-theme-section-bg-color: #ffffff;
        --tg-theme-text-color: #000000;
        --tg-theme-hint-color: #708499;
        --tg-theme-link-color: #2481cc;
        --tg-theme-button-color: #2481cc;
        --tg-theme-button-text-color: #ffffff;
        --tg-theme-destructive-text-color: #ee686f;
        --telegram-blue: #0088cc;
        --telegram-light-blue: #40a7e3;
        --telegram-bg: #ffffff;
        --telegram-secondary-bg: #f4f4f5;
        --telegram-text: #000000;
        --telegram-hint: #8e8e93;
        --online-green: #00c73c;
        --telegram-divider: rgba(0,0,0,0.08);
        --telegram-shadow: 0 1px 3px rgba(0,0,0,0.06);
        --telegram-shadow-large: 0 4px 16px rgba(0,0,0,0.08);
        --telegram-destructive: #ee686f;
        --telegram-success: #00c73c;
        --desktop-sidebar-width: 340px;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --telegram-bg: #212121;
            --telegram-secondary-bg: #1d1d1d;
            --telegram-text: #ffffff;
            --telegram-hint: #8e8e93;
            --telegram-divider: rgba(255,255,255,0.12);
            --telegram-shadow: 0 1px 3px rgba(0,0,0,0.24);
            --telegram-shadow-large: 0 4px 16px rgba(0,0,0,0.24);
        }
    }
    
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    body {
        background-color: var(--telegram-secondary-bg);
        color: var(--telegram-text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }
    
    /* Desktop layout */
    @media (min-width: 768px) {
        body {
            flex-direction: row;
        }
        
        .desktop-sidebar {
            width: var(--desktop-sidebar-width);
            height: 100vh;
            background-color: var(--telegram-bg);
            border-right: 1px solid var(--telegram-divider);
            overflow: hidden;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }
        
        .desktop-content {
            margin-left: var(--desktop-sidebar-width);
            flex: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: url('https://s14.gifyu.com/images/bNh1k.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .desktop-placeholder {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .desktop-placeholder h3 {
            color: white;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-bottom: 8px;
            padding: 5px 12px;
            border-radius: 24px;
            background-color: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: fit-content;
            max-width: 70%;
            text-align: center;
            line-height: 1.4;
            margin: 0;
        }
        
        .chats-container {
            max-width: 100%;
            width: 100%;
            padding: 0;
            margin: 0;
            animation: none;
        }
        
        .search-container {
            border-radius: 0;
            margin-bottom: 0;
            box-shadow: none;
            border-bottom: 1px solid var(--telegram-divider);
        }
        
        .chats-content {
            border-radius: 0;
            box-shadow: none;
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        .bottom-nav {
            position: static;
            border-top: 1px solid var(--telegram-divider);
            padding: 8px 0;
            margin-top: auto;
            display: flex;
        }

        .chat-modal {
            position: static;
            transform: translateX(0);
            display: flex;
            flex: 1;
            height: 100vh;
            border-left: 1px solid var(--telegram-divider);
        }

        .chat-modal.active {
            display: flex;
        }

        .chat-header .back-button {
            display: none;
        }

        .chat-header .chat-title-container {
            margin-right: 0;
            text-align: left;
        }

        .mobile-only {
            display: none;
        }
    }

    .chats-container {
        flex: 1;
        max-width: 480px;
        margin: 0 auto;
        width: 100%;
        padding: 12px 12px 80px;
        animation: fadeInUp 0.3s ease-out;
    }
    
    .search-container {
        margin-bottom: 12px;
        padding: 16px;
        background: var(--telegram-bg);
        border-radius: 12px;
        box-shadow: var(--telegram-shadow);
        transition: all 0.2s ease;
        animation: fadeInUp 0.3s ease-out;
        position: relative;
    }
    
    .search-container:active {
        transform: scale(0.99);
    }
    
    .search-title {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 16px;
        color: var(--telegram-text);
        letter-spacing: -0.02em;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .search-input-container {
        display: flex;
        align-items: center;
        position: relative;
    }
    
    .search-input {
        flex: 1;
        padding: 12px 16px;
        padding-left: 44px;
        border: 1px solid var(--telegram-divider);
        border-radius: 12px;
        font-size: 16px;
        transition: all 0.2s ease;
        background-color: var(--telegram-secondary-bg);
        color: var(--telegram-text);
    }
    
    .search-input:focus {
        outline: none;
        border-color: var(--telegram-blue);
        box-shadow: 0 0 0 2px rgba(36, 129, 204, 0.1);
        background-color: var(--telegram-bg);
    }
    
    .search-icon {
        position: absolute;
        left: 16px;
        color: var(--telegram-hint);
        font-size: 16px;
        pointer-events: none;
    }
    
    .add-chat-button {
        background-color: transparent;
        color: var(--telegram-blue);
        border: none;
        width: auto;
        height: auto;
        padding: 0;
        font-size: 24px;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    
    .add-chat-button:hover {
        background-color: transparent;
        transform: translateY(-1px) scale(1.1);
        box-shadow: none;
    }

    .add-chat-button:active {
        transform: scale(0.95);
    }
    
    .chats-content {
        background: var(--telegram-bg);
        border-radius: 12px;
        padding: 0;
        box-shadow: var(--telegram-shadow);
        min-height: 200px;
        display: flex;
        flex-direction: column;
        animation: fadeInUp 0.3s ease-out 0.1s;
        animation-fill-mode: both;
        overflow: hidden;
    }
    
    .no-chats {
        color: var(--telegram-hint);
        font-size: 15px;
        text-align: center;
        margin: auto;
        opacity: 0;
        animation: fadeIn 0.3s ease-out 0.2s forwards;
        padding: 40px 20px;
    }
    
    .chat-item {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--telegram-divider);
        margin: 0;
        background-color: var(--telegram-bg);
        animation: fadeIn 0.3s ease-out;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .chat-item:last-child {
        border-bottom: none;
    }

    .chat-item:hover {
        background-color: rgba(0,0,0,0.02);
    }

    .chat-item:active {
        background-color: rgba(0,0,0,0.04);
        transform: scale(0.98);
    }

    @media (prefers-color-scheme: dark) {
        .chat-item:hover {
            background-color: rgba(255,255,255,0.04);
        }

        .chat-item:active {
            background-color: rgba(255,255,255,0.08);
        }
    }
    
    .chat-avatar {
        width: 50px;
        height: 50px;
        border-radius: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 600;
        font-size: 18px;
        margin-right: 12px;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        box-shadow: var(--telegram-shadow);
        transition: transform 0.2s ease;
        flex-shrink: 0;
    }

    .chat-avatar:hover {
        transform: scale(1.02);
    }
    
    .chat-info {
        flex: 1;
        min-width: 0;
    }
    
    .chat-name {
        font-weight: 600;
        font-size: 16px;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--telegram-text);
    }
    
    .last-message {
        font-size: 14px;
        color: var(--telegram-hint);
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    
    .chat-time {
        font-size: 12px;
        color: var(--telegram-hint);
        margin-top: 4px;
    }
    
    .unread-badge {
        background-color: var(--telegram-blue);
        color: white;
        border-radius: 12px;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 600;
        min-width: 20px;
        text-align: center;
    }
    
    .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.4);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: opacity 0.3s ease-in-out;
        backdrop-filter: blur(8px);
    }
    
    .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(36, 129, 204, 0.2);
        border-radius: 50%;
        border-top-color: var(--telegram-blue);
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
    }
    
    .loading-text {
        color: var(--telegram-text);
        font-size: 15px;
        font-weight: 500;
        background: var(--telegram-bg);
        padding: 8px 16px;
        border-radius: 20px;
        box-shadow: var(--telegram-shadow-large);
    }

    .message-box {
        text-align: center;
        padding: 12px 16px;
        margin: 12px;
        border-radius: 12px;
        display: none;
        font-size: 15px;
        font-weight: 500;
        animation: slideDown 0.3s ease;
    }

    .message-box.error {
        color: white;
        background: var(--telegram-destructive);
    }

    .message-box.success {
        color: white;
        background: var(--telegram-success);
    }
    
    /* Chat modal styles */
    .chat-modal {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--telegram-bg);
        z-index: 100;
        display: none;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.3s ease;
    }

    .chat-modal.active {
        transform: translateX(0);
        display: flex;
    }

    @media (min-width: 768px) {
        .chat-modal {
            position: static;
            transform: translateX(0);
            display: none;
            flex: 1;
            height: 100vh;
            border-left: 1px solid var(--telegram-divider);
        }

        .chat-modal.active {
            display: flex;
        }
    }

    .chat-header {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--telegram-divider);
        background: var(--telegram-bg);
        position: sticky;
        top: 0;
        z-index: 10;
        height: 60px;
    }

    .chat-header .back-button {
        background: none;
        border: none;
        color: var(--telegram-blue);
        font-size: 20px;
        margin-right: 16px;
        cursor: pointer;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .chat-header .chat-title-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-right: 40px;
    }

    .chat-header .chat-avatar {
        width: 40px;
        height: 40px;
        border-radius: 20px;
        margin-right: 12px;
    }

    .chat-header .chat-title {
        font-weight: 600;
        font-size: 16px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
    }

    .chat-header .chat-status {
        font-size: 13px;
        color: var(--telegram-hint);
        margin-top: 2px;
        text-align: center;
    }

    /* Для десктопной версии */
    @media (min-width: 768px) {
        .chat-header .back-button {
            display: none;
        }
        
        .chat-header .chat-title-container {
            flex-direction: row;
            align-items: center;
            margin-right: 0;
        }
        
        .chat-header .chat-title {
            text-align: left;
            margin-left: 12px;
        }
        
        .chat-header .chat-status {
            text-align: left;
            margin-left: 12px;
        }
    }

    .messages-container {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        background-image: url('https://s14.gifyu.com/images/bNh1k.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        position: relative; 
        align-items: center;
    }

    .no-messages {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: block;
        color: white;
        font-size: 14px;
        padding: 5px 12px;
        border-radius: 24px;
        background-color: rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(4px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        z-index: 1;
    }

    @media (min-width: 768px) {
        .no-messages {
            font-size: 16px;
        }
    }

    .message {
        max-width: 70%;
        padding: 10px 14px;
        margin-bottom: 12px;
        border-radius: 12px;
        position: relative;
        word-wrap: break-word;
    }

    .message-incoming {
        background: var(--telegram-secondary-bg);
        align-self: flex-start;
        border-bottom-left-radius: 4px;
    }

    .message-outgoing {
        background: var(--telegram-blue);
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
    }

    .message-time {
        font-size: 11px;
        color: var(--telegram-hint);
        margin-top: 4px;
        text-align: right;
    }

    .message-outgoing .message-time {
        color: rgba(255, 255, 255, 0.7);
    }

    .message-input-container {
        display: flex;
        padding: 12px;
        background: var(--telegram-bg);
        border-top: 1px solid var(--telegram-divider);
        position: sticky;
        bottom: 0;
    }

    .message-input {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid var(--telegram-divider);
        border-radius: 20px;
        font-size: 16px;
        background: var(--telegram-secondary-bg);
        color: var(--telegram-text);
    }

    .message-input:focus {
        outline: none;
        border-color: var(--telegram-blue);
    }

    .send-button {
        background: var(--telegram-blue);
        color: white;
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        margin-left: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }

    .send-button:disabled {
        background: var(--telegram-hint);
        cursor: not-allowed;
    }

    /* Contacts modal */
    .contacts-modal {
        position: fixed;
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        height: 95vh;
        background: var(--telegram-bg);
        z-index: 1000;
        transform: translateY(100%);
        transition: transform 0.3s ease;
        display: flex;
        flex-direction: column;
        border-top-left-radius: 32px;
        border-top-right-radius: 32px;
        box-shadow: var(--telegram-shadow-large);
    }

    .contacts-modal.active {
        transform: translateY(0);
    }

    .contacts-header {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        background: var(--telegram-bg);
        border-bottom: 1px solid var(--telegram-divider);
    }

    .close-contacts {
        background: none;
        border: none;
        color: var(--telegram-blue);
        font-size: 20px;
        margin-right: 16px;
        cursor: pointer;
    }

    .contacts-title {
        font-size: 18px;
        font-weight: 600;
        flex: 1;
        text-align: center;
    }

    .contacts-search-btn {
        background: none;
        border: none;
        color: var(--telegram-blue);
        font-size: 20px;
        cursor: pointer;
    }

    .contacts-list {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 60px;
    }

    .contact-item {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        cursor: pointer;
        transition: background-color 0.2s ease;
    }

    .contact-item:hover {
        background-color: rgba(0,0,0,0.05);
    }

    .contact-avatar {
        width: 48px;
        height: 48px;
        border-radius: 24px;
        margin-right: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 600;
        font-size: 18px;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .contact-info {
        flex: 1;
        min-width: 0;
    }

    .contact-name {
        font-weight: 500;
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .contact-status {
        font-size: 13px;
        color: var(--telegram-hint);
    }

    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
        opacity: 1;
        pointer-events: all;
    }

    /* Bottom navigation */
    .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--telegram-bg);
        display: flex;
        justify-content: space-around;
        padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--telegram-divider);
        backdrop-filter: blur(20px);
        z-index: 100;
        overflow: hidden;
        transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        color: var(--telegram-hint);
        font-size: 10px;
        font-weight: 500;
        transition: all 0.2s ease;
        padding: 8px 12px;
        border-radius: 12px;
        min-width: 60px;
    }

    .nav-item i {
        font-size: 22px;
        margin-bottom: 2px;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nav-item span {
        transition: all 0.2s ease;
    }

    .nav-item.active {
        color: var(--telegram-blue);
    }

    .nav-item.active i {
        animation: bounce 0.6s ease;
    }

    .nav-item:hover i {
        transform: translateY(-2px) scale(1.1);
    }

    .nav-item:active {
        transform: scale(0.95);
    }

    /* Desktop styles */
    @media (min-width: 768px) {
        .bottom-nav {
            position: static;
            width: var(--desktop-sidebar-width);
            border-top: 1px solid var(--telegram-divider);
            padding: 8px 0;
            margin-top: auto;
            backdrop-filter: none;
            z-index: auto;
            overflow: hidden;
        }
        
        .bottom-nav {
            padding-bottom: 8px !important;
        }
        
        .mobile-only-nav {
            display: none !important;
        }
    }

    /* Mobile styles */
    @media (max-width: 767px) {
        /* Hide desktop nav on mobile */
        .desktop-only-nav {
            display: none !important;
        }
        
        /* Show mobile nav */
        .mobile-only-nav {
            display: flex !important;
        }
        
        /* Full width bottom nav for mobile */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
        }

        /* Hide footer when chat is active */
        .chat-modal.active ~ .bottom-nav {
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }
        
        /* Hide desktop elements on mobile */
        .desktop-sidebar, 
        .desktop-content {
            display: none;
        }
        
        .chats-container.mobile-only {
            display: flex;
            flex-direction: column;
        }
    }

    @media (max-width: 480px) {
        .chats-container {
            padding: 8px 8px 80px;
        }
        
        .search-container {
            padding: 12px;
        }
        
        .search-title {
            font-size: 20px;
            margin-bottom: 12px;
        }
        
        .search-input {
            padding: 10px 14px;
            padding-left: 40px;
            font-size: 16px;
        }
        
        .chat-avatar {
            width: 40px;
            height: 40px;
            font-size: 16px;
            margin-right: 10px;
        }

        .contacts-modal {
            height: 80vh;
            padding: 16px;
        }
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }

function adjustTimeToMoscow(timestamp) {
    if (!timestamp) return null;
    const date = new Date(timestamp);
    date.setHours(date.getHours() + 3);
    return date.toISOString();
}

function formatTime(timestamp) {
    if (!timestamp) return 'только что';
    
    const date = new Date(timestamp);
    date.setHours(date.getHours() + 3); // Добавляем 3 часа для московского времени
    
    return date.toLocaleTimeString('ru-RU', { 
        hour: '2-digit', 
        minute: '2-digit',
        timeZone: 'Europe/Moscow' // Явно указываем часовой пояс
    });
}


// Функция для форматирования даты заголовка
function formatDateHeader(timestamp) {
    if (!timestamp) return '';
    
    // Создаем дату и добавляем 3 часа для московского времени
    const date = new Date(timestamp);
    date.setHours(date.getHours() + 3);
    
    // Получаем текущую дату в Москве (учитываем +3 часа)
    const now = new Date();
    const moscowOffset = 3 * 60 * 60 * 1000; // 3 часа в миллисекундах
    const moscowNow = new Date(now.getTime() + moscowOffset);
    
    // Устанавливаем начало дня (00:00:00) для сравнения дат
    const today = new Date(moscowNow);
    today.setHours(0, 0, 0, 0);
    
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    
    // Дата сообщения (уже с поправкой +3 часа)
    const messageDate = new Date(date);
    messageDate.setHours(0, 0, 0, 0);
    
    // Сравниваем даты
    if (messageDate.getTime() === today.getTime()) {
        return 'Сегодня';
    } else if (messageDate.getTime() === yesterday.getTime()) {
        return 'Вчера';
    } else {
        const months = [
            'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
            'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'
        ];
        const day = messageDate.getDate();
        const month = months[messageDate.getMonth()];
        return `${day} ${month}`;
    }
}

            throw new Error(chatData.error || 'Не удалось загрузить чат');
        }
        
        currentChat = chatData.chat;
        
        // Set chat title and status
        chatTitle.textContent = currentChat.name || 'Новый чат';
        chatStatus.textContent = 'был(а) недавно';
        
        // Set avatar
        chatAvatar.style.backgroundImage = '';
        chatAvatar.style.backgroundColor = '';
        chatAvatar.textContent = '';
        
        if (currentChat.avatar_url) {
            chatAvatar.style.backgroundImage = `url(${currentChat.avatar_url})`;
            chatAvatar.style.backgroundSize = 'cover';
            chatAvatar.style.backgroundPosition = 'center';
        } else {
            const bgColor = currentChat.avatar_background || getRandomColor();
            chatAvatar.style.backgroundColor = bgColor;
            chatAvatar.textContent = currentChat.name ? currentChat.name[0].toUpperCase() : '?';
        }
        
        // Get messages
        const messagesResponse = await fetch(`${SERVER_URL}/get_messages`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                chat_id: chatId,
                platform_user_id: userData.platform_user_id
            }),
            credentials: 'include'
        });
        
        const messagesData = await messagesResponse.json();
        
        if (messagesData.status === 'success') {
            currentMessages = messagesData.messages;
            renderMessages(currentMessages);
            
            // Показываем/скрываем плейсхолдер в зависимости от количества сообщений
            if (currentMessages.length === 0) {
                noMessages.style.display = 'block';
                noMessages.textContent = 'Сообщений пока нет...';
            } else {
                noMessages.style.display = 'none';
            }
        } else {
            currentMessages = [];
            renderMessages([]);
            noMessages.style.display = 'block';
            noMessages.textContent = 'Сообщений пока нет...';
        }
        
        // Show chat
        if (isDesktop) {
            desktopPlaceholder.style.display = 'none';
            chatModal.style.display = 'flex';
        } else {
            chatModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        // Scroll to bottom if messages exist
        if (currentMessages.length > 0) {
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 100);
        }
        
    } catch (error) {
        console.error('Error opening chat:', error);
        showMessage('Ошибка загрузки чата', 'error');
    } finally {
        hideLoading();
    }
}

function closeChat() {
    const { chatModal, chatAvatar, messagesContainer, noMessages } = getActiveElements();

    if (isDesktop) {
        chatModal.style.display = 'none';
        desktopPlaceholder.style.display = 'flex';
    } else {
        chatModal.style.transition = 'transform 0.3s ease';
        chatModal.style.transform = 'translateX(100%)';
        
        setTimeout(() => {
            chatModal.classList.remove('active');
            document.body.style.overflow = '';
        }, 300);
    }
    
    currentChat = null;
    currentMessages = [];
    messagesContainer.innerHTML = '';
    noMessages.style.display = 'block';
    noMessages.textContent = 'Сообщений пока нет...';
    
    // Clear avatar styles
    chatAvatar.style.backgroundImage = '';
    chatAvatar.style.backgroundColor = '';
    chatAvatar.textContent = '';
    
    // Обновляем список чатов после закрытия
    loadChats();
}

        // Send message
async function sendMessage() {
    const { messageInput, sendMessageButton, messagesContainer, noMessages } = getActiveElements();
    const content = messageInput.value.trim();
    if (!content || !currentChat) return;
    
    sendMessageButton.disabled = true;
    messageInput.value = '';
    
    try {
        const response = await fetch(`${SERVER_URL}/send_message`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                chat_id: currentChat.id,
                sender_id: userData.platform_user_id,
                content: content
            }),
            credentials: 'include'
        });
        
        const data = await response.json();
        
        if (data.status !== 'success') {
            throw new Error(data.error || 'Не удалось отправить сообщение');
        }
        
        
const newMessage = {
    id: data.message_id,
    sender_id: userData.platform_user_id,
    content: content,
    sent_at: new Date().toISOString(), // Используем текущее время
    is_read: false,
    sender_name: userData.nickname,
    sender_avatar: userData.avatar_url,
    sender_avatar_background: userData.avatar_background,
    is_me: true
};
        
        currentMessages.push(newMessage);
        
        // Всегда скрываем плейсхолдер "Нет сообщений" при отправке
        noMessages.style.display = 'none';
        
        // Перерисовываем все сообщения, чтобы обновить заголовки дат
        renderMessages(currentMessages);
        
        // Прокручиваем вниз
        setTimeout(() => {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }, 50);
        
    } catch (error) {
        console.error('Error sending message:', error);
        showMessage('Ошибка отправки сообщения', 'error');
        messageInput.value = content; // Возвращаем текст в поле ввода
        
        // Восстанавливаем "Нет сообщений", если отправка не удалась и сообщений нет
        if (currentMessages.length === 0) {
            noMessages.style.display = 'block';
        }
    } finally {
        sendMessageButton.disabled = false;
    }
}

        // Render messages
function renderMessages(messages) {
    const { messagesContainer, noMessages } = getActiveElements();
    
    // Очищаем только сообщения, сохраняя noMessages
    const messageElements = messagesContainer.querySelectorAll('.message, .date-header');
    messageElements.forEach(el => el.remove());
    
    if (!messages || messages.length === 0) {
        noMessages.style.display = 'block';
        noMessages.textContent = 'Сообщений пока нет...';
        return;
    }
    
    noMessages.style.display = 'none';
    
    let lastDateHeader = '';
    messages.forEach((message, index) => {
        const currentDateHeader = formatDateHeader(message.sent_at);
        
        // Добавляем заголовок даты, если он изменился
        if (currentDateHeader !== lastDateHeader) {
            const dateHeader = document.createElement('div');
            dateHeader.className = 'date-header';
            dateHeader.textContent = currentDateHeader;
            dateHeader.style.textAlign = 'center';
            dateHeader.style.margin = '12px 0';
            dateHeader.style.fontSize = '14px';
            dateHeader.style.color = 'white';
            dateHeader.style.backgroundColor = 'rgba(0, 0, 0, 0.2)';
            dateHeader.style.padding = '4px 12px';
            dateHeader.style.borderRadius = '12px';
            dateHeader.style.display = 'inline-block';
            messagesContainer.appendChild(dateHeader);
            lastDateHeader = currentDateHeader;
        }
        
        renderMessage(message);
    });
    
    // Прокручиваем вниз после рендеринга
    setTimeout(() => {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }, 50);
}


        // Render a single message
function renderMessage(message) {
    const { messagesContainer } = getActiveElements();
    
    const messageElement = document.createElement('div');
    messageElement.className = `message ${message.is_me ? 'message-outgoing' : 'message-incoming'}`;
    
    // Замените formatMoscowTime на простое форматирование времени
 const messageTime = formatTime(message.sent_at);
    
    messageElement.innerHTML = `
        <div class="message-content">${message.content}</div>
        <div class="message-time">${messageTime}</div>
    `;
    
    messagesContainer.appendChild(messageElement);
}
        // Initialize page
        async function initializePage() {
            // Check authorization
            const userDataFromStorage = sessionStorage.getItem('userData');
            if (!userDataFromStorage) {
                window.location.href = 'profile.html';
                return;
            }
            
            userData = JSON.parse(userDataFromStorage);
            
            // Determine if desktop or mobile
            isDesktop = window.matchMedia("(min-width: 768px)").matches;

            // Hide/show relevant containers and navigation
            if (isDesktop) {
                mobileChatsContainer.style.display = 'none';
                mobileOnlyNav.style.display = 'none';
                desktopSidebar.style.display = 'flex'; // Use flex for sidebar
                desktopContent.style.display = 'flex';
                desktopOnlyNav.style.display = 'flex'; // Show desktop nav
                chatModalDesktop.style.display = 'none'; // Initially hide chat modal on desktop
                desktopPlaceholder.style.display = 'flex'; // Show placeholder
            } else {
                mobileChatsContainer.style.display = 'flex';
                mobileOnlyNav.style.display = 'flex';
                desktopSidebar.style.display = 'none';
                desktopContent.style.display = 'none';
                desktopOnlyNav.style.display = 'none'; // Hide desktop nav
                chatModalMobile.classList.remove('active'); // Ensure mobile chat modal is hidden
            }

            // Load data
            await loadUserData();
            await loadChats();
            
            // Event listeners for active elements
            const { addChatButton, searchInput, backToChats, messageInput, sendMessageButton } = getActiveElements();

            addChatButton.addEventListener('click', (e) => {
                e.preventDefault();
                showContactsModal();
            });

            closeContacts.addEventListener('click', hideContactsModal);
            modalOverlay.addEventListener('click', hideContactsModal);
            
            contactsSearchInput.addEventListener('input', (e) => {
                filterContacts(e.target.value);
            });

            searchInput.addEventListener('input', (e) => {
                // Implement chat search/filter logic here if needed
                // For now, it's just a placeholder input
            });

            if (backToChats) { // Only for mobile
                backToChats.addEventListener('click', closeChat);
            }
            
            sendMessageButton.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            // Update chats every 30 seconds
            setInterval(async () => {
                const { chatModal } = getActiveElements();
                if (!chatModal.classList.contains('active') && chatModal.style.display !== 'flex') { // Check for both mobile active class and desktop display style
                    await loadChats();
                }
            }, 30000);

            // Handle window resize for responsive layout
            window.addEventListener('resize', () => {
                const newIsDesktop = window.matchMedia("(min-width: 768px)").matches;
                if (newIsDesktop !== isDesktop) {
                    isDesktop = newIsDesktop;
                    initializePage(); // Re-initialize to apply correct layout
                }
            });
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', initializePage);
        
        // Handle back/forward cache (BFCache)
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                initializePage();
            }
        });
    </script>
