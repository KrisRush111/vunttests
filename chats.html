   /* Обновленные стили для кнопки отправки */
.send-button {
    background: linear-gradient(135deg, #4CAF50 0%, #8BC34A 50%, #4CAF50 100%);
    color: white;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    margin-left: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background-size: 200% 200%;
    animation: gradientShift 2s ease infinite;
    box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.send-button:before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
        45deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.1) 50%,
        rgba(255, 255, 255, 0) 100%
    );
    transform: rotate(45deg);
    animation: shine 3s infinite;
}

.send-button:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
}

.send-button:active {
    transform: scale(0.95);
    box-shadow: 0 1px 4px rgba(76, 175, 80, 0.2);
}

.send-button:disabled {
    background: var(--telegram-hint);
    animation: none;
    cursor: not-allowed;
    transform: scale(1);
    box-shadow: none;
}

.send-button:disabled:before {
    display: none;
}

.send-button i {
    font-size: 16px;
    transform: rotate(45deg);
    transition: transform 0.3s ease;
}

.send-button:hover i {
    transform: rotate(45deg) translateY(-2px);
}

/* Анимация градиента */
@keyframes gradientShift {
    0% {
        background-position: 0% 50%;
    }
    50% {
        background-position: 100% 50%;
    }
    100% {
        background-position: 0% 50%;
    }
}

/* Анимация блеска */
@keyframes shine {
    0% {
        transform: rotate(45deg) translateX(-100%);
    }
    100% {
        transform: rotate(45deg) translateX(100%);
    }
}

/* Адаптация для мобильных устройств */

function formatDateHeader(timestamp) {
    if (!timestamp) return '';
    
    const date = new Date(timestamp);
    const now = new Date();
    

    const today = new Date(now);
    today.setHours(0, 0, 0, 0);
    
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    
   
    const messageDate = new Date(date);
    messageDate.setHours(0, 0, 0, 0);
    

    if (messageDate.getTime() === today.getTime()) {
        return 'Сегодня';
    } else if (messageDate.getTime() === yesterday.getTime()) {
        return 'Вчера';
    } else {
        const months = [
            'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
            'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'
        ];
        const day = messageDate.getDate();
        const month = months[messageDate.getMonth()];
        return `${day} ${month}`;
    }
}

        async function loadUserData() {
            showLoading('Загрузка данных пользователя...');
            
            try {
                const cachedData = sessionStorage.getItem('userData');
                if (cachedData) {
                    userData = JSON.parse(cachedData);
                    hideLoading();
                    return true;
                }
                
                const response = await fetch(`${SERVER_URL}/get_user_data`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        platform_user_id: userData.platform_user_id 
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    userData = data.user;
                    sessionStorage.setItem('userData', JSON.stringify(userData));
                    hideLoading();
                    return true;
                } else {
                    throw new Error(data.error || 'Не удалось загрузить данные пользователя');
                }
            } catch (error) {
                console.error('Error loading user data:', error);
                hideLoading();
                showMessage('Ошибка загрузки данных. Пожалуйста, перезагрузите страницу.', 'error');

async function createChatWithContact(contact) {

    isOpeningChat = true;

    showLoading('Подготовка чата...');
    
    try {
      
        const response = await fetch(`${SERVER_URL}/get_or_create_chat`, {
            method: 'POST',
            headers: {

            },

                platform_user_id: userData.platform_user_id,
                contact_id: contact.platform_user_id
            }),
            credentials: 'include'
        });

        const data = await response.json();
        
        if (data.status !== 'success') {
            throw new Error(data.error || 'Не удалось проверить чат');

            last_message_time: null,

        };

        showMessage('Ошибка подготовки чата: ' + error.message, 'error');

    } finally {

async function sendMessage() {
    const { messageInput, sendMessageButton, messagesContainer, noMessages } = getActiveElements();
    const content = messageInput.value.trim();
    if (!content || !currentChat) return;
    
    sendMessageButton.disabled = true;
    messageInput.value = '';
    
    try {
       
        if (currentChat.is_temp) {
            const response = await fetch(`${SERVER_URL}/create_chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    platform_user_id: userData.platform_user_id,
                    contact_id: currentChat.participants[0].platform_user_id
                }),
                credentials: 'include'
            });
            
            const data = await response.json();
            
            if (data.status !== 'success') {
                throw new Error(data.error || 'Не удалось создать чат');
            }
            
      
            currentChat.id = data.chat_id;
            currentChat.is_temp = false;
            
            
            await loadChats();
        }
        
 
        const messageResponse = await fetch(`${SERVER_URL}/send_message`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: currentChat.id,
                sender_id: userData.platform_user_id,
                content: content
            }),
            credentials: 'include'
        });
        
        const messageData = await messageResponse.json();
        
        if (messageData.status !== 'success') {
            throw new Error(messageData.error || 'Не удалось отправить сообщение');
        }
        
      
        const newMessage = {
            id: messageData.message_id,
            sender_id: userData.platform_user_id,
            content: content,
            sent_at: new Date().toISOString(), 
            is_read: false, // Default to false, will be updated by server
            sender_name: userData.nickname,
            sender_avatar: userData.avatar_url,
            sender_avatar_background: userData.avatar_background,
            is_me: true
        };
        

        currentMessages = [...currentMessages, newMessage];
        
       
        noMessages.style.display = 'none';
        renderMessages(currentMessages);
        

        setTimeout(() => {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }, 50);
        
       
        if (!currentChat.is_temp) {
        
            updateChatItemInDOM(currentChat.id, {
                last_message: content,
                last_message_time: newMessage.sent_at,
                unread_count: 0 
            });
            
            
            updateChatInList(currentChat.id, {
                last_message: content,
                last_message_time: newMessage.sent_at
            }).catch(error => {
                console.error('Background chat update error:', error);
              
            });
        }
        
    } catch (error) {
        console.error('Error sending message:', error);
        showMessage('Ошибка отправки сообщения: ' + error.message, 'error');
        messageInput.value = content;
        
        if (currentMessages.length === 0) {
            noMessages.style.display = 'block';
        }
    } finally {
        sendMessageButton.disabled = false;
    }
}
       
async function openChat(chatId) {
    if (isOpeningChat) return; // Prevent multiple chat openings
    isOpeningChat = true;

    // Close previous chat before opening a new one
    if (currentChat && currentChat.id !== chatId) {
        closeChat();
    }
    
    showLoading('Загрузка чата...');
    const { chatModal, chatAvatar, chatTitle, chatStatus, messagesContainer, noMessages } = getActiveElements();
    
    try {
        // Clear previous messages and show loading state
        messagesContainer.innerHTML = '';
        noMessages.style.display = 'block';
        noMessages.textContent = 'Загрузка...';

        // Apply changing class for animation
        chatModal.classList.add('changing');
        setTimeout(() => {
            chatModal.classList.remove('changing');
        }, 300);
        
        // Get chat information
        const response = await fetch(`${SERVER_URL}/get_chat_info`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                chat_id: chatId,
                platform_user_id: userData.platform_user_id
            }),
            credentials: 'include'
        });
        
        const chatData = await response.json();
        
        if (chatData.status !== 'success') {
            throw new Error(chatData.error || 'Не удалось загрузить чат');
        }
        
        currentChat = chatData.chat;
        
        // Update chat information in UI
        chatTitle.textContent = currentChat.name || 'Новый чат';
        chatStatus.textContent = 'был(а) недавно';
        
        // Set avatar
        chatAvatar.style.backgroundImage = '';
        chatAvatar.style.backgroundColor = '';
        chatAvatar.textContent = '';
        
        if (currentChat.avatar_url) {
            chatAvatar.style.backgroundImage = `url(${currentChat.avatar_url})`;
            chatAvatar.style.backgroundSize = 'cover';
            chatAvatar.style.backgroundPosition = 'center';
        } else {
            const bgColor = currentChat.avatar_background || getRandomColor();
            chatAvatar.style.backgroundColor = bgColor;
            chatAvatar.textContent = currentChat.name ? currentChat.name[0].toUpperCase() : '?';
        }
        
        // Load messages
        const messagesResponse = await fetch(`${SERVER_URL}/get_messages`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                chat_id: chatId,
                platform_user_id: userData.platform_user_id
            }),
            credentials: 'include'
        });
        
        const messagesData = await messagesResponse.json();
        
        if (messagesData.status === 'success') {
            currentMessages = messagesData.messages;
            renderMessages(currentMessages);
            
            // Mark all messages as read
            markAllMessagesAsRead(chatId);
        
            if (currentMessages.length === 0) {
                noMessages.style.display = 'block';
                noMessages.textContent = 'Сообщений пока нет...';
            } else {
                noMessages.style.display = 'none';
            }
        } else {
            currentMessages = [];
            noMessages.style.display = 'block';
            noMessages.textContent = 'Сообщений пока нет...';
        }
        
        // Show chat modal
        if (isDesktop) {
            desktopPlaceholder.style.display = 'none';
            chatModal.style.display = 'flex';
        } else {
            chatModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        // Scroll to the last message
        if (currentMessages.length > 0) {
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 100);
        }

        // Update chat list item
        updateChatItemInDOM(chatId, {
            last_message: currentChat.last_message,
            last_message_time: currentChat.last_message_time,
            unread_count: 0 
        });
        
    } catch (error) {
        console.error('Error opening chat:', error);
        showMessage('Ошибка загрузки чата', 'error');
        closeChat(); // Ensure UI is reset on error
    } finally {
        isOpeningChat = false; // Reset flag
        hideLoading();
    }
}

function closeChat() {
    const { chatModal, chatAvatar, chatTitle, chatStatus, messagesContainer, noMessages } = getActiveElements();

    // Reset chat state
    currentChat = null;
    currentMessages = [];
    
    // Clear UI
    messagesContainer.innerHTML = '';
    noMessages.style.display = 'block';
    noMessages.textContent = 'Сообщений пока нет...';
    
    chatTitle.textContent = '';
    chatStatus.textContent = '';
    chatAvatar.style.backgroundImage = '';
    chatAvatar.style.backgroundColor = '';
    chatAvatar.textContent = '';
    
    // Hide chat modal
    if (isDesktop) {
        chatModal.style.display = 'none';
        desktopPlaceholder.style.display = 'flex';
    } else {
        chatModal.classList.remove('active');
        document.body.style.overflow = '';
    }
    
    // Reload chat list
    loadChats();
}

function updateChatItemInDOM(chatId, chatData) {

            }

        }

// Updated renderMessage function
function renderMessage(message) {
    const { messagesContainer } = getActiveElements();
    
    const messageElement = document.createElement('div');
    messageElement.className = `message ${message.is_me ? 'message-outgoing' : 'message-incoming'}`;
    messageElement.setAttribute('data-message-id', message.id); // Add data-message-id
    
    const messageTime = formatChatMessageTime(message.sent_at);
    
    // Create status circles for outgoing messages
    let statusCircles = '';
    if (message.is_me) {
        const isRead = message.is_read;
        statusCircles = `
            <div class="message-status">
                <div class="status-circles">
                    <div class="status-circle ${isRead ? 'green' : 'gray'}"></div>
                    <div class="status-circle ${isRead ? 'green' : 'gray'}"></div>
                </div>
            </div>
        `;
    }
    
    messageElement.innerHTML = `
        <div class="message-content">${message.content}</div>
        <div class="message-time">
            ${messageTime}
            ${message.is_me ? statusCircles : ''}
        </div>
    `;
    
    setTimeout(() => {
        messageElement.style.opacity = '1';
        messageElement.style.transform = 'translateY(0)';
    }, 10);
    
    messagesContainer.appendChild(messageElement);
}

async function updateMessageStatus(chatId, messageId) {
    try {
        const response = await fetch(`${SERVER_URL}/mark_as_read`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                chat_id: chatId,
                message_id: messageId,
                reader_id: userData.platform_user_id
            }),
            credentials: 'include'
        });
        
        const data = await response.json();
        
        if (data.status === 'success') {
            // Update the visual display of the status
            updateMessageStatusInUI(messageId);
        }
    } catch (error) {
        console.error('Error updating message status:', error);
    }
}

function updateMessageStatusInUI(messageId) {
    const { messagesContainer } = getActiveElements();
    const messageElement = messagesContainer.querySelector(`[data-message-id="${messageId}"]`);
    
    if (messageElement) {
        const circles = messageElement.querySelectorAll('.status-circle');
        circles.forEach(circle => {
            circle.classList.remove('gray');
            circle.classList.add('green');
        });
    }
}

async function markAllMessagesAsRead(chatId) {
    try {
        const response = await fetch(`${SERVER_URL}/mark_all_as_read`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                chat_id: chatId,
                reader_id: userData.platform_user_id
            }),
            credentials: 'include'
        });
        
        const data = await response.json();
        
        if (data.status === 'success') {
            // Update the status of all messages in the UI
            currentMessages.forEach(message => {
                if (!message.is_me) { // Only mark incoming messages as read
                    message.is_read = true;
                }
            });
            
            // Update visual display
            updateAllMessageStatusesInUI();
        }
    } catch (error) {
        console.error('Error marking all messages as read:', error);
    }
}

function updateAllMessageStatusesInUI() {
    const { messagesContainer } = getActiveElements();
    const messageElements = messagesContainer.querySelectorAll('.message[data-message-id]');
    
    messageElements.forEach(element => {
        const messageId = element.getAttribute('data-message-id');
        const message = currentMessages.find(m => m.id === messageId);
        
        if (message && message.is_me && message.is_read) { // Only update outgoing messages that are marked as read
            const circles = element.querySelectorAll('.status-circle');
            circles.forEach(circle => {
                circle.classList.remove('gray');
                circle.classList.add('green');
            });
        }
    });
}

        desktopContent.style.display = 'flex';
        desktopOnlyNav.style.display = 'flex'; 
        chatModalDesktop.style.display = 'none'; 
        desktopPlaceholder.style.display = 'flex';
    } else {
        mobileChatsContainer.style.display = 'flex';
        mobileOnlyNav.style.display = 'flex';
        desktopSidebar.style.display = 'none';
        desktopContent.style.display = 'none';
        desktopOnlyNav.style.display = 'none'; 
        chatModalMobile.classList.remove('active'); 
    }


    await loadUserData();
    await loadChats();
    
     const openChatId = sessionStorage.getItem('openChatId');
    const openChatName = sessionStorage.getItem('openChatName');
    
    if (openChatId && openChatName) {
        // Создаем временный объект чата для открытия
        const tempChat = {
            id: openChatId,
            name: openChatName,
            is_temp: false
        };
        
        // Очищаем storage
        sessionStorage.removeItem('openChatId');
        sessionStorage.removeItem('openChatName');
        
        // Открываем чат
        setTimeout(() => {
            openChat(openChatId);
        }, 500);
    }

    const { addChatButton, searchInput, backToChats, messageInput, sendMessageButton } = getActiveElements();

    addChatButton.addEventListener('click', (e) => {
        e.preventDefault();
        showContactsModal();
    });

    closeContacts.addEventListener('click', hideContactsModal);
    modalOverlay.addEventListener('click', hideContactsModal);
    
    contactsSearchInput.addEventListener('input', (e) => {
        filterContacts(e.target.value);
    });

    searchInput.addEventListener('input', (e) => {
      
        filterChats(e.target.value);
    });

    if (backToChats) { 
        backToChats.addEventListener('click', (e) => { // Updated event listener
            e.preventDefault();
            closeChat();
        });
    }
    
    sendMessageButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
    
    
    setInterval(async () => {
        const { chatModal } = getActiveElements();
       
        if (!chatModal.classList.contains('active') && chatModal.style.display !== 'flex') {
            await loadChats();
        }
    }, 10000); 


    window.addEventListener('resize', () => {
        const newIsDesktop = window.matchMedia("(min-width: 768px)").matches;
        if (newIsDesktop !== isDesktop) {
            isDesktop = newIsDesktop;
            initializePage(); 
        }
    });

 
    const menuButton = document.querySelector('.menu-button');
    if (menuButton) {
        menuButton.addEventListener('click', () => {
         
            console.log('Menu button clicked');
        });
    }

 
    const contactsSearchBtn = document.querySelector('.contacts-search-btn');
    if (contactsSearchBtn) {
        contactsSearchBtn.addEventListener('click', () => {
            contactsSearchInput.focus();
        });
    }
}


function filterChats(searchTerm) {
    const { chatsList } = getActiveElements();
    const chatItems = chatsList.querySelectorAll('.chat-item');
    
    chatItems.forEach(item => {
        const chatName = item.querySelector('.chat-name').textContent.toLowerCase();
        const lastMessage = item.querySelector('.last-message').textContent.toLowerCase();
        
        if (chatName.includes(searchTerm.toLowerCase()) || lastMessage.includes(searchTerm.toLowerCase())) {
            item.style.display = 'flex';
        } else {
            item.style.display = 'none';
        }
    });
}


function filterContacts(searchTerm) {
    const contactItems = contactsList.querySelectorAll('.contact-item');
    
    contactItems.forEach(item => {
        const contactName = item.querySelector('.contact-name').textContent.toLowerCase();
        
        if (contactName.includes(searchTerm.toLowerCase())) {
            item.style.display = 'flex';
        } else {
            item.style.display = 'none';
        }
    });
}
      
        document.addEventListener('DOMContentLoaded', initializePage);
        
        
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                initializePage();
            }
        });
    </script>
</body>
</html>
