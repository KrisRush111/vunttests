<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чаты - TheVuntgram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --tg-theme-bg-color: #17212b;
            --tg-theme-secondary-bg-color: #242f3d;
            --tg-theme-header-bg-color: #242f3d;
            --tg-theme-section-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #708499;
            --tg-theme-link-color: #2481cc;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-destructive-text-color: #ee686f;
            --telegram-blue: #0088cc;
            --telegram-light-blue: #40a7e3;
            --telegram-bg: #ffffff;
            --telegram-secondary-bg: #f4f4f5;
            --telegram-text: #000000;
            --telegram-hint: #8e8e93;
            --online-green: #00c73c;
            --telegram-divider: rgba(0,0,0,0.08);
            --telegram-shadow: 0 1px 3px rgba(0,0,0,0.06);
            --telegram-shadow-large: 0 4px 16px rgba(0,0,0,0.08);
            --telegram-destructive: #ee686f;
            --telegram-success: #00c73c;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --telegram-bg: #212121;
                --telegram-secondary-bg: #1d1d1d;
                --telegram-text: #ffffff;
                --telegram-hint: #8e8e93;
                --telegram-divider: rgba(255,255,255,0.12);
                --telegram-shadow: 0 1px 3px rgba(0,0,0,0.24);
                --telegram-shadow-large: 0 4px 16px rgba(0,0,0,0.24);
            }
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background-color: var(--telegram-secondary-bg);
            color: var(--telegram-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .chats-container {
            flex: 1;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            padding: 12px 12px 80px;
            animation: fadeInUp 0.3s ease-out;
        }
        
        .search-container {
            margin-bottom: 12px;
            padding: 16px;
            background: var(--telegram-bg);
            border-radius: 12px;
            box-shadow: var(--telegram-shadow);
            transition: all 0.2s ease;
            animation: fadeInUp 0.3s ease-out;
            position: relative;
        }
        
        .search-container:active {
            transform: scale(0.99);
        }
        
        .search-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--telegram-text);
            letter-spacing: -0.02em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .search-input-container {
            display: flex;
            align-items: center;
            position: relative;
        }
        
        .search-input {
            flex: 1;
            padding: 12px 16px;
            padding-left: 44px;
            border: 1px solid var(--telegram-divider);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s ease;
            background-color: var(--telegram-secondary-bg);
            color: var(--telegram-text);
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--telegram-blue);
            box-shadow: 0 0 0 2px rgba(36, 129, 204, 0.1);
            background-color: var(--telegram-bg);
        }
        
        .search-icon {
            position: absolute;
            left: 16px;
            color: var(--telegram-hint);
            font-size: 16px;
            pointer-events: none;
        }
        
        .add-chat-button {
            background-color: transparent;
            color: var(--telegram-blue);
            border: none;
            width: auto;
            height: auto;
            padding: 0;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .add-chat-button:hover {
            background-color: transparent;
            transform: translateY(-1px) scale(1.1);
            box-shadow: none;
        }

        .add-chat-button:active {
            transform: scale(0.95);
        }
        
        .chats-content {
            background: var(--telegram-bg);
            border-radius: 12px;
            padding: 0;
            box-shadow: var(--telegram-shadow);
            min-height: 200px;
            display: flex;
            flex-direction: column;
            animation: fadeInUp 0.3s ease-out 0.1s;
            animation-fill-mode: both;
            overflow: hidden;
        }
        
        .no-chats {
            color: var(--telegram-hint);
            font-size: 15px;
            text-align: center;
            margin: auto;
            opacity: 0;
            animation: fadeIn 0.3s ease-out 0.2s forwards;
            padding: 40px 20px;
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--telegram-divider);
            margin: 0;
            background-color: var(--telegram-bg);
            animation: fadeIn 0.3s ease-out;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chat-item:last-child {
            border-bottom: none;
        }

        .chat-item:hover {
            background-color: rgba(0,0,0,0.02);
        }

        .chat-item:active {
            background-color: rgba(0,0,0,0.04);
            transform: scale(0.98);
        }

        @media (prefers-color-scheme: dark) {
            .chat-item:hover {
                background-color: rgba(255,255,255,0.04);
            }

            .chat-item:active {
                background-color: rgba(255,255,255,0.08);
            }
        }
        
        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
            margin-right: 12px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: var(--telegram-shadow);
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        .chat-avatar:hover {
            transform: scale(1.02);
        }
        
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        
        .chat-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--telegram-text);
        }
        
        .last-message {
            font-size: 14px;
            color: var(--telegram-hint);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-time {
            font-size: 12px;
            color: var(--telegram-hint);
            margin-top: 4px;
        }
        
        .unread-badge {
            background-color: var(--telegram-blue);
            color: white;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 600;
            min-width: 20px;
            text-align: center;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.3s ease-in-out;
            backdrop-filter: blur(8px);
        }
        
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(36, 129, 204, 0.2);
            border-radius: 50%;
            border-top-color: var(--telegram-blue);
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        
        .loading-text {
            color: var(--telegram-text);
            font-size: 15px;
            font-weight: 500;
            background: var(--telegram-bg);
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: var(--telegram-shadow-large);
        }
        
        .message-box {
            text-align: center;
            padding: 12px 16px;
            margin: 12px;
            border-radius: 12px;
            display: none;
            font-size: 15px;
            font-weight: 500;
            animation: slideDown 0.3s ease;
        }

        .message-box.error {
            color: white;
            background: var(--telegram-destructive);
        }

        .message-box.success {
            color: white;
            background: var(--telegram-success);
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--telegram-bg);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--telegram-divider);
            backdrop-filter: blur(20px);
            z-index: 100;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--telegram-hint);
            font-size: 10px;
            font-weight: 500;
            transition: all 0.2s ease;
            padding: 8px 12px;
            border-radius: 12px;
            min-width: 60px;
        }
        
        .nav-item i {
            font-size: 22px;
            margin-bottom: 2px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-item span {
            transition: all 0.2s ease;
        }
        
        .nav-item.active {
            color: var(--telegram-blue);
        }

        .nav-item.active i {
            animation: bounce 0.6s ease;
        }
        
        .nav-item:hover i {
            transform: translateY(-2px) scale(1.1);
        }

        .nav-item:active {
            transform: scale(0.95);
        }

<body>
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Загрузка данных...</div>
    </div>

    <div class="chats-container">
        <!-- Message box -->
        <div id="messageBox" class="message-box"></div>
        
        <!-- Search section -->
        <div class="search-container">
            <div class="search-title">
                Чаты
                <button id="addChatButton" class="add-chat-button">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <div class="search-input-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Поиск чатов...">
            </div>
        </div>
        
        <!-- Chats content -->
        <div class="chats-content">
            <div id="noChats" class="no-chats">Нет чатов</div>
            <div id="chatsList"></div>
        </div>
    </div>

    <!-- Bottom navigation -->
    <div class="bottom-nav">
        <a href="contacts.html" class="nav-item">
            <i class="fas fa-user-circle"></i>
            <span>Контакты</span>
        </a>
        
        <a href="chats.html" class="nav-item active">
            <i class="fas fa-comments"></i>
            <span>Чаты</span>
        </a>
     
        <a href="profile.html" class="nav-item">
            <i class="fas fa-cog"></i>
            <span>Профиль</span>
        </a>
    </div>

    <!-- Модальное окно контактов -->
    <div id="modalOverlay" class="modal-overlay"></div>

    <div id="contactsModal" class="contacts-modal">
        <div class="contacts-header">
            <button id="closeContacts" class="close-contacts">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="contacts-title">Контакты</div>
            <button class="contacts-search-btn">
                <i class="fas fa-search"></i>
            </button>
        </div>
        
        <div class="search-input-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="contactsSearchInput" class="search-input" placeholder="Поиск">
        </div>
        
        <div id="contactsList" class="contacts-list">
            <!-- Контакты будут добавляться здесь динамически -->
        </div>
        
    </div>

    <script>
        // Configuration
        const SERVER_URL = 'https://vuntserver-p1cx.onrender.com';
        
        // DOM elements
        const loadingOverlay = document.getElementById('loadingOverlay');
        const noChats = document.getElementById('noChats');
        const searchInput = document.getElementById('searchInput');
        const addChatButton = document.getElementById('addChatButton');
        const chatsList = document.getElementById('chatsList');
        const messageBox = document.getElementById('messageBox');
        const contactsModal = document.getElementById('contactsModal');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeContacts = document.getElementById('closeContacts');
        const contactsList = document.getElementById('contactsList');
        const contactsSearchInput = document.getElementById('contactsSearchInput');
        
        // User data
        let userData = {};
        
        // Show loading overlay
        function showLoading(text = 'Загрузка...') {
            loadingOverlay.querySelector('.loading-text').textContent = text;
            loadingOverlay.style.display = 'flex';
            loadingOverlay.style.opacity = '1';
        }
        
        // Hide loading overlay
        function hideLoading() {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => {
                loadingOverlay.style.display = 'none';
            }, 300);
        }
        
        // Show message (error or success)
        function showMessage(message, type = 'error') {
            messageBox.textContent = message;
            messageBox.className = `message-box ${type}`;
            messageBox.style.display = 'block';
            setTimeout(() => {
                messageBox.style.display = 'none';
            }, 5000);
        }
        
        // Load user data from sessionStorage or server
        async function loadUserData() {
            showLoading('Загрузка данных пользователя...');
            
            try {
                // Проверяем кеш
                const cachedData = sessionStorage.getItem('userData');
                if (cachedData) {
                    userData = JSON.parse(cachedData);
                    hideLoading();
                    return true;
                }
                
                // Если нет в кеше, запрашиваем с сервера
                const response = await fetch(`${SERVER_URL}/get_user_data`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        platform_user_id: userData.platform_user_id
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    userData = data.user;
                    sessionStorage.setItem('userData', JSON.stringify(userData));
                    hideLoading();
                    return true;
                } else {
                    throw new Error(data.error || 'Не удалось загрузить данные пользователя');
                }
            } catch (error) {
                console.error('Error loading user data:', error);
                hideLoading();
                showMessage('Ошибка загрузки данных. Пожалуйста, перезагрузите страницу.', 'error');
                return false;
            }
        }
        
        // Load chats from server
 async function loadChats() {
    showLoading('Загрузка чатов...');
    
    try {
        const response = await fetch(`${SERVER_URL}/get_chats`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                platform_user_id: userData.platform_user_id
            }),
            credentials: 'include'
        });
        
        const data = await response.json();
        
        if (data.status === 'success') {
            renderChats(data.chats);
            hideLoading();
        } else {
            // Проверяем, есть ли у пользователя чаты (data.chats существует и пустой)
            if (data.chats && Array.isArray(data.chats) && data.chats.length === 0) {
                renderChats([]); // Просто показываем пустой список
                hideLoading();
            } else {
                throw new Error(data.error || 'Не удалось загрузить чаты');
            }
        }
    } catch (error) {
        console.error('Error loading chats:', error);
        // Показываем сообщение только если это не просто отсутствие чатов
        if (!error.message.includes('No chats found') && !error.message.includes('нет чатов')) {
            showMessage('Ошибка загрузки чатов', 'error');
        }
        hideLoading();
    }
}
        
        // Render chats list
        function renderChats(chats) {
            if (!chats || chats.length === 0) {
                noChats.style.display = 'block';
                chatsList.innerHTML = '';
                return;
            }
            
            noChats.style.display = 'none';
            chatsList.innerHTML = '';
            
            chats.forEach(chat => {
                const chatItem = document.createElement('div');
                chatItem.className = 'chat-item';
                
                const initials = chat.name 
                    ? chat.name.split(' ').map(n => n[0]).join('') 
                    : '?';
                
                const bgColor = chat.avatar_background || getRandomColor();
                
                chatItem.innerHTML = `
                    <div class="chat-avatar" style="background-color: ${bgColor}">
                        ${initials}
                    </div>
                    <div class="chat-info">
                        <div class="chat-name">${chat.name || 'Новый чат'}</div>
                        <div class="last-message">${chat.last_message || 'Начните общение'}</div>
                        <div class="chat-time">${formatTime(chat.last_message_time)}</div>
                    </div>
                `;
                
                chatItem.addEventListener('click', () => {
                    // Здесь будет переход в чат
                    showMessage('Чат будет открыт в следующей версии', 'info');
                });
                
                chatsList.appendChild(chatItem);
            });
        }
        
        // Format time for chat list
        function formatTime(timestamp) {
            if (!timestamp) return 'только что';
            
            const date = new Date(timestamp);
            const now = new Date();
            
            if (date.toDateString() === now.toDateString()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (date.getFullYear() === now.getFullYear()) {
                return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
            } else {
                return date.toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' });
            }
        }
        
        // Show contacts modal
        function showContactsModal() {
            contactsModal.classList.add('active');
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            loadContacts();
        }

        // Hide contacts modal
        function hideContactsModal() {
            contactsModal.classList.remove('active');
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Load contacts from server
        async function loadContacts() {
            showLoading('Загрузка контактов...');
            contactsList.innerHTML = '';
            
            try {
                const response = await fetch(`${SERVER_URL}/get_friends`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        platform_user_id: userData.platform_user_id
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    renderContacts(data.friends);
                    hideLoading();
                } else {
                    throw new Error(data.error || 'Не удалось загрузить контакты');
                }
            } catch (error) {
                console.error('Error loading contacts:', error);
                showMessage('Ошибка загрузки контактов', 'error');
                hideLoading();
            }
        }

        // Render contacts list
// Render contacts list
function renderContacts(contacts) {
    if (!contacts || contacts.length === 0) {
        contactsList.innerHTML = '<div style="text-align: center; color: var(--telegram-hint); padding: 20px;">Нет контактов</div>';
        return;
    }

    contacts.forEach(contact => {
        const contactItem = document.createElement('div');
        contactItem.className = 'contact-item';
        
        // Если есть аватарка, используем ее, иначе - фон с инициалами
        const avatarHTML = contact.has_avatar_photo 
            ? `<div class="contact-avatar" style="background-image: url('${SERVER_URL}/avatar/${contact.platform_user_id}?${Date.now()}')"></div>`
            : (() => {
                const initials = contact.nickname 
                    ? contact.nickname.split(' ').map(n => n[0]).join('') 
                    : '?';
                const bgColor = contact.avatar_background || getRandomColor();
                return `<div class="contact-avatar" style="background-color: ${bgColor}">${initials}</div>`;
            })();
        
        contactItem.innerHTML = `
            ${avatarHTML}
            <div class="contact-info">
                <div class="contact-name">${contact.nickname || 'Без имени'}</div>
                <div class="contact-status">был(а) недавно</div>
            </div>
        `;
        
        contactItem.addEventListener('click', () => {
            createChatWithContact(contact);
        });
        
        contactsList.appendChild(contactItem);
    });
}

        // Generate random color for avatar background
        function getRandomColor() {
            const colors = ['#0088cc', '#4CAF50', '#FF5252', '#9C27B0', '#FFC107', '#00BCD4', '#FF9800'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // Create chat with selected contact
        async function createChatWithContact(contact) {
            showLoading('Создание чата...');
            
            try {
                const response = await fetch(`${SERVER_URL}/create_chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        platform_user_id: userData.platform_user_id,
                        contact_id: contact.platform_user_id
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    hideContactsModal();
                    hideLoading();
                    showMessage(`Чат с ${contact.nickname} создан`, 'success');
                    loadChats(); // Обновляем список чатов
                } else {
                    throw new Error(data.error || 'Не удалось создать чат');
                }
            } catch (error) {
                console.error('Error creating chat:', error);
                showMessage('Ошибка создания чата: ' + error.message, 'error');
                hideLoading();
            }
        }

        // Filter contacts by search term
        function filterContacts(searchTerm) {
            const contactItems = document.querySelectorAll('.contact-item');
            searchTerm = searchTerm.toLowerCase();
            
            contactItems.forEach(item => {
                const name = item.querySelector('.contact-name').textContent.toLowerCase();
                if (name.includes(searchTerm)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // Initialize page
        async function initializePage() {
            // Check authorization
            const userDataFromStorage = sessionStorage.getItem('userData');
            if (!userDataFromStorage) {
                window.location.href = 'profile.html';
                return;
            }
            
            userData = JSON.parse(userDataFromStorage);
            
            // Load data
            await loadUserData();
            await loadChats();
            
            // Event listeners
            addChatButton.addEventListener('click', (e) => {
                e.preventDefault();
                showContactsModal();
            });

            closeContacts.addEventListener('click', hideContactsModal);
            modalOverlay.addEventListener('click', hideContactsModal);
            
            contactsSearchInput.addEventListener('input', (e) => {
                filterContacts(e.target.value);
            });
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', initializePage);
        
        // Handle back/forward cache (BFCache)
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                initializePage();
            }
        });
    </script>
</body>
