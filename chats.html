<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чаты - TheVuntgram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap');
        
        :root {
            --tg-primary: #3390ec;
            --tg-primary-dark: #2b7dd6;
            --tg-secondary: #40a7e3;
            --tg-bg: #ffffff;
            --tg-bg-secondary: #f7f7f7;
            --tg-surface: #ffffff;
            --tg-text: #000000;
            --tg-text-secondary: #707579;
            --tg-text-hint: #a2acb0;
            --tg-divider: rgba(0, 0, 0, 0.06);
            --tg-shadow-light: 0 0.5px 2px rgba(0, 0, 0, 0.04);
            --tg-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            --tg-shadow-large: 0 4px 20px rgba(0, 0, 0, 0.08);
            --tg-success: #00c03e;
            --tg-destructive: #e53e3e;
            --tg-warning: #ff8c00;
            --tg-online: #0ac630;
            --tg-border-radius: 12px;
            --tg-border-radius-large: 16px;
            --tg-transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --tg-transition-bounce: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --tg-bg: #1c1c1e;
                --tg-bg-secondary: #2c2c2e;
                --tg-surface: #2c2c2e;
                --tg-text: #ffffff;
                --tg-text-secondary: #8e8e93;
                --tg-text-hint: #636366;
                --tg-divider: rgba(255, 255, 255, 0.1);
                --tg-shadow-light: 0 0.5px 2px rgba(0, 0, 0, 0.3);
                --tg-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
                --tg-shadow-large: 0 4px 20px rgba(0, 0, 0, 0.35);
            }
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, var(--tg-bg-secondary) 0%, var(--tg-bg) 100%);
            color: var(--tg-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: 17px;
            line-height: 1.47;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }
        
        .chats-container {
            flex: 1;
            max-width: 428px;
            margin: 0 auto;
            width: 100%;
            padding: 8px 16px 88px;
            animation: slideInUp 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .search-container {
            margin-bottom: 16px;
            padding: 20px;
            background: var(--tg-surface);
            border-radius: var(--tg-border-radius-large);
            box-shadow: var(--tg-shadow);
            transition: var(--tg-transition);
            backdrop-filter: blur(20px);
            border: 1px solid var(--tg-divider);
            animation: slideInDown 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }
        
        .search-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--tg-primary), transparent);
            opacity: 0;
            transition: var(--tg-transition);
        }
        
        .search-container:hover {
            transform: translateY(-2px);
            box-shadow: var(--tg-shadow-large);
        }
        
        .search-container:hover::before {
            opacity: 1;
        }
        
        .search-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--tg-text);
            letter-spacing: -0.02em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeInLeft 0.5s ease-out 0.1s both;
        }
        
        .search-input-container {
            display: flex;
            align-items: center;
            position: relative;
            animation: fadeInUp 0.5s ease-out 0.2s both;
        }
        
        .search-input {
            flex: 1;
            padding: 14px 16px 14px 48px;
            border: 2px solid var(--tg-divider);
            border-radius: var(--tg-border-radius);
            font-size: 17px;
            font-weight: 400;
            transition: var(--tg-transition);
            background: var(--tg-bg-secondary);
            color: var(--tg-text);
            backdrop-filter: blur(20px);
        }
        
        .search-input::placeholder {
            color: var(--tg-text-hint);
            transition: var(--tg-transition);
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--tg-primary);
            background: var(--tg-surface);
            box-shadow: 0 0 0 4px rgba(51, 144, 236, 0.1);
            transform: scale(1.02);
        }
        
        .search-input:focus::placeholder {
            opacity: 0.6;
            transform: translateX(8px);
        }
        
        .search-icon {
            position: absolute;
            left: 16px;
            color: var(--tg-text-hint);
            font-size: 18px;
            pointer-events: none;
            transition: var(--tg-transition);
            z-index: 2;
        }
        
        .search-input:focus + .search-icon {
            color: var(--tg-primary);
            transform: scale(1.1) rotate(15deg);
        }
        
        .add-chat-button {
            background: linear-gradient(135deg, var(--tg-primary), var(--tg-secondary));
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: var(--tg-border-radius);
            font-size: 22px;
            cursor: pointer;
            transition: var(--tg-transition-bounce);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--tg-shadow);
            position: relative;
            overflow: hidden;
        }
        
        .add-chat-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transition: var(--tg-transition);
            transform: translate(-50%, -50%);
        }
        
        .add-chat-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: var(--tg-shadow-large);
        }
        
        .add-chat-button:hover::before {
            width: 100px;
            height: 100px;
        }
        
        .add-chat-button:active {
            transform: translateY(-1px) scale(0.95);
        }
        
        .chats-content {
            background: var(--tg-surface);
            border-radius: var(--tg-border-radius-large);
            padding: 0;
            box-shadow: var(--tg-shadow);
            min-height: 300px;
            display: flex;
            flex-direction: column;
            animation: slideInUp 0.5s ease-out 0.3s both;
            backdrop-filter: blur(20px);
            border: 1px solid var(--tg-divider);
            overflow: hidden;
            position: relative;
        }
        
        .chats-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--tg-primary), transparent);
            opacity: 0.3;
        }
        
        .no-chats {
            color: var(--tg-text-hint);
            font-size: 16px;
            text-align: center;
            margin: auto;
            padding: 60px 32px;
            animation: fadeIn 0.6s ease-out 0.5s both;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        
        .no-chats::before {
            content: '💬';
            font-size: 48px;
            opacity: 0.5;
            animation: float 3s ease-in-out infinite;
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--tg-divider);
            margin: 0;
            background: var(--tg-surface);
            cursor: pointer;
            transition: var(--tg-transition);
            position: relative;
            overflow: hidden;
            animation: slideInRight 0.4s ease-out both;
        }

        .chat-item:nth-child(n) {
            animation-delay: calc(0.1s * var(--index, 0));
        }

        .chat-item:last-child {
            border-bottom: none;
        }

        .chat-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0;
            background: linear-gradient(90deg, var(--tg-primary), transparent);
            transition: var(--tg-transition);
        }

        .chat-item:hover {
            background: var(--tg-bg-secondary);
            transform: translateX(8px);
        }

        .chat-item:hover::before {
            width: 4px;
        }

        .chat-item:active {
            transform: translateX(4px) scale(0.98);
            background: var(--tg-divider);
        }
        
        .chat-avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 20px;
            margin-right: 16px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: var(--tg-shadow);
            transition: var(--tg-transition-bounce);
            flex-shrink: 0;
            border: 2px solid var(--tg-divider);
            position: relative;
            overflow: hidden;
        }

        .chat-avatar::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--tg-primary), var(--tg-secondary));
            z-index: -1;
            opacity: 0;
            transition: var(--tg-transition);
        }

        .chat-item:hover .chat-avatar {
            transform: scale(1.1) rotate(5deg);
            box-shadow: var(--tg-shadow-large);
        }

        .chat-item:hover .chat-avatar::before {
            opacity: 1;
        }
        
        .chat-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .chat-name {
            font-weight: 600;
            font-size: 17px;
            color: var(--tg-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: var(--tg-transition);
        }
        
        .chat-item:hover .chat-name {
            color: var(--tg-primary);
        }
        
        .last-message {
            font-size: 15px;
            color: var(--tg-text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: var(--tg-transition);
        }
        
        .chat-time {
            font-size: 13px;
            color: var(--tg-text-hint);
            margin-top: 4px;
            font-weight: 500;
            transition: var(--tg-transition);
        }
        
        .chat-item:hover .chat-time {
            color: var(--tg-primary);
        }
        
        .unread-badge {
            background: linear-gradient(135deg, var(--tg-primary), var(--tg-secondary));
            color: white;
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 13px;
            font-weight: 600;
            min-width: 24px;
            text-align: center;
            box-shadow: var(--tg-shadow);
            animation: pulse 2s infinite;
        }
        
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(10px);
            opacity: 0;
            visibility: hidden;
            transition: var(--tg-transition);
        }
        
        .loading-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(51, 144, 236, 0.2);
            border-radius: 50%;
            border-top-color: var(--tg-primary);
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        .loading-text {
            color: white;
            font-size: 16px;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 24px;
            border-radius: var(--tg-border-radius);
            backdrop-filter: blur(20px);
        }
        
        .message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 16px 24px;
            border-radius: var(--tg-border-radius);
            font-size: 15px;
            font-weight: 500;
            z-index: 10000;
            box-shadow: var(--tg-shadow-large);
            backdrop-filter: blur(20px);
            transition: var(--tg-transition-bounce);
            opacity: 0;
        }

        .message-box.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .message-box.error {
            background: var(--tg-destructive);
            color: white;
        }

        .message-box.success {
            background: var(--tg-success);
            color: white;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--tg-surface);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--tg-divider);
            backdrop-filter: blur(20px);
            z-index: 100;
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.1);
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--tg-text-hint);
            font-size: 10px;
            font-weight: 500;
            transition: var(--tg-transition-bounce);
            padding: 8px 16px;
            border-radius: var(--tg-border-radius);
            min-width: 70px;
            position: relative;
        }
        
        .nav-item i {
            font-size: 24px;
            margin-bottom: 4px;
            transition: var(--tg-transition-bounce);
        }

        .nav-item span {
            transition: var(--tg-transition);
        }
        
        .nav-item.active {
            color: var(--tg-primary);
        }

        .nav-item.active i {
            animation: bounceIn 0.6s ease;
        }
        
        .nav-item:hover i {
            transform: translateY(-4px) scale(1.15);
        }

        .nav-item:active {
            transform: scale(0.9);
        }

        /* Contact Modal Improvements */
        .contacts-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90vh;
            background: var(--tg-surface);
            z-index: 1000;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
            border-top-left-radius: var(--tg-border-radius-large);
            border-top-right-radius: var(--tg-border-radius-large);
            box-shadow: var(--tg-shadow-large);
            backdrop-filter: blur(20px);
            border: 1px solid var(--tg-divider);
        }

        .contacts-modal.active {
            transform: translateY(0);
        }

        .contacts-header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: var(--tg-surface);
            border-bottom: 1px solid var(--tg-divider);
            backdrop-filter: blur(20px);
        }

        .close-contacts {
            background: none;
            border: none;
            color: var(--tg-primary);
            font-size: 22px;
            margin-right: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: var(--tg-border-radius);
            transition: var(--tg-transition);
        }

        .close-contacts:hover {
            background: rgba(51, 144, 236, 0.1);
            transform: scale(1.1);
        }

        .contacts-title {
            font-size: 20px;
            font-weight: 600;
            flex: 1;
            text-align: center;
            color: var(--tg-text);
        }

        .contacts-search-btn {
            background: none;
            border: none;
            color: var(--tg-primary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: var(--tg-border-radius);
            transition: var(--tg-transition);
        }

        .contacts-search-btn:hover {
            background: rgba(51, 144, 236, 0.1);
            transform: scale(1.1);
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 80px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
            transition: var(--tg-transition);
            border-bottom: 1px solid var(--tg-divider);
        }

        .contact-item:hover {
            background: var(--tg-bg-secondary);
            transform: translateX(8px);
        }

        .contact-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: var(--tg-shadow);
            transition: var(--tg-transition-bounce);
        }

        .contact-item:hover .contact-avatar {
            transform: scale(1.1);
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--tg-text);
        }

        .contact-status {
            font-size: 14px;
            color: var(--tg-text-secondary);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: var(--tg-transition);
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        @media (max-width: 428px) {
            .chats-container {
                padding: 8px 12px 88px;
            }
            
            .search-container {
                padding: 16px;
                margin-bottom: 12px;
            }
            
            .search-title {
                font-size: 24px;
                margin-bottom: 16px;
            }
            
            .search-input {
                padding: 12px 14px 12px 44px;
                font-size: 16px;
            }
            
            .chat-avatar {
                width: 48px;
                height: 48px;
                font-size: 18px;
                margin-right: 12px;
            }

            .chat-item {
                padding: 12px 16px;
            }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes bounceIn {
            0%, 20%, 53%, 100% { transform: translateY(0) scale(1); }
            40%, 43% { transform: translateY(-8px) scale(1.1); }
            70% { transform: translateY(-4px) scale(1.05); }
            90% { transform: translateY(-2px) scale(1.02); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Загрузка данных...</div>
    </div>

    <div class="chats-container">
        <!-- Message box -->
        <div id="messageBox" class="message-box"></div>
        
        <!-- Search section -->
        <div class="search-container">
            <div class="search-title">
                Чаты
                <button id="addChatButton" class="add-chat-button">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <div class="search-input-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Поиск чатов...">
                <i class="fas fa-search search-icon"></i>
            </div>
        </div>
        
        <!-- Chats content -->
        <div class="chats-content">
            <div id="noChats" class="no-chats">Нет чатов</div>
            <div id="chatsList"></div>
        </div>
    </div>

    <!-- Bottom navigation -->
    <div class="bottom-nav">
        <a href="contacts.html" class="nav-item">
            <i class="fas fa-user-circle"></i>
            <span>Контакты</span>
        </a>
        
        <a href="chats.html" class="nav-item active">
            <i class="fas fa-comments"></i>
            <span>Чаты</span>
        </a>
     
        <a href="profile.html" class="nav-item">
            <i class="fas fa-cog"></i>
            <span>Профиль</span>
        </a>
    </div>

    <!-- Contact Modal -->
    <div id="modalOverlay" class="modal-overlay"></div>

    <div id="contactsModal" class="contacts-modal">
        <div class="contacts-header">
            <button id="closeContacts" class="close-contacts">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="contacts-title">Контакты</div>
            <button class="contacts-search-btn">
                <i class="fas fa-search"></i>
            </button>
        </div>
        
        <div class="search-input-container" style="margin: 16px 20px; position: relative;">
            <input type="text" id="contactsSearchInput" class="search-input" placeholder="Поиск" style="margin: 0;">
            <i class="fas fa-search search-icon"></i>
        </div>
        
        <div id="contactsList" class="contacts-list">
            <!-- Контакты будут добавляться здесь динамически -->
        </div>
    </div>

    <script>
        // Configuration
        const SERVER_URL = 'https://vuntserver-p1cx.onrender.com';
        
        // DOM elements
        const loadingOverlay = document.getElementById('loadingOverlay');
        const noChats = document.getElementById('noChats');
        const searchInput = document.getElementById('searchInput');
        const addChatButton = document.getElementById('addChatButton');
        const chatsList = document.getElementById('chatsList');
        const messageBox = document.getElementById('messageBox');
        const contactsModal = document.getElementById('contactsModal');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeContacts = document.getElementById('closeContacts');
        const contactsList = document.getElementById('contactsList');
        const contactsSearchInput = document.getElementById('contactsSearchInput');
        
        // User data
        let userData = {};
        
        // Show loading overlay
        function showLoading(text = 'Загрузка...') {
            loadingOverlay.querySelector('.loading-text').textContent = text;
            loadingOverlay.classList.add('show');
        }
        
        // Hide loading overlay
        function hideLoading() {
            loadingOverlay.classList.remove('show');
        }
        
        // Show message (error or success)
        function showMessage(message, type = 'error') {
            messageBox.textContent = message;
            messageBox.className = `message-box ${type} show`;
            setTimeout(() => {
                messageBox.classList.remove('show');
            }, 5000);
        }
        
        // Load user data from sessionStorage or server
        async function loadUserData() {
            showLoading('Загрузка данных пользователя...');
            
            try {
                // Проверяем кеш
                const cachedData = sessionStorage.getItem('userData');
                if (cachedData) {
                    userData = JSON.parse(cachedData);
                    hideLoading();
                    return true;
                }
                
                // Если нет в кеше, запрашиваем с сервера
                const response = await fetch(`${SERVER_URL}/get_user_data`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        platform_user_id: userData.platform_user_id
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    userData = data.user;
                    sessionStorage.setItem('userData', JSON.stringify(userData));
                    hideLoading();
                    return true;
                } else {
                    throw new Error(data.error || 'Не удалось загрузить данные пользователя');
                }
            } catch (error) {
                console.error('Error loading user data:', error);
                hideLoading();
                showMessage('Ошибка загрузки данных. Пожалуйста, перезагрузите страницу.', 'error');
                return false;
            }
        }
        
        // Load chats from server
        async function loadChats() {
            showLoading('Загрузка чатов...');
            
            try {
                const response = await fetch(`${SERVER_URL}/get_chats`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        platform_user_id: userData.platform_user_id
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    renderChats(data.chats);
                    hideLoading();
                } else {
                    // Проверяем, есть ли у пользователя чаты (data.chats существует и пустой)
                    if (data.chats && Array.isArray(data.chats) && data.chats.length === 0) {
                        renderChats([]); // Просто показываем пустой список
                        hideLoading();
                    } else {
                        throw new Error(data.error || 'Не удалось загрузить чаты');
                    }
                }
            } catch (error) {
                console.error('Error loading chats:', error);
                // Показываем сообщение только если это не просто отсутствие чатов
                if (!error.message.includes('No chats found') && !error.message.includes('нет чатов')) {
                    showMessage('Ошибка загрузки чатов', 'error');
                }
                hideLoading();
            }
        }
        
        // Render chats list
        function renderChats(chats) {
            if (!chats || chats.length === 0) {
                noChats.style.display = 'flex';
                chatsList.innerHTML = '';
                return;
            }
            
            noChats.style.display = 'none';
            chatsList.innerHTML = '';
            
            chats.forEach((chat, index) => {
                const chatItem = document.createElement('div');
                chatItem.className = 'chat-item';
                chatItem.style.setProperty('--index', index);
                
                const initials = chat.name 
                    ? chat.name.split(' ').map(n => n[0]).join('') 
                    : '?';
                
                const bgColor = chat.avatar_background || getRandomColor();
                
                chatItem.innerHTML = `
                    <div class="chat-avatar" style="background: linear-gradient(135deg, ${bgColor}, ${lightenColor(bgColor, 20)})">
                        ${initials}
                    </div>
                    <div class="chat-info">
                        <div class="chat-name">${chat.name || 'Новый чат'}</div>
                        <div class="last-message">${chat.last_message || 'Начните общение'}</div>
                        <div class="chat-time">${formatTime(chat.last_message_time)}</div>
                    </div>
                `;
                
                chatItem.addEventListener('click', () => {
                    // Здесь будет переход в чат
                    showMessage('Чат будет открыт в следующей версии', 'success');
                });
                
                chatsList.appendChild(chatItem);
            });
        }
        
        // Format time for chat list
        function formatTime(timestamp) {
            if (!timestamp) return 'только что';
            
            const date = new Date(timestamp);
            const now = new Date();
            
            if (date.toDateString() === now.toDateString()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (date.getFullYear() === now.getFullYear()) {
                return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
            } else {
                return date.toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' });
            }
        }
        
        // Show contacts modal
        function showContactsModal() {
            contactsModal.classList.add('active');
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            loadContacts();
        }

        // Hide contacts modal
        function hideContactsModal() {
            contactsModal.classList.remove('active');
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Load contacts from server
        async function loadContacts() {
            showLoading('Загрузка контактов...');
            contactsList.innerHTML = '';
            
            try {
                const response = await fetch(`${SERVER_URL}/get_friends`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        platform_user_id: userData.platform_user_id
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    renderContacts(data.friends);
                    hideLoading();
                } else {
                    throw new Error(data.error || 'Не удалось загрузить контакты');
                }
            } catch (error) {
                console.error('Error loading contacts:', error);
                showMessage('Ошибка загрузки контактов', 'error');
                hideLoading();
            }
        }

        // Render contacts list
        function renderContacts(contacts) {
            if (!contacts || contacts.length === 0) {
                contactsList.innerHTML = '<div style="text-align: center; color: var(--tg-text-hint); padding: 40px 20px;">Нет контактов</div>';
                return;
            }

            contacts.forEach(contact => {
                const contactItem = document.createElement('div');
                contactItem.className = 'contact-item';
                
                // Если есть аватарка, используем ее, иначе - фон с инициалами
                const avatarHTML = contact.has_avatar_photo 
                    ? `<div class="contact-avatar" style="background-image: url('${SERVER_URL}/avatar/${contact.platform_user_id}?${Date.now()}')"></div>`
                    : (() => {
                        const initials = contact.nickname 
                            ? contact.nickname.split(' ').map(n => n[0]).join('') 
                            : '?';
                        const bgColor = contact.avatar_background || getRandomColor();
                        return `<div class="contact-avatar" style="background: linear-gradient(135deg, ${bgColor}, ${lightenColor(bgColor, 20)})">${initials}</div>`;
                    })();
                
                contactItem.innerHTML = `
                    ${avatarHTML}
                    <div class="contact-info">
                        <div class="contact-name">${contact.nickname || 'Без имени'}</div>
                        <div class="contact-status">был(а) недавно</div>
                    </div>
                `;
                
                contactItem.addEventListener('click', () => {
                    createChatWithContact(contact);
                });
                
                contactsList.appendChild(contactItem);
            });
        }

        // Generate random color for avatar background
        function getRandomColor() {
            const colors = ['#3390ec', '#00c03e', '#ff8c00', '#e53e3e', '#8b5cf6', '#06b6d4', '#f59e0b'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // Lighten color
        function lightenColor(hex, percent) {
            const num = parseInt(hex.replace("#", ""), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            
            return `#${
                (0x1000000 +
                (R < 255 ? (R < 1 ? 0 : R) : 255) * 0x10000 +
                (G < 255 ? (G < 1 ? 0 : G) : 255) * 0x100 +
                (B < 255 ? (B < 1 ? 0 : B) : 255)
            ).toString(16).slice(1)}`;
        }

        // Create chat with selected contact
        async function createChatWithContact(contact) {
            showLoading('Создание чата...');
            
            try {
                const response = await fetch(`${SERVER_URL}/create_chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        platform_user_id: userData.platform_user_id,
                        contact_id: contact.platform_user_id
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    hideContactsModal();
                    hideLoading();
                    showMessage(`Чат с ${contact.nickname} создан`, 'success');
                    loadChats(); // Обновляем список чатов
                } else {
                    throw new Error(data.error || 'Не удалось создать чат');
                }
            } catch (error) {
                console.error('Error creating chat:', error);
                showMessage('Ошибка создания чата: ' + error.message, 'error');
                hideLoading();
            }
        }

        // Filter contacts by search term
        function filterContacts(searchTerm) {
            const contactItems = document.querySelectorAll('.contact-item');
            searchTerm = searchTerm.toLowerCase();
            
            contactItems.forEach(item => {
                const name = item.querySelector('.contact-name').textContent.toLowerCase();
                if (name.includes(searchTerm)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // Initialize page
        async function initializePage() {
            // Check authorization
            const userDataFromStorage = sessionStorage.getItem('userData');
            if (!userDataFromStorage) {
                window.location.href = 'profile.html';
                return;
            }
            
            userData = JSON.parse(userDataFromStorage);
            
            // Load data
            await loadUserData();
            await loadChats();
            
            // Event listeners
            addChatButton.addEventListener('click', (e) => {
                e.preventDefault();
                showContactsModal();
            });

            closeContacts.addEventListener('click', hideContactsModal);
            modalOverlay.addEventListener('click', hideContactsModal);
            
            contactsSearchInput.addEventListener('input', (e) => {
                filterContacts(e.target.value);
            });
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', initializePage);
        
        // Handle back/forward cache (BFCache)
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                initializePage();
            }
        });
    </script>
</body>
</html>
