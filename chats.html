<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чаты - TheVuntgram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --tg-theme-bg-color: #17212b;
            --tg-theme-secondary-bg-color: #242f3d;
            --tg-theme-header-bg-color: #242f3d;
            --tg-theme-section-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #708499;
            --tg-theme-link-color: #2481cc;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-destructive-text-color: #ee686f;
            --telegram-blue: #0088cc;
            --telegram-light-blue: #40a7e3;
            --telegram-bg: #ffffff;
            --telegram-secondary-bg: #f4f4f5;
            --telegram-text: #000000;
            --telegram-hint: #8e8e93;
            --online-green: #00c73c;
            --telegram-divider: rgba(0,0,0,0.08);
            --telegram-shadow: 0 1px 3px rgba(0,0,0,0.06);
            --telegram-shadow-large: 0 4px 16px rgba(0,0,0,0.08);
            --telegram-destructive: #ee686f;
            --telegram-success: #00c73c;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --telegram-bg: #212121;
                --telegram-secondary-bg: #1d1d1d;
                --telegram-text: #ffffff;
                --telegram-hint: #8e8e93;
                --telegram-divider: rgba(255,255,255,0.12);
                --telegram-shadow: 0 1px 3px rgba(0,0,0,0.24);
                --telegram-shadow-large: 0 4px 16px rgba(0,0,0,0.24);
            }
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background-color: var(--telegram-secondary-bg);
            color: var(--telegram-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .chats-container {
            flex: 1;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            padding: 12px 12px 80px;
            animation: fadeInUp 0.3s ease-out;
        }
        
        .search-container {
            margin-bottom: 12px;
            padding: 16px;
            background: var(--telegram-bg);
            border-radius: 12px;
            box-shadow: var(--telegram-shadow);
            transition: all 0.2s ease;
            animation: fadeInUp 0.3s ease-out;
            position: relative;
        }
        
        .search-container:active {
            transform: scale(0.99);
        }
        
        .search-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--telegram-text);
            letter-spacing: -0.02em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .search-input-container {
            display: flex;
            align-items: center;
            position: relative;
        }
        
        .search-input {
            flex: 1;
            padding: 12px 16px;
            padding-left: 44px;
            border: 1px solid var(--telegram-divider);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s ease;
            background-color: var(--telegram-secondary-bg);
            color: var(--telegram-text);
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--telegram-blue);
            box-shadow: 0 0 0 2px rgba(36, 129, 204, 0.1);
            background-color: var(--telegram-bg);
        }
        
        .search-icon {
            position: absolute;
            left: 16px;
            color: var(--telegram-hint);
            font-size: 16px;
            pointer-events: none;
        }
        
        .add-chat-button {
            background-color: transparent;
            color: var(--telegram-blue);
            border: none;
            width: auto;
            height: auto;
            padding: 0;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .add-chat-button:hover {
            background-color: transparent;
            transform: translateY(-1px) scale(1.1);
            box-shadow: none;
        }

        .add-chat-button:active {
            transform: scale(0.95);
        }
        
        .chats-content {
            background: var(--telegram-bg);
            border-radius: 12px;
            padding: 0;
            box-shadow: var(--telegram-shadow);
            min-height: 200px;
            display: flex;
            flex-direction: column;
            animation: fadeInUp 0.3s ease-out 0.1s;
            animation-fill-mode: both;
            overflow: hidden;
        }
        
        .no-chats {
            color: var(--telegram-hint);
            font-size: 15px;
            text-align: center;
            margin: auto;
            opacity: 0;
            animation: fadeIn 0.3s ease-out 0.2s forwards;
            padding: 40px 20px;
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--telegram-divider);
            margin: 0;
            background-color: var(--telegram-bg);
            animation: fadeIn 0.3s ease-out;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chat-item:last-child {
            border-bottom: none;
        }

        .chat-item:hover {
            background-color: rgba(0,0,0,0.02);
        }

        .chat-item:active {
            background-color: rgba(0,0,0,0.04);
            transform: scale(0.98);
        }

        @media (prefers-color-scheme: dark) {
            .chat-item:hover {
                background-color: rgba(255,255,255,0.04);
            }

            .chat-item:active {
                background-color: rgba(255,255,255,0.08);
            }
        }
        
        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
            margin-right: 12px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: var(--telegram-shadow);
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        .chat-avatar:hover {
            transform: scale(1.02);
        }
        
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        
        .chat-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--telegram-text);
        }
        
        .last-message {
            font-size: 14px;
            color: var(--telegram-hint);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-time {
            font-size: 12px;
            color: var(--telegram-hint);
            margin-top: 4px;
        }
        
        .unread-badge {
            background-color: var(--telegram-blue);
            color: white;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 600;
            min-width: 20px;
            text-align: center;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.3s ease-in-out;
            backdrop-filter: blur(8px);
        }
        
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(36, 129, 204, 0.2);
            border-radius: 50%;
            border-top-color: var(--telegram-blue);
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        
        .loading-text {
            color: var(--telegram-text);
            font-size: 15px;
            font-weight: 500;
            background: var(--telegram-bg);
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: var(--telegram-shadow-large);
        }
        
        .message-box {
            text-align: center;
            padding: 12px 16px;
            margin: 12px;
            border-radius: 12px;
            display: none;
            font-size: 15px;
            font-weight: 500;
            animation: slideDown 0.3s ease;
        }

        .message-box.error {
            color: white;
            background: var(--telegram-destructive);
        }

        .message-box.success {
            color: white;
            background: var(--telegram-success);
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--telegram-bg);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--telegram-divider);
            backdrop-filter: blur(20px);
            z-index: 100;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--telegram-hint);
            font-size: 10px;
            font-weight: 500;
            transition: all 0.2s ease;
            padding: 8px 12px;
            border-radius: 12px;
            min-width: 60px;
        }
        
        .nav-item i {
            font-size: 22px;
            margin-bottom: 2px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-item span {
            transition: all 0.2s ease;
        }
        
        .nav-item.active {
            color: var(--telegram-blue);
        }

        .nav-item.active i {
            animation: bounce 0.6s ease;
        }
        
        .nav-item:hover i {
            transform: translateY(-2px) scale(1.1);
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        /* Модальное окно контактов */
        .contacts-modal {
            position: fixed;
            bottom: -100%;
            left: 0;
            right: 0;
            height: 85vh;
            background: var(--telegram-bg);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding: 20px;
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            overflow-y: auto;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translateY(100%);
        }

        .contacts-modal.active {
            transform: translateY(0);
        }

        .contacts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--telegram-divider);
        }

        .contacts-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--telegram-text);
        }

        .close-contacts {
            background: none;
            border: none;
            color: var(--telegram-blue);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
        }

        .contacts-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 12px;
            background: var(--telegram-secondary-bg);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .contact-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .contact-avatar {
            width: 40px;
            height: 40px;
            border-radius: 20px;
            margin-right: 12px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .contact-info {
            flex: 1;
        }

        .contact-name {
            font-weight: 500;
            color: var(--telegram-text);
            margin-bottom: 2px;
        }

        .contact-status {
            font-size: 12px;
            color: var(--telegram-hint);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        @media (max-width: 480px) {
            .chats-container {
                padding: 8px 8px 80px;
            }
            
            .search-container {
                padding: 12px;
            }
            
            .search-title {
                font-size: 20px;
                margin-bottom: 12px;
            }
            
            .search-input {
                padding: 10px 14px;
                padding-left: 40px;
                font-size: 16px;
            }
            
            .chat-avatar {
                width: 40px;
                height: 40px;
                font-size: 16px;
                margin-right: 10px;
            }

            .contacts-modal {
                height: 80vh;
                padding: 16px;
            }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes fadeInUp {
            from { 
                opacity: 0;
                transform: translateY(20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 20%, 53%, 100% {
                transform: translateY(0);
            }
            40%, 43% {
                transform: translateY(-8px);
            }
            70% {
                transform: translateY(-4px);
            }
            90% {
                transform: translateY(-2px);
            }
        }
    </style>
</head>
<body>
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Загрузка данных...</div>
    </div>

    <div class="chats-container">
        <!-- Message box -->
        <div id="messageBox" class="message-box"></div>
        
        <!-- Search section -->
        <div class="search-container">
            <div class="search-title">
                Чаты
                <button id="addChatButton" class="add-chat-button">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <div class="search-input-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Поиск чатов...">
            </div>
        </div>
        
        <!-- Chats content -->
        <div class="chats-content">
            <div id="noChats" class="no-chats">Нет чатов</div>
            <div id="chatsList"></div>
        </div>
    </div>

    <!-- Bottom navigation -->
    <div class="bottom-nav">
        <a href="contacts.html" class="nav-item">
            <i class="fas fa-user-circle"></i>
            <span>Контакты</span>
        </a>
        
        <a href="chats.html" class="nav-item active">
            <i class="fas fa-comments"></i>
            <span>Чаты</span>
        </a>
     
        <a href="profile.html" class="nav-item">
            <i class="fas fa-cog"></i>
            <span>Профиль</span>
        </a>
    </div>

    <!-- Модальное окно контактов -->
    <div id="modalOverlay" class="modal-overlay"></div>

    <div id="contactsModal" class="contacts-modal">
        <div class="contacts-header">
            <div class="contacts-title">Выберите контакт</div>
            <button id="closeContacts" class="close-contacts">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div id="contactsList" class="contacts-list">
            <!-- Контакты будут добавляться здесь динамически -->
        </div>
    </div>

    <script>
        // Configuration
        const SERVER_URL = 'https://vuntserver-p1cx.onrender.com';
        
        // DOM elements
        const loadingOverlay = document.getElementById('loadingOverlay');
        const noChats = document.getElementById('noChats');
        const searchInput = document.getElementById('searchInput');
        const addChatButton = document.getElementById('addChatButton');
        const chatsList = document.getElementById('chatsList');
        const messageBox = document.getElementById('messageBox');
        const contactsModal = document.getElementById('contactsModal');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeContacts = document.getElementById('closeContacts');
        const contactsList = document.getElementById('contactsList');
        const contacts = JSON.parse(sessionStorage.getItem('userContacts')) || [];
if (contacts.length > 0) {
    renderContacts(contacts); // Отрисовка контактов в модальном окне
}
        
        // User data from profile page
        let userData = {};
        
        // Show loading overlay
        function showLoading(text = 'Загрузка...') {
            loadingOverlay.querySelector('.loading-text').textContent = text;
            loadingOverlay.style.display = 'flex';
            loadingOverlay.style.opacity = '1';
        }
        
        // Hide loading overlay
        function hideLoading() {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => {
                loadingOverlay.style.display = 'none';
            }, 300);
        }
        
        // Show message (error or success)
        function showMessage(message, type = 'error') {
            messageBox.textContent = message;
            messageBox.className = `message-box ${type}`;
            messageBox.style.display = 'block';
            setTimeout(() => {
                messageBox.style.display = 'none';
            }, 5000);
        }
        
        // Load user data from sessionStorage
        function loadUserData() {
            showLoading('Загрузка данных пользователя...');
            
            try {
                const data = JSON.parse(sessionStorage.getItem('userData'));
                
                if (data && data.platform_user_id) {
                    userData = {
                        nickname: data.nickname || "не указано",
                        identity: data.identity || "не указано",
                        main_school_code: data.main_school_code || "не указано",
                        main_school_name: data.main_school_name || "не указано",
                        class_number: data.class_number || "не указано",
                        class_letter: data.class_letter || "не указано",
                        additional_school_code: data.additional_school_code || "не указано",
                        additional_school_name: data.additional_school_name || "не указано",
                        specialization: data.specialization || "не указано",
                        course: data.course || "не указано",
                        platform_user_id: data.platform_user_id
                    };
                    
                    console.log('User data loaded:', userData);
                    hideLoading();
                } else {
                    throw new Error('No user data found');
                }
            } catch (error) {
                console.error('Error loading user data:', error);
                hideLoading();
                // Redirect to profile if no data
                window.location.href = 'profile.html';
            }
        }
        
        // Load chats (placeholder - no actual data loading yet)
        function loadChats() {
            showLoading('Загрузка чатов...');
            chatsList.innerHTML = '';
            noChats.style.display = 'block';
            hideLoading();
        }
        
        // Show contacts modal
        function showContactsModal() {
            contactsModal.classList.add('active');
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            loadContacts();
        }

        // Hide contacts modal
        function hideContactsModal() {
            contactsModal.classList.remove('active');
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Load contacts from server
        function loadContacts() {
            showLoading('Загрузка контактов...');
            contactsList.innerHTML = '';
            
            // Здесь должен быть реальный запрос к серверу для получения контактов
            // Временная имитация запроса
            setTimeout(() => {
                // Получаем список друзей пользователя
                fetch(`${SERVER_URL}/get_friends`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        platform_user_id: userData.platform_user_id
                    }),
                    credentials: 'include'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        renderContacts(data.friends);
                    } else {
                        showMessage('Не удалось загрузить контакты', 'error');
                    }
                    hideLoading();
                })
                .catch(error => {
                    console.error('Error loading contacts:', error);
                    showMessage('Ошибка загрузки контактов', 'error');
                    hideLoading();
                });
            }, 500);
        }

        // Render contacts list
        function renderContacts(contacts) {
            if (!contacts || contacts.length === 0) {
                contactsList.innerHTML = '<div style="text-align: center; color: var(--telegram-hint); padding: 20px;">Нет контактов</div>';
                return;
            }

            contacts.forEach(contact => {
                const contactItem = document.createElement('div');
                contactItem.className = 'contact-item';
                
                // Генерируем аватар на основе первых букв имени
                const initials = contact.nickname 
                    ? contact.nickname.split(' ').map(n => n[0]).join('') 
                    : '?';
                
                // Используем цвет фона из базы или генерируем случайный
                const bgColor = contact.avatar_background || getRandomColor();
                
                contactItem.innerHTML = `
                    <div class="contact-avatar" style="background-color: ${bgColor}">
                        ${initials}
                    </div>
                    <div class="contact-info">
                        <div class="contact-name">${contact.nickname || 'Без имени'}</div>
                        <div class="contact-status">${contact.identity || 'Статус не указан'}</div>
                    </div>
                `;
                
                // Добавляем обработчик клика для создания чата
                contactItem.addEventListener('click', () => {
                    createChatWithContact(contact);
                });
                
                contactsList.appendChild(contactItem);
            });
        }

        // Generate random color for avatar background
        function getRandomColor() {
            const colors = ['#0088cc', '#4CAF50', '#FF5252', '#9C27B0', '#FFC107', '#00BCD4', '#FF9800'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // Create chat with selected contact
        function createChatWithContact(contact) {
            showLoading('Создание чата...');
            
            // Здесь должен быть запрос к серверу для создания чата
            // Временная имитация
            setTimeout(() => {
                hideContactsModal();
                hideLoading();
                showMessage(`Чат с ${contact.nickname} создан`, 'success');
                
                // Добавляем новый чат в список (в реальном приложении нужно обновить список чатов)
                addNewChat(contact);
            }, 1000);
        }

        // Add new chat to the list (temporary function)
        function addNewChat(contact) {
            noChats.style.display = 'none';
            
            const chatItem = document.createElement('div');
            chatItem.className = 'chat-item';
            
            const initials = contact.nickname 
                ? contact.nickname.split(' ').map(n => n[0]).join('') 
                : '?';
            
            const bgColor = contact.avatar_background || getRandomColor();
            
            chatItem.innerHTML = `
                <div class="chat-avatar" style="background-color: ${bgColor}">
                    ${initials}
                </div>
                <div class="chat-info">
                    <div class="chat-name">${contact.nickname || 'Новый чат'}</div>
                    <div class="last-message">Начните общение</div>
                    <div class="chat-time">только что</div>
                </div>
            `;
            
            // Добавляем обработчик клика для перехода в чат
            chatItem.addEventListener('click', () => {
                showMessage('Переход в чат будет реализован позже', 'info');
            });
            
            chatsList.prepend(chatItem);
        }

        // Event listeners
        window.addEventListener('DOMContentLoaded', () => {
            loadUserData();
            loadChats();
            
            // Обработчик кнопки добавления чата
            addChatButton.addEventListener('click', (e) => {
                e.preventDefault();
                showContactsModal();
                loadContacts();
            });

            // Обработчики закрытия модального окна
            closeContacts.addEventListener('click', hideContactsModal);
            modalOverlay.addEventListener('click', hideContactsModal);
        });
        
        // Handle back/forward cache (BFCache)
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                loadUserData();
                loadChats();
            }
        });
    </script>
</body>
</html>
