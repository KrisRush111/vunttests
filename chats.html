        const SERVER_URL = 'https://vuntserver-479v.onrender.com';
// --- IndexedDB Logic for Local Caching ---
const DB_NAME = 'VuntgramDB';
const DB_VERSION = 1;
const STORE_CHATS = 'chats';
const STORE_MESSAGES = 'messages';

let db;

function initDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_CHATS)) {
                db.createObjectStore(STORE_CHATS, { keyPath: 'id' });
            }
            if (!db.objectStoreNames.contains(STORE_MESSAGES)) {
                db.createObjectStore(STORE_MESSAGES, { keyPath: 'chat_id' });
            }
        };

        request.onsuccess = (event) => {
            db = event.target.result;
            resolve(db);
        };

        request.onerror = (event) => {
            console.error('IndexedDB error:', event.target.error);
            reject(event.target.error);
        };
    });
}

async function saveChatsLocal(chats) {
    if (!db) await initDB();
    const tx = db.transaction(STORE_CHATS, 'readwrite');
    const store = tx.objectStore(STORE_CHATS);
    // Clear old chats and save new ones
    store.clear();
    chats.forEach(chat => store.put(chat));
    return tx.complete;
}

async function getChatsLocal() {
    if (!db) await initDB();
    return new Promise((resolve) => {
        const tx = db.transaction(STORE_CHATS, 'readonly');
        const store = tx.objectStore(STORE_CHATS);
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result);
    });
}

async function saveMessagesLocal(chatId, messages) {
    if (!db) await initDB();
    const tx = db.transaction(STORE_MESSAGES, 'readwrite');
    const store = tx.objectStore(STORE_MESSAGES);
    store.put({ chat_id: chatId, messages: messages, timestamp: Date.now() });
    return tx.complete;
}

async function getMessagesLocal(chatId) {
    if (!db) await initDB();
    return new Promise((resolve) => {
        const tx = db.transaction(STORE_MESSAGES, 'readonly');
        const store = tx.objectStore(STORE_MESSAGES);
        const request = store.get(chatId);
        request.onsuccess = () => resolve(request.result ? request.result.messages : null);
    });
}

async function updateLocalChat(chatId, updates) {
    if (!db) await initDB();
    const tx = db.transaction(STORE_CHATS, 'readwrite');
    const store = tx.objectStore(STORE_CHATS);
    const request = store.get(chatId);
    request.onsuccess = () => {
        const chat = request.result;
        if (chat) {
            Object.assign(chat, updates);
            store.put(chat);
        }
    };
}
// --- End of IndexedDB Logic ---

// Инициализация системы обоев
function initializeWallpaperSystem() {
    loadWallpaperSettings();
    applyWallpaper();
    setupWallpaperBroadcastListener();
    
    // Применяем обои при изменении ориентации/размера
    window.addEventListener('resize', () => {
        applyWallpaper();
    });
    
    // Обновляем обои при возвращении на вкладку
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            setTimeout(applyWallpaper, 100);
        }
    });
}

// Загрузка настроек обоев из localStorage
function loadWallpaperSettings() {
    const saved = localStorage.getItem('vuntgram_wallpaper');
    if (saved) {
        try {
            const parsed = JSON.parse(saved);
            wallpaperState = {
                enabled: parsed.enabled || false,
                selectedWallpaper: parsed.selectedWallpaper || 'default'
            };
        } catch (e) {
            console.error('Error loading wallpaper settings:', e);
            // Используем настройки по умолчанию
            wallpaperState = {
                enabled: false,
                selectedWallpaper: 'default'
            };
        }
    }
}

function applyWallpaper() {
    const selectedWallpaper = WALLPAPERS.find(w => w.id === wallpaperState.selectedWallpaper);
    
    if (!selectedWallpaper) {
        console.error('Selected wallpaper not found, using default');
        wallpaperState.selectedWallpaper = 'default';
        return;
    }
    
    console.log('Applying wallpaper:', wallpaperState.selectedWallpaper, 'enabled:', wallpaperState.enabled);
    
    // Устанавливаем CSS переменную
    document.documentElement.style.setProperty('--wallpaper-url', `url('${selectedWallpaper.url}')`);
    
    // Получаем все необходимые элементы
    const desktopPlaceholder = document.getElementById('desktopPlaceholder');
    const chatModalDesktop = document.getElementById('chatModalDesktop');
    const chatModalMobile = document.getElementById('chatModalMobile');
    const isMobile = window.matchMedia("(max-width: 767px)").matches;
    
    if (wallpaperState.enabled) {
        // Для десктопа - обои везде
        if (!isMobile) {
            document.body.classList.add('wallpaper-enabled');
            document.body.style.backgroundImage = `url('${selectedWallpaper.url}')`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundRepeat = 'no-repeat';
            document.body.style.backgroundAttachment = 'fixed';
        }
        
        // Для десктоп плейсхолдера
        if (desktopPlaceholder && !isMobile) {
            desktopPlaceholder.classList.add('wallpaper-enabled');
            desktopPlaceholder.style.backgroundImage = `url('${selectedWallpaper.url}')`;
            desktopPlaceholder.style.backgroundSize = 'cover';
            desktopPlaceholder.style.backgroundPosition = 'center';
            desktopPlaceholder.style.backgroundRepeat = 'no-repeat';
        }
        
        // Для десктоп чата
        if (chatModalDesktop && !isMobile) {
            chatModalDesktop.classList.add('wallpaper-enabled');
            chatModalDesktop.style.backgroundImage = `url('${selectedWallpaper.url}')`;
            chatModalDesktop.style.backgroundSize = 'cover';
            chatModalDesktop.style.backgroundPosition = 'center';
            chatModalDesktop.style.backgroundRepeat = 'no-repeat';
        }
        
        // Для мобильного чата - обои только в открытом чате
        if (chatModalMobile && isMobile) {
            chatModalMobile.classList.add('wallpaper-enabled');
            chatModalMobile.style.backgroundImage = `url('${selectedWallpaper.url}')`;
            chatModalMobile.style.backgroundSize = 'cover';
            chatModalMobile.style.backgroundPosition = 'center';
            chatModalMobile.style.backgroundRepeat = 'no-repeat';
        }
    } else {
        // Убираем обои со всех элементов
        document.body.classList.remove('wallpaper-enabled');
        document.body.style.backgroundImage = '';
        document.body.style.backgroundColor = 'var(--telegram-secondary-bg)';
        
        if (desktopPlaceholder) {
            desktopPlaceholder.classList.remove('wallpaper-enabled');
            desktopPlaceholder.style.backgroundImage = '';
            desktopPlaceholder.style.backgroundColor = 'var(--telegram-secondary-bg)';
        }
        
        if (chatModalDesktop) {
            chatModalDesktop.classList.remove('wallpaper-enabled');
            chatModalDesktop.style.backgroundImage = '';
            chatModalDesktop.style.backgroundColor = 'var(--telegram-secondary-bg)';
        }
        
        if (chatModalMobile) {
            chatModalMobile.classList.remove('wallpaper-enabled');
            chatModalMobile.style.backgroundImage = '';
            chatModalMobile.style.backgroundColor = 'var(--telegram-secondary-bg)';
        }
    }
}

// Слушатель для обновлений обоев из других вкладок (например, из profile.html)
function setupWallpaperBroadcastListener() {
    if (typeof BroadcastChannel !== 'undefined') {
        try {
            const channel = new BroadcastChannel('vuntgram_wallpaper');
            channel.addEventListener('message', (event) => {
                if (event.data.type === 'wallpaper_update') {
                    console.log('Received wallpaper update from other tab');
                    wallpaperState = {
                        enabled: event.data.data.enabled,
                        selectedWallpaper: event.data.data.selectedWallpaper
                    };
                    
                    // Применяем новые обои
                    applyWallpaper();
                }
            });
            
            // Закрываем канал при выгрузке страницы
            window.addEventListener('beforeunload', () => {
                channel.close();
            });
        } catch (e) {
            console.error('BroadcastChannel listener error:', e);
        }
    }
}

        }

}

}




function adjustColor(hex, percent) {
    const num = parseInt(hex.replace("#", ""), 16);
    const amt = Math.round(2.55 * percent);
    const R = (num >> 16) + amt;
    const G = (num >> 8 & 0x00FF) + amt;
    const B = (num & 0x0000FF) + amt;

    return `#${
        (0x1000000 +
        (R < 255 ? (R < 1 ? 0 : R) : 255) * 0x10000 +
        (G < 255 ? (G < 1 ? 0 : G) : 255) * 0x100 +
        (B < 255 ? (B < 1 ? 0 : B) : 255)
    ).toString(16).slice(1)}`;
}

function formatDateHeader(timestamp) {
    if (!timestamp) return '';
    
    const date = new Date(timestamp);
    const now = new Date();
    

    const today = new Date(now);
    today.setHours(0, 0, 0, 0);
    
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    
   
    const messageDate = new Date(date);
    messageDate.setHours(0, 0, 0, 0);
    

    if (messageDate.getTime() === today.getTime()) {
        return 'Сегодня';
    } else if (messageDate.getTime() === yesterday.getTime()) {
        return 'Вчера';
    } else {
        const months = [
            'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
            'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'
        ];
        const day = messageDate.getDate();
        const month = months[messageDate.getMonth()];
        return `${day} ${month}`;
    }
}

        // Функция обработки выбора изображений
function handleImageSelection(event) {
    const files = event.target.files;
    if (!files || files.length === 0) return;
    
    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        if (file.type.startsWith('image/')) {
            sendImageMessage(file);
        }
    }
    
    // Сбрасываем input для возможности выбора тех же файлов снова
    event.target.value = '';
}

async function sendImageMessage(file) {
    if (!currentChat || isSendingMessage) return;
    
    isSendingMessage = true;
    const { messagesContainer, noMessages, sendMessageButton } = getActiveElements();
    
    try {
        // Создаем временное сообщение для отображения загрузки
        const tempMessageId = `temp_${Date.now()}`;
        const tempMessage = {
            id: tempMessageId,
            sender_id: userData.platform_user_id,
            content: 'Загрузка изображения...',
            sent_at: new Date().toISOString(),
            is_read: false,
            is_me: true,
            is_image: true,
            is_uploading: true
        };
        
        currentMessages = [...currentMessages, tempMessage];
        noMessages.style.display = 'none';
        renderMessages(currentMessages);
        
        // Подготавливаем форму для отправки
        const formData = new FormData();
        formData.append('chat_id', currentChat.id);
        formData.append('sender_id', userData.platform_user_id);
        formData.append('image', file);
        
        // Если это временный чат, сначала создаем его
        let actualChatId = currentChat.id;
        if (currentChat.is_temp) {
            const response = await fetch(`${SERVER_URL}/create_chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    platform_user_id: userData.platform_user_id,
                    contact_id: currentChat.participants[0].platform_user_id
                }),
                credentials: 'include'
            });
            
            const data = await response.json();
            
            if (data.status !== 'success') {
                throw new Error(data.error || 'Не удалось создать чат');
            }
            
            actualChatId = data.chat_id;
            currentChat.id = data.chat_id;
            currentChat.is_temp = false;
            
            // ВМЕСТО loadChats() - добавляем новый чат в список
            const newChat = {
                id: data.chat_id,
                name: currentChat.name,
                last_message: '📷 Фото',
                last_message_time: new Date().toISOString(),
                unread_count: 0,
                participants: currentChat.participants,
                has_avatar_photo: currentChat.has_avatar_photo,
                avatar_background: currentChat.avatar_background,
                last_message_type: 'image'
            };
            
            // Добавляем в начало списка чатов
            currentChatsList.unshift(newChat);
            // Обновляем DOM только для этого чата
            updateChatItemInDOM(data.chat_id, newChat);
        }
        
        // Отправляем изображение с правильным chat_id
        const messageResponse = await fetch(`${SERVER_URL}/send_image_message`, {
            method: 'POST',
            body: formData,
            credentials: 'include'
        });
        
        const messageData = await messageResponse.json();
        
        if (messageData.status !== 'success') {
            throw new Error(messageData.error || 'Не удалось отправить изображение');
        }
        
        // Удаляем временное сообщение и добавляем настоящее
        currentMessages = currentMessages.filter(msg => msg.id !== tempMessageId);
        
        const newMessage = {
            id: messageData.message_id,
            sender_id: userData.platform_user_id,
            content: messageData.image_url,
            sent_at: messageData.sent_at || new Date().toISOString(),
            is_read: false,
            is_me: true,
            is_image: true
        };
        
        currentMessages = [...currentMessages, newMessage];
        renderMessages(currentMessages);
        
        // Обновляем информацию о чате в списке (только для существующих чатов)
        if (!currentChat.is_temp) {
            updateChatItemInDOM(currentChat.id, {
                last_message: '📷 Фото',
                last_message_time: newMessage.sent_at,
                unread_count: 0,
                last_message_type: 'image'
            });
            
            // Обновляем данные в кэше чатов
            const chatIndex = currentChatsList.findIndex(chat => chat.id === currentChat.id);
            if (chatIndex !== -1) {
                currentChatsList[chatIndex].last_message = '📷 Фото';
                currentChatsList[chatIndex].last_message_time = newMessage.sent_at;
                currentChatsList[chatIndex].last_message_type = 'image';
                currentChatsList[chatIndex].unread_count = 0;
                
                // Перемещаем чат в начало списка
                const updatedChat = currentChatsList.splice(chatIndex, 1)[0];
                currentChatsList.unshift(updatedChat);
                moveChatToTop(currentChat.id);
            }
        }
        
        // Прокручиваем к последнему сообщению
        setTimeout(() => {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }, 50);
        
    } catch (error) {
        console.error('Error sending image:', error);
        showMessage('Ошибка отправки изображения: ' + error.message, 'error');
        
        // Удаляем временное сообщение об ошибке
        currentMessages = currentMessages.filter(msg => !msg.is_uploading);
        renderMessages(currentMessages);
    } finally {
        isSendingMessage = false;
        sendMessageButton.disabled = false;
    }
}

function renderMessage(message) {
    const { messagesContainer } = getActiveElements();
    
    const messageElement = document.createElement('div');
    messageElement.className = `message ${message.is_me ? 'message-outgoing' : 'message-incoming'}`;
    messageElement.setAttribute('data-message-id', message.id);
    
    const messageTime = formatChatMessageTime(message.sent_at);
    
    let statusIcons = '';
    if (message.is_me) {
        const isRead = message.is_read;
        statusIcons = `
            <div class="message-status">
                <div class="status-icons">
                    <i class="fas fa-check${isRead ? '-double' : ''} status-icon ${isRead ? 'read' : 'sent'}"></i>
                </div>
            </div>
        `;
    }
    
    let messageContent = '';
    
    if (message.is_image || (message.content && isImageUrl(message.content))) {
        // Находим индекс этого изображения среди всех изображений чата
        const imageMessages = currentMessages.filter(msg => msg.is_image || (msg.content && isImageUrl(msg.content)));
        const imageIndex = imageMessages.findIndex(msg => msg.id === message.id);
        
        const imageUrl = message.content;
        
        messageContent = `
            <div class="message-content">
                <img src="${imageUrl}" 
                     alt="Изображение" 
                     class="message-image"
                     onclick="openImageModal('${imageUrl}', ${imageIndex})"
                     loading="lazy"
                     onload="loadImageWithNaturalSize(this, '${imageUrl}')"
                     onerror="this.onerror=null; this.src='${imageUrl}'; this.style.opacity='0.5'; this.style.maxWidth='100%'; this.style.height='auto';"
                     style="opacity: 0; max-width: 100%; height: auto;">
            </div>
        `;
        
        // Добавляем класс для сообщений с изображениями
        messageElement.classList.add('message-with-image');
        
    } else {
        messageContent = `
            <div class="message-content">${escapeHtml(message.content)}</div>
        `;
    }
    
    messageElement.innerHTML = `
        ${messageContent}
        <div class="message-time">
            ${messageTime}
            ${message.is_me ? statusIcons : ''}
        </div>
    `;
    
    setTimeout(() => {
        messageElement.style.opacity = '1';
        messageElement.style.transform = 'translateY(0)';
    }, 10);
    
    messagesContainer.appendChild(messageElement);
}

function loadImageWithNaturalSize(imgElement, imageUrl) {
    // Убираем кэширование размеров, чтобы изображение всегда отображалось в оригинальном размере (пропорционально масштабированном, если выходит за границы)
    // и не укорачивалось после перезагрузки страницы.
    
    const tempImg = new Image();
    tempImg.onload = function() {
        // После загрузки устанавливаем стиль: max-width 100% для предотвращения выхода за границы контейнера,
        // height auto для сохранения пропорций. Это работает для всех изображений без фиксированных размеров.
        const style = 'max-width: 100%; height: auto;';
        applyImageStyles(imgElement, style);
    };
    
    tempImg.onerror = function() {
        // При ошибке используем тот же стиль для консистентности
        const style = 'max-width: 100%; height: auto;';
        applyImageStyles(imgElement, style);
    };
    tempImg.src = imageUrl;
}


function calculateImageStyle(width, height) {
    // Устанавливаем универсальный стиль: максимальная ширина 100% (чтобы не выходить за границы контейнера),
    // высота авто (сохраняет пропорции). Это работает для всех изображений.
    return 'max-width: 100%; height: auto;';
}

function applyImageStyles(imgElement, style) {
    // Применяем стиль напрямую, без фиксированных размеров
    imgElement.style.cssText += style;
    imgElement.style.opacity = '1';
}


function isImageUrl(url) {
    if (typeof url !== 'string') return false;
    
    const imageExtensions = ['.jpg', '.jpeg', '.png', '.gif', '.bmp', '.webp'];
    const imagePatterns = [
        'res.cloudinary.com',
        'cloudinary.com',
        '/upload/',
        'data:image/'
    ];
    
    const lowerUrl = url.toLowerCase();
    
    // Проверяем расширения файлов
    if (imageExtensions.some(ext => lowerUrl.includes(ext))) {
        return true;
    }
    
    // Проверяем паттерны Cloudinary и data URLs
    if (imagePatterns.some(pattern => lowerUrl.includes(pattern))) {
        return true;
    }
    
    return false;
}

// Функция для экранирования HTML (безопасность)
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function openImageModal(imageUrl, messageIndex = 0) {
    // Находим все изображения в текущем чате для навигации
    const imageMessages = currentMessages.filter(msg => msg.is_image || (msg.content && isImageUrl(msg.content)));
    const currentIndex = messageIndex;
    const totalImages = imageMessages.length;

    // Создаем модальное окно для просмотра изображения
    const modal = document.createElement('div');
    modal.className = 'image-modal-overlay';
    
    // Переменные для управления зумом
    let scale = 1;
    let isDragging = false;
    let startX, startY, translateX = 0, translateY = 0;
    let lastTouchDistance = null;

    // Шапка модального окна
    const header = document.createElement('div');
    header.style.cssText = `
        display: flex;
        align-items: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        z-index: 10001;
        position: relative;
    `;

    // Кнопка назад
    const backButton = document.createElement('button');
    backButton.innerHTML = '←';
    backButton.style.cssText = `
        background: none;
        border: none;
        color: white;
        font-size: 20px;
        margin-right: 16px;
        cursor: pointer;
        padding: 8px;
    `;

    // Заголовок с навигацией
    const title = document.createElement('div');
    title.style.cssText = `
        flex: 1;
        font-size: 17px;
        font-weight: 500;
    `;
    title.textContent = `${currentIndex + 1} из ${totalImages}`;

    // Кнопка сброса зума
    const resetZoomButton = document.createElement('button');
    resetZoomButton.innerHTML = '↺';
    resetZoomButton.style.cssText = `
        background: none;
        border: none;
        color: white;
        font-size: 20px;
        cursor: pointer;
        padding: 8px;
        margin-left: 8px;
        opacity: 0.7;
        transition: opacity 0.2s ease;
    `;
    resetZoomButton.title = 'Сбросить масштаб';

    resetZoomButton.addEventListener('mouseenter', () => {
        resetZoomButton.style.opacity = '1';
    });
    
    resetZoomButton.addEventListener('mouseleave', () => {
        resetZoomButton.style.opacity = '0.7';
    });

    header.appendChild(backButton);
    header.appendChild(title);
    header.appendChild(resetZoomButton);

    // Контейнер для изображения
    const imageContainer = document.createElement('div');
    imageContainer.className = 'image-modal-content';

    const img = document.createElement('img');
    img.src = imageUrl;
    img.className = 'zoomable-image';
    img.draggable = false; // Отключаем стандартный drag

    // Индикатор зума
    const zoomIndicator = document.createElement('div');
    zoomIndicator.className = 'zoom-indicator';
    zoomIndicator.textContent = `${Math.round(scale * 100)}%`;

    // Элементы управления зумом
    const zoomControls = document.createElement('div');
    zoomControls.className = 'zoom-controls';

    const zoomInButton = document.createElement('button');
    zoomInButton.className = 'zoom-control';
    zoomInButton.innerHTML = '+';
    zoomInButton.title = 'Увеличить';

    const zoomOutButton = document.createElement('button');
    zoomOutButton.className = 'zoom-control';
    zoomOutButton.innerHTML = '−';
    zoomOutButton.title = 'Уменьшить';

    zoomControls.appendChild(zoomInButton);
    zoomControls.appendChild(zoomOutButton);

    // Кнопки навигации
    const prevButton = document.createElement('button');
    prevButton.innerHTML = '←';
    prevButton.style.cssText = `
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        display: ${currentIndex > 0 ? 'flex' : 'none'};
        align-items: center;
        justify-content: center;
        font-size: 20px;
        backdrop-filter: blur(10px);
        transition: background 0.2s ease;
        z-index: 10001;
    `;

    const nextButton = document.createElement('button');
    nextButton.innerHTML = '→';
    nextButton.style.cssText = `
        position: absolute;
        right: 80px; /* Сдвигаем чтобы не перекрывать кнопки зума */
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        display: ${currentIndex < totalImages - 1 ? 'flex' : 'none'};
        align-items: center;
        justify-content: center;
        font-size: 20px;
        backdrop-filter: blur(10px);
        transition: background 0.2s ease;
        z-index: 10001;
    `;

    // Футер с информацией
    const footer = document.createElement('div');
    footer.style.cssText = `
        padding: 16px;
        background: rgba(0, 0, 0, 0.8);
        color: rgba(255, 255, 255, 0.7);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        font-size: 14px;
    `;

    // Получаем информацию о текущем сообщении
    const currentMessage = imageMessages[currentIndex];
    if (currentMessage) {
        const time = formatChatMessageTime(currentMessage.sent_at);
        footer.textContent = `${time}`;
    }

    // Функции для управления зумом
    function updateTransform() {
        img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        zoomIndicator.textContent = `${Math.round(scale * 100)}%`;
        
        // Показываем индикатор при зуме
        if (scale > 1) {
            zoomIndicator.classList.add('show');
            resetZoomButton.style.display = 'block';
        } else {
            zoomIndicator.classList.remove('show');
            resetZoomButton.style.display = 'none';
        }
    }

    function zoomIn() {
        scale = Math.min(scale * 1.5, 5);
        updateTransform();
        showTemporarily(zoomIndicator);
    }

    function zoomOut() {
        scale = Math.max(scale / 1.5, 1);
        if (scale === 1) {
            translateX = 0;
            translateY = 0;
        }
        updateTransform();
        showTemporarily(zoomIndicator);
    }

    function resetZoom() {
        scale = 1;
        translateX = 0;
        translateY = 0;
        updateTransform();
    }

    function showTemporarily(element) {
        element.classList.add('show');
        clearTimeout(element.hideTimeout);
        element.hideTimeout = setTimeout(() => {
            element.classList.remove('show');
        }, 1000);
    }

    // Обработчики для кнопок зума
    zoomInButton.addEventListener('click', zoomIn);
    zoomOutButton.addEventListener('click', zoomOut);
    resetZoomButton.addEventListener('click', resetZoom);

    // Обработчики для колесика мыши
    imageContainer.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.deltaY < 0) {
            zoomIn();
        } else {
            zoomOut();
        }
    });

    // Обработчики для drag (перетаскивания)
    imageContainer.addEventListener('mousedown', (e) => {
        if (scale <= 1) return;
        
        isDragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
        img.style.cursor = 'grabbing';
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDragging || scale <= 1) return;
        
        e.preventDefault();
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        updateTransform();
    });

    document.addEventListener('mouseup', () => {
        isDragging = false;
        img.style.cursor = scale > 1 ? 'grab' : 'default';
    });

    // Обработчики для мультитач (зум пальцами)
    imageContainer.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            e.preventDefault();
            const touch1 = e.touches[0];
            const touch2 = e.touches[1];
            lastTouchDistance = Math.hypot(
                touch2.clientX - touch1.clientX,
                touch2.clientY - touch1.clientY
            );
        } else if (e.touches.length === 1 && scale > 1) {
            const touch = e.touches[0];
            startX = touch.clientX - translateX;
            startY = touch.clientY - translateY;
        }
    });

    imageContainer.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
            e.preventDefault();
            const touch1 = e.touches[0];
            const touch2 = e.touches[1];
            const currentDistance = Math.hypot(
                touch2.clientX - touch1.clientX,
                touch2.clientY - touch1.clientY
            );

            if (lastTouchDistance !== null) {
                const scaleChange = currentDistance / lastTouchDistance;
                scale = Math.max(1, Math.min(scale * scaleChange, 5));
                updateTransform();
                showTemporarily(zoomIndicator);
            }
            
            lastTouchDistance = currentDistance;
        } else if (e.touches.length === 1 && scale > 1) {
            e.preventDefault();
            const touch = e.touches[0];
            translateX = touch.clientX - startX;
            translateY = touch.clientY - startY;
            updateTransform();
        }
    });

    imageContainer.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
            lastTouchDistance = null;
        }
    });

    // Двойной клик для сброса зума
    img.addEventListener('dblclick', resetZoom);

    // Добавляем элементы в контейнеры
    imageContainer.appendChild(img);
    imageContainer.appendChild(zoomIndicator);
    imageContainer.appendChild(zoomControls);
    imageContainer.appendChild(prevButton);
    imageContainer.appendChild(nextButton);
    
    modal.appendChild(header);
    modal.appendChild(imageContainer);
    modal.appendChild(footer);
    document.body.appendChild(modal);

    let currentImageIndex = currentIndex;

    function updateNavigation(newIndex) {
        const newMessage = imageMessages[newIndex];
        if (newMessage) {
            title.textContent = `${newIndex + 1} из ${totalImages}`;
            img.src = newMessage.content;
            
            // Сбрасываем зум при смене изображения
            resetZoom();
            
            const time = formatChatMessageTime(newMessage.sent_at);
            footer.textContent = `${time}`;
            
            prevButton.style.display = newIndex > 0 ? 'flex' : 'none';
            nextButton.style.display = newIndex < totalImages - 1 ? 'flex' : 'none';
            
            return newIndex;
        }
        return currentIndex;
    }

    backButton.addEventListener('click', (e) => {
        e.stopPropagation();
        document.body.removeChild(modal);
    });

    prevButton.addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentImageIndex > 0) {
            currentImageIndex = updateNavigation(currentImageIndex - 1);
        }
    });

    nextButton.addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentImageIndex < totalImages - 1) {
            currentImageIndex = updateNavigation(currentImageIndex + 1);
        }
    });

    // Свайпы для навигации
    imageContainer.addEventListener('touchstart', handleTouchStart);
    
    let touchStartX = 0;
    
    function handleTouchStart(e) {
        if (e.touches.length === 1) {
            touchStartX = e.touches[0].clientX;
        }
    }
    
    imageContainer.addEventListener('touchend', function touchEnd(e) {
        if (scale > 1) return; // Не навигируем если увеличен
        
        const endX = e.changedTouches[0].clientX;
        const diffX = touchStartX - endX;

        if (Math.abs(diffX) > 50) {
            if (diffX > 0 && currentImageIndex < totalImages - 1) {
                currentImageIndex = updateNavigation(currentImageIndex + 1);
            } else if (diffX < 0 && currentImageIndex > 0) {
                currentImageIndex = updateNavigation(currentImageIndex - 1);
            }
        }
    });

    modal.addEventListener('click', (e) => {
        if (e.target === modal && scale === 1) {
            document.body.removeChild(modal);
        }
    });

    document.addEventListener('keydown', function handleKeydown(e) {
        if (e.key === 'Escape') {
            document.body.removeChild(modal);
            document.removeEventListener('keydown', handleKeydown);
        } else if (e.key === 'ArrowLeft' && currentImageIndex > 0) {
            currentImageIndex = updateNavigation(currentImageIndex - 1);
        } else if (e.key === 'ArrowRight' && currentImageIndex < totalImages - 1) {
            currentImageIndex = updateNavigation(currentImageIndex + 1);
        } else if (e.key === '0' || e.key === 'Numpad0') {
            resetZoom();
        } else if (e.key === '+' || e.key === '=') {
            zoomIn();
        } else if (e.key === '-') {
            zoomOut();
        }
    });

    // Инициализация
    resetZoomButton.style.display = 'none';
    updateTransform();
}

async function loadChats(forceReload = false) {
    // Эта функция теперь вызывается ТОЛЬКО при:
    // 1. Первоначальной загрузке страницы (forceReload = false)
    // 2. Явном требовании перезагрузить все чаты (forceReload = true)
    
    if (forceReload) {
        // Полная перезагрузка только если явно запрошено
        await performFullChatsReload();
    } else {
        // При обычном вызове - интеллектуальное обновление
        await performSmartChatsUpdate();
    }
}

async function performFullChatsReload() {
    // Полная перезагрузка всех чатов (редкий случай)
    const { chatsList, noChats } = getActiveElements();
    
    try {
        const response = await fetch(`${SERVER_URL}/get_chats`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({platform_user_id: userData.platform_user_id}),
            credentials: 'include'
        });
        
        const data = await response.json();
        
        if (data.status === 'success') {
            const sortedChats = sortChats(data.chats);
            currentChatsList = sortedChats;
            const chatsJson = JSON.stringify(sortedChats);
            if (chatsJson !== lastRenderedChatsJson) {
                renderChats(sortedChats);
                lastRenderedChatsJson = chatsJson;
            }
            saveChatsLocal(sortedChats);
        } else {
            currentChatsList = [];
            renderChats([]);
        }
    } catch (error) {
        console.error('Error loading chats:', error);
        currentChatsList = [];
        renderChats([]);
    }
}


let lastRenderedChatsJson = '';

async function performSmartChatsUpdate() {
    // 1. Сначала пробуем загрузить из локальной базы
    const localChats = await getChatsLocal();
    if (localChats && localChats.length > 0) {
        console.log('Loaded chats from local storage');
        currentChatsList = sortChats(localChats);
        const chatsJson = JSON.stringify(currentChatsList);
        if (chatsJson !== lastRenderedChatsJson) {
            renderChats(currentChatsList);
            lastRenderedChatsJson = chatsJson;
        }
    }
    
    // 2. Запрашиваем свежие данные с сервера
    await performFullChatsReload();
}

function sortChats(chats) {
    return [...chats].sort((a, b) => {
        const timeA = new Date(a.last_message_time || 0).getTime();
        const timeB = new Date(b.last_message_time || 0).getTime();
        return timeB - timeA;
    });
}

// Найдите функцию renderChats и внутри неё измените строку с last_message
async function renderChats(chats) {
    const { chatsList, noChats } = getActiveElements();
    chatsList.innerHTML = '';

    if (!chats || chats.length === 0) {
        noChats.style.display = 'block';
        return;
    }
    
    noChats.style.display = 'none';
    
    // Получаем статусы активности для всех пользователей в чатах
    const userIds = [];
    chats.forEach(chat => {
        if (chat.participants && chat.participants.length > 0) {
            chat.participants.forEach(participant => {
                if (participant.platform_user_id !== userData.platform_user_id) {
                    userIds.push(participant.platform_user_id);
                }
            });
        }
    });
    
    const activityData = await getUsersActivityStatus(userIds);
    
    chats.forEach(chat => {
        const chatItem = document.createElement('div');
        chatItem.className = 'chat-item';
        chatItem.setAttribute('data-chat-id', chat.id);
        
        const initials = chat.name 
            ? chat.name.split(' ').map(n => n[0]).join('') 
            : '?';
        
        const bgColor = chat.avatar_background || getRandomColor();

        // Находим участника чата (исключая текущего пользователя)
        const otherParticipant = chat.participants?.find(p => p.platform_user_id !== userData.platform_user_id);
        
        // Статус по умолчанию
        let statusText = 'был(а) недавно';
        let isOnline = false;

        if (otherParticipant) {
            const userActivity = activityData[otherParticipant.platform_user_id];
            if (userActivity) {
                if (userActivity.is_online) {
                    statusText = 'В сети';
                    isOnline = true;
                } else {
                    statusText = formatLastSeen(userActivity.last_online);
                    isOnline = false;
                }
            } else {
                // Если данных о активности нет, считаем что пользователь не в сети
                statusText = 'был(а) недавно';
                isOnline = false;

function formatLastSeen(lastOnline) {
    if (!lastOnline) return 'в сети';
    
    const now = new Date();
    const lastSeen = new Date(lastOnline);
    const diffMs = now - lastSeen;
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);

    if (diffMins < 1) {
        return 'только что';
    } else if (diffMins < 60) {
        return `был(а) ${diffMins} ${getRussianNoun(diffMins, ['минуту', 'минуты', 'минут'])} назад`;
    } else if (diffHours < 10) {
        return `был(а) ${diffHours} ${getRussianNoun(diffHours, ['час', 'часа', 'часов'])} назад`;
    } else if (diffHours < 24) {
        return `был(а) в ${lastSeen.getHours().toString().padStart(2, '0')}:${lastSeen.getMinutes().toString().padStart(2, '0')}`;
    } else if (diffDays < 2) {
        return `был(а) вчера в ${lastSeen.getHours().toString().padStart(2, '0')}:${lastSeen.getMinutes().toString().padStart(2, '0')}`;
    } else {
        return `был(а) ${lastSeen.getDate().toString().padStart(2, '0')}.${(lastSeen.getMonth() + 1).toString().padStart(2, '0')}.${lastSeen.getFullYear()}`;
    }
}

function getRussianNoun(number, forms) {
    number = Math.abs(number) % 100;
    const n1 = number % 10;
    
    if (number > 10 && number < 20) return forms[2];
    if (n1 > 1 && n1 < 5) return forms[1];
    if (n1 === 1) return forms[0];
    return forms[2];
}

async function createChatWithContact(contact) {
    if (isOpeningChat) return;
    isOpeningChat = true;
    
    try {
        const response = await fetch(`${SERVER_URL}/get_or_create_chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                platform_user_id: userData.platform_user_id,
                contact_id: contact.platform_user_id
            }),
            credentials: 'include'
        });

        const data = await response.json();
        
        if (data.status !== 'success') {
            // Только для критических ошибок показываем сообщение
            throw new Error(data.error || 'Не удалось проверить чат');
        }

        // Сразу скрываем модальное окно контактов
        hideContactsModal();
        
        // Небольшая задержка для плавности анимации
        setTimeout(async () => {
            if (!data.is_new) {
                // ЧАТ УЖЕ СУЩЕСТВУЕТ - открываем его
                await openChat(data.chat_id);
            } else {
                // СОЗДАЕМ НОВЫЙ ВРЕМЕННЫЙ ЧАТ
                const tempChat = {
                    id: `temp_${Date.now()}`,
                    is_group: false,
                    name: contact.nickname || 'Без имени',
                    participants: [contact],
                    has_avatar_photo: contact.has_avatar_photo,
                    avatar_background: contact.avatar_background || '#0088cc',
                    is_temp: true,
                    // Добавляем информацию для реального создания чата позже
                    real_contact_id: contact.platform_user_id
                };
                
                // Добавляем временный чат в начало списка
                currentChatsList.unshift(tempChat);
                
                // Обновляем DOM - добавляем новый чат в список
                updateChatItemInDOM(tempChat.id, tempChat);
                
                // ОТКРЫВАЕМ ВРЕМЕННЫЙ ЧАТ
                openTempChat(tempChat);
            }
        }, 100); // Уменьшаем задержку до 100ms
        
    } catch (error) {
        // Показываем ошибку только если это не отмена
        if (error.name !== 'AbortError') {
            console.error('Error opening chat:', error);
            // Можно показать более дружелюбное сообщение
            showMessage('Не удалось открыть чат. Попробуйте снова.', 'error');
        }
    } finally {
        isOpeningChat = false;
    }
}

function openTempChat(tempChat) {
    if (!tempChat || !tempChat.id) {
        console.error('Invalid tempChat object:', tempChat);
        return;
    }
    
    const { 
        chatModal, 
        chatAvatar, 
        chatTitle, 
        chatStatus, 
        messagesContainer, 
        noMessages 
    } = getActiveElements();
    
    if (!chatModal) {
        console.error('Chat modal not found');
        return;
    }
    
    // 0. Обновляем заголовок из кэша списка чатов (если есть)
    const cachedChat = currentChatsList.find(c => c.id === tempChat.id);
    if (cachedChat) {
        chatTitle.textContent = cachedChat.name || 'Новый чат';
        const initials = cachedChat.name ? cachedChat.name[0].toUpperCase() : '?';
        const bgColor = cachedChat.avatar_background || '#0088cc';
        chatAvatar.style.background = `linear-gradient(135deg, ${bgColor}, ${adjustColor(bgColor, 20)})`;
        chatAvatar.textContent = initials;
    } else {
        // Если нет в кэше, используем данные из tempChat
        chatTitle.textContent = tempChat.name || 'Новый чат';
    }
    
    currentChat = tempChat;
    
    // Apply changing class for animation
    if (chatModal.classList.contains('changing')) {
        setTimeout(() => {
            chatModal.classList.remove('changing');
        }, 300);
    }

    // Устанавливаем значения
    if (chatTitle) chatTitle.textContent = tempChat.name || 'Новый чат';
    if (chatStatus) chatStatus.textContent = 'был(а) недавно';
    
    // Настраиваем аватар
    if (chatAvatar) {
        const initials = tempChat.initials || (tempChat.name ? tempChat.name[0].toUpperCase() : '?');
        const bgColor = tempChat.avatar_background || '#0088cc';
        
        // Сначала показываем инициалы и фон
        chatAvatar.style.background = `linear-gradient(135deg, ${bgColor}, ${adjustColor(bgColor, 20)})`;
        chatAvatar.style.backgroundImage = '';
        chatAvatar.textContent = initials;
        
        // Пытаемся загрузить аватар если есть фото
        if (tempChat.has_avatar_photo && tempChat.participants && tempChat.participants.length > 0) {
            const userId = tempChat.participants[0].platform_user_id;
            const avatarUrl = `${SERVER_URL}/avatar/${userId}?t=${Date.now()}`;
            const img = new Image();
            
            img.onload = function() {
                chatAvatar.style.backgroundImage = `url(${avatarUrl})`;
                chatAvatar.style.backgroundSize = 'cover';
                chatAvatar.style.backgroundPosition = 'center';
                chatAvatar.textContent = '';
            };
            
            img.onerror = function() {
                // Если не загрузилось, оставляем инициалы
                chatAvatar.style.backgroundImage = '';
                chatAvatar.textContent = initials;
                chatAvatar.style.background = `linear-gradient(135deg, ${bgColor}, ${adjustColor(bgColor, 20)})`;
            };
            
            img.src = avatarUrl;
        }
    }
    
    // Очищаем сообщения и показываем приветствие
    if (messagesContainer) {
        messagesContainer.innerHTML = '';
    }
    
    if (noMessages) {
        noMessages.style.display = 'block';
        noMessages.textContent = 'Напишите сообщение, чтобы начать чат';
    }
    
    // Сбрасываем текущие сообщения
    currentMessages = [];
    
    // Открываем чат в зависимости от платформы
    if (isDesktop) {
        if (desktopPlaceholder) {
            desktopPlaceholder.style.display = 'none';
        }
        if (chatModal) {
            chatModal.style.display = 'flex';
        }
    } else {
        if (chatModal) {
            chatModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
    }
}


async function sendMessage() {
    const { messageInput, sendMessageButton, messagesContainer, noMessages } = getActiveElements();
    const content = messageInput.value.trim();
    
    if (!content || !currentChat) return;
    
    sendMessageButton.disabled = true;
    isSendingMessage = true;
    
    try {
        // Сохраняем контент перед очисткой
        const messageContent = content;
        messageInput.value = '';
        
        // Если это временный чат, сначала создаем его
        if (currentChat.is_temp) {
            const response = await fetch(`${SERVER_URL}/create_chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    platform_user_id: userData.platform_user_id,
                    contact_id: currentChat.participants[0].platform_user_id
                }),
                credentials: 'include'
            });
            
            const data = await response.json();
            
            if (data.status !== 'success') {
                throw new Error(data.error || 'Не удалось создать чат');
            }
            
            // Обновляем текущий чат
            currentChat.id = data.chat_id;
            currentChat.is_temp = false;
            
            // ВМЕСТО loadChats() - добавляем новый чат в список
            const newChat = {
                id: data.chat_id,
                name: currentChat.name,
                last_message: messageContent,
                last_message_time: new Date().toISOString(),
                unread_count: 0,
                participants: currentChat.participants,
                has_avatar_photo: currentChat.has_avatar_photo,
                avatar_background: currentChat.avatar_background
            };
            
            // Добавляем в начало списка чатов
            currentChatsList.unshift(newChat);
            // Обновляем DOM только для этого чата
            updateChatItemInDOM(data.chat_id, newChat);
        }
        
        // Отправляем сообщение
        const messageResponse = await fetch(`${SERVER_URL}/send_message`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: currentChat.id,
                sender_id: userData.platform_user_id,
                content: messageContent
            }),
            credentials: 'include'
        });
        
        const messageData = await messageResponse.json();
        
        if (messageData.status !== 'success') {
            throw new Error(messageData.error || 'Не удалось отправить сообщение');
        }
        
        // Создаем новое сообщение для UI
        const newMessage = {
            id: messageData.message_id,
            sender_id: userData.platform_user_id,
            content: messageContent,
            sent_at: new Date().toISOString(),
            is_read: false,
            sender_name: userData.nickname,
            sender_avatar: userData.avatar_url,
            sender_avatar_background: userData.avatar_background,
            is_me: true
        };
        
        // Добавляем сообщение в текущий список
        currentMessages = [...currentMessages, newMessage];
        
        // Обновляем UI
        noMessages.style.display = 'none';
        renderMessages(currentMessages);
        
        // Прокручиваем к последнему сообщению
        setTimeout(() => {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }, 50);
        
        // Обновляем информацию о чате в списке (только для существующих чатов)
        if (!currentChat.is_temp) {
            updateChatItemInDOM(currentChat.id, {
                last_message: messageContent,
                last_message_time: newMessage.sent_at,
                unread_count: 0
            });
            
            // Обновляем данные в кэше чатов
            const chatIndex = currentChatsList.findIndex(chat => chat.id === currentChat.id);
            if (chatIndex !== -1) {
                currentChatsList[chatIndex].last_message = messageContent;
                currentChatsList[chatIndex].last_message_time = newMessage.sent_at;
                currentChatsList[chatIndex].unread_count = 0;
                
                // Перемещаем чат в начало списка
                const updatedChat = currentChatsList.splice(chatIndex, 1)[0];
                currentChatsList.unshift(updatedChat);
                moveChatToTop(currentChat.id);
            }
        }
        
        // Фокусируемся на поле ввода после успешной отправки
        setTimeout(() => {
            messageInput.focus();
            isSendingMessage = false;
        }, 100);
        
    } catch (error) {
        console.error('Error sending message:', error);
        showMessage('Ошибка отправки сообщения: ' + error.message, 'error');
        
        // Восстанавливаем текст в поле ввода при ошибке
        messageInput.value = content;
        isSendingMessage = false;
        
        // Показываем "нет сообщений" если сообщений действительно нет
        if (currentMessages.length === 0) {
            noMessages.style.display = 'block';
        }
    } finally {
        sendMessageButton.disabled = false;
    }
}

    }

    // Обработка открытия клавиатуры
    messageInput.addEventListener('focus', () => {
        if (isSendingMessage) return; // Игнорируем при отправке
        keyboardShown = true;
        setTimeout(() => {
            adjustInputPosition(true);
        }, 100);
    });

    // Обработка закрытия клавиатуры
    messageInput.addEventListener('blur', () => {
        if (isSendingMessage) return; // Игнорируем при отправке
        keyboardShown = false;
        adjustInputPosition(false);
    });
}



       
async function openChat(chatId) {
    // Отменяем предыдущий запрос, если он есть
    if (openChatAbortController) {
        openChatAbortController.abort();
    }
    openChatAbortController = new AbortController();
    const signal = openChatAbortController.signal;

    isOpeningChat = true;

    const { chatModal, chatAvatar, chatTitle, chatStatus, messagesContainer, noMessages } = getActiveElements();
    
    // 0. Обновляем заголовок из кэша списка чатов (если есть) - МОМЕНТАЛЬНО
    const cachedChat = currentChatsList.find(c => c.id === chatId);
    if (cachedChat) {
        chatTitle.textContent = cachedChat.name || 'Новый чат';
        const initials = cachedChat.name ? cachedChat.name.split(' ').map(n => n[0]).join('') : '?';
        const bgColor = cachedChat.avatar_background || '#0088cc';
        
        const otherParticipant = cachedChat.participants?.find(p => p.platform_user_id !== userData.platform_user_id);
        if (otherParticipant) {
            const avatarUrl = `${SERVER_URL}/avatar/${otherParticipant.platform_user_id}`;
            // Мгновенно устанавливаем фон
            chatAvatar.style.background = `url(${avatarUrl}) center/cover no-repeat, linear-gradient(135deg, ${bgColor}, ${adjustColor(bgColor, 20)})`;
            chatAvatar.textContent = '';
            
            // Также мгновенно обновляем статус из кэша, если он там есть
            const statusElement = document.querySelector(`[data-chat-id="${chatId}"] .chat-status`);
            if (statusElement) {
                chatStatus.innerHTML = statusElement.innerHTML;
                chatStatus.className = statusElement.className;
            }
        } else {
            chatAvatar.style.background = `linear-gradient(135deg, ${bgColor}, ${adjustColor(bgColor, 20)})`;
            chatAvatar.textContent = initials;
        }
    }

    try {
        // 1. Сначала пробуем загрузить сообщения из локальной базы
        const localMessages = await getMessagesLocal(chatId);
        let hasLocalMessages = false;
        if (localMessages && localMessages.length > 0) {
            console.log('Loaded messages from local storage');
            currentMessages = localMessages;
            renderMessages(currentMessages);
            noMessages.style.display = 'none';
            hasLocalMessages = true;
            
            // Показываем чат сразу
            if (isDesktop) {
                desktopPlaceholder.style.display = 'none';
                chatModal.style.display = 'flex';
            } else {
                chatModal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            // Прокручиваем вниз сразу
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 10);
        } else {
            messagesContainer.innerHTML = '';
            noMessages.style.display = 'block';
            noMessages.textContent = 'Загрузка...';
        }

        // Загружаем данные чата и сообщения параллельно
        const [chatResponse, messagesResponse] = await Promise.all([
            fetch(`${SERVER_URL}/get_chat_info`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    platform_user_id: userData.platform_user_id
                }),
                credentials: 'include',
                signal: signal
            }).catch(error => {
                if (error.name === 'AbortError') throw error;
                return { status: 'error' };
            }),
            
            fetch(`${SERVER_URL}/get_messages`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    platform_user_id: userData.platform_user_id
                }),
                credentials: 'include',
                signal: signal
            }).catch(error => {
                if (error.name === 'AbortError') throw error;
                return { status: 'error' };
            })
        ]);

        // Проверяем, не был ли запрос отменен
        if (signal.aborted) {
            return;
        }

        const chatData = await chatResponse.json();
        const messagesData = await messagesResponse.json();
        
        // Обработка данных чата
        if (chatData.status === 'success') {
            currentChat = chatData.chat;
            chatTitle.textContent = currentChat.name || 'Новый чат';
            
            // Обновляем статус
            const otherParticipant = currentChat.participants?.find(p => p.platform_user_id !== userData.platform_user_id);
            if (otherParticipant) {
                const activityData = await getUsersActivityStatus([otherParticipant.platform_user_id]);
                const userActivity = activityData[otherParticipant.platform_user_id];
                
                if (userActivity) {
                    chatStatus.textContent = userActivity.is_online ? 'В сети' : formatLastSeen(userActivity.last_online);
                    chatStatus.classList.toggle('online', userActivity.is_online);
                }
            }
        }

        // Обработка сообщений
        if (messagesData.status === 'success') {
            const serverMessages = messagesData.messages;
            
            // Сравниваем с локальными, чтобы избежать лишней перерисовки
            const messagesChanged = JSON.stringify(serverMessages) !== JSON.stringify(currentMessages);
            
            if (messagesChanged || !hasLocalMessages) {
                currentMessages = serverMessages;
                renderMessages(currentMessages);
                saveMessagesLocal(chatId, currentMessages);
            }
            
            markAllMessagesAsRead(chatId);
        
            if (currentMessages.length === 0) {
                noMessages.style.display = 'block';
                noMessages.textContent = 'Сообщений пока нет...';
            } else {
                noMessages.style.display = 'none';
            }
        } else if (!hasLocalMessages) {
            currentMessages = [];
            noMessages.style.display = 'block';
            noMessages.textContent = 'Сообщений пока нет...';
        }
        
        if (!chatModal.classList.contains('active') && chatModal.style.display !== 'flex') {
            if (isDesktop) {
                desktopPlaceholder.style.display = 'none';
                chatModal.style.display = 'flex';
            } else {
                chatModal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        }
        
        if (currentMessages.length > 0) {
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 100);
        }

        // Сбрасываем счетчик непрочитанных
        updateChatItemInDOM(chatId, {
            unread_count: 0
        });

        // Обновляем кэш чатов - только счетчик непрочитанных
        const chatIndex = currentChatsList.findIndex(chat => chat.id === chatId);
        if (chatIndex !== -1) {
            currentChatsList[chatIndex].unread_count = 0;
            // НЕ изменяем last_message и last_message_time - чат остается на своем месте
            // НЕ перемещаем чат в начало списка
        }
        
    } catch (error) {
        // ИГНОРИРУЕМ ошибки отмены запросов - это нормальное поведение
        if (error.name === 'AbortError') {
            console.log('Запрос отменен (нормальное поведение при быстром переключении)');
            return;
        }
        
        // Для других ошибок показываем сообщение, но не для пользователя
        console.error('Ошибка загрузки чата:', error);
        
        // НЕ показываем красное сообщение пользователю при обычном переключении
        // showMessage('Ошибка загрузки чата', 'error');
        
        // Вместо этого просто закрываем чат и показываем placeholder
        closeChat();
        
        if (isDesktop) {
            desktopPlaceholder.style.display = 'flex';
        }
    } finally {
        // Всегда снимаем блокировку
        isOpeningChat = false;
    }

    window.addEventListener('resize', () => {
        if (!isDesktop && currentChat) {
            setupMobileChatHeight();
        }
    });
    

    updateChatWallpaper();
    applyWallpaper();


    window.currentChat = chatData;
}


function closeChat() {
    console.log('closeChat() called'); // Логирование для отладки

    const { chatModal, chatAvatar, chatTitle, chatStatus, messagesContainer, noMessages } = getActiveElements();

    // Проверка на наличие элементов (добавлено для надежности)
    if (!chatModal || !messagesContainer) {
        console.error('closeChat(): Required elements not found');
        return;
    }

    // Reset chat state
    currentChat = null;
    currentMessages = [];

    updateChatWallpaper();
    applyWallpaper();

    // Clear UI
    messagesContainer.innerHTML = '';
    noMessages.style.display = 'block';

    chatStatus.textContent = '';
    chatAvatar.style.backgroundImage = '';

    console.log('Chat closed successfully'); // Логирование для подтверждения
}

function moveChatToTop(chatId) {
    [chatsListDesktop, chatsListMobile].forEach(list => {
        if (!list) return;
        
        const chatItem = list.querySelector(`.chat-item[data-chat-id="${chatId}"]`);
        if (chatItem) {
            list.prepend(chatItem);
        }
    });
}


function updateChatItemInDOM(chatId, chatData) {
    [chatsListDesktop, chatsListMobile].forEach(list => {
        if (!list) return;
        
        const chatItem = list.querySelector(`.chat-item[data-chat-id="${chatId}"]`);
        if (chatItem) {
            const lastMessageEl = chatItem.querySelector('.last-message');
            const chatTimeEl = chatItem.querySelector('.chat-time');
            
            if (lastMessageEl && chatData.last_message) {
                // ИЗМЕНЕНИЕ: Проверяем, является ли сообщение изображением
                let lastMessageText = chatData.last_message;
                if (isImageUrl(lastMessageText) || chatData.last_message_type === 'image') {
                    lastMessageText = '📷 Фото';
                }
                lastMessageEl.textContent = lastMessageText;
            }
            
            if (chatTimeEl && chatData.last_message_time) {
                chatTimeEl.textContent = formatChatListTime(chatData.last_message_time);
            }
            
            if (chatData.unread_count > 0) {
                let badge = chatItem.querySelector('.unread-badge');
                if (!badge) {
                    badge = document.createElement('div');
                    badge.className = 'unread-badge';
                    chatItem.appendChild(badge);
                }
                badge.textContent = chatData.unread_count;
            } else {
                const badge = chatItem.querySelector('.unread-badge');
                if (badge) {
                    badge.remove();
                }
            }
            
            // УБРАНО: list.prepend(chatItem);
            // Чат НЕ перемещается автоматически вверх при обновлении
            // Перемещение будет происходить только при явном вызове moveChatToTop()
        }
    });
}


function renderMessages(messages) {
    const { messagesContainer, noMessages } = getActiveElements();
    
 
    messagesContainer.innerHTML = '';
    
    if (!messages || messages.length === 0) {
        noMessages.style.display = 'block';
        noMessages.textContent = 'Сообщений пока нет...';
        return;
    }
    
    noMessages.style.display = 'none';
    
    let lastDateHeader = '';
    messages.forEach((message, index) => {
        const currentDateHeader = formatDateHeader(message.sent_at);
        
        if (currentDateHeader !== lastDateHeader) {
            const dateHeader = document.createElement('div');
            dateHeader.className = 'date-header';
            dateHeader.textContent = currentDateHeader;
            dateHeader.style.textAlign = 'center';
            dateHeader.style.margin = '12px auto'; 
            dateHeader.style.fontSize = '14px';
            dateHeader.style.color = 'white';
            dateHeader.style.backgroundColor = 'rgba(0, 0, 0, 0.2)';
            dateHeader.style.padding = '4px 12px';
            dateHeader.style.borderRadius = '24px'; 
            dateHeader.style.display = 'block'; 
            messagesContainer.appendChild(dateHeader);
            lastDateHeader = currentDateHeader;
        }
        
        renderMessage(message);
    });
    
    setTimeout(() => {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }, 50);
}

async function updateMessageStatus(chatId, messageId) {
    try {
        const response = await fetch(`${SERVER_URL}/mark_as_read`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                chat_id: chatId,

            }),

        });

            updateMessageStatusInUI(messageId);
        }
    } catch (error) {

    }
}

function updateMessageStatusInUI(messageId) {
    const { messagesContainer } = getActiveElements();
    const messageElement = messagesContainer.querySelector(`[data-message-id="${messageId}"]`);
    
    if (messageElement) {
        const statusIcon = messageElement.querySelector('.status-icon');
        if (statusIcon) {
            statusIcon.classList.remove('fa-check', 'sent');
            statusIcon.classList.add('fa-check-double', 'read');
        }
    }
}

async function markAllMessagesAsRead(chatId) {
    try {
        const response = await fetch(`${SERVER_URL}/mark_all_as_read`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                chat_id: chatId,
                reader_id: userData.platform_user_id
            }),
            credentials: 'include'
        });
        
        const data = await response.json();
        
        if (data.status === 'success') {
            // Update the status of all messages in the UI
            currentMessages.forEach(message => {
                if (!message.is_me) { // Only mark incoming messages as read
                    message.is_read = true;
                }
            });
            
            // Update visual display
            updateAllMessageStatusesInUI();
        }
    } catch (error) {
        console.error('Error marking all messages as read:', error);
    }
}

function updateAllMessageStatusesInUI() {
    const { messagesContainer } = getActiveElements();
    const messageElements = messagesContainer.querySelectorAll('.message[data-message-id]');
    
    messageElements.forEach(element => {
        const messageId = element.getAttribute('data-message-id');
        const message = currentMessages.find(m => m.id === messageId);
        
        if (message && message.is_me && message.is_read) {
            const statusIcon = element.querySelector('.status-icon');
            if (statusIcon) {
                statusIcon.classList.remove('fa-check', 'sent');
                statusIcon.classList.add('fa-check-double', 'read');
            }
        }
    });
}


async function updateChatStatuses() {
    if (!currentChatsList || currentChatsList.length === 0) {
        return;
    }

    const userIds = [];
    currentChatsList.forEach(chat => {
        if (chat.participants && chat.participants.length > 0) {
            chat.participants.forEach(participant => {
                if (participant.platform_user_id !== userData.platform_user_id) {
                    userIds.push(participant.platform_user_id);
                }
            });
        }
    });

    if (userIds.length === 0) return;

    try {
        const activityData = await getUsersActivityStatus(userIds);
        currentActivityData = activityData; // Сохраняем данные для использования
        
        [chatsListDesktop, chatsListMobile].forEach(list => {
            if (!list) return;
            
            const chatItems = list.querySelectorAll('.chat-item');
            chatItems.forEach(chatItem => {
                const chatId = chatItem.getAttribute('data-chat-id');
                const chat = currentChatsList.find(c => c.id === chatId);
                
                if (chat && chat.participants) {
                    const otherParticipant = chat.participants.find(p => p.platform_user_id !== userData.platform_user_id);
                    if (otherParticipant) {
                        const userActivity = activityData[otherParticipant.platform_user_id];
                        const statusElement = chatItem.querySelector('.chat-status');
                        
                        if (statusElement) {
                            if (userActivity && userActivity.is_online) {
                                statusElement.innerHTML = '<span class="status-indicator"></span><span class="status-text">В сети</span>';
                                statusElement.classList.add('online');
                            } else {
                                const statusText = userActivity ? formatLastSeen(userActivity.last_online) : 'был(а) недавно';
                                statusElement.innerHTML = statusText;
                                statusElement.classList.remove('online');
                            }
                        }
                    }
                }
            });
        });
    } catch (error) {
        console.error('Error updating chat statuses:', error);
    }
}

    });
    
    document.addEventListener('gestureend', function(e) {
        e.preventDefault();
    });

    

    // Обновление статусов при возвращении на вкладку
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            updateChatStatuses();
            updateUserActivity(true);
            
            if (currentChat) {
                const otherParticipant = currentChat.participants?.find(p => p.platform_user_id !== userData.platform_user_id);
                if (otherParticipant) {
                    getUsersActivityStatus([otherParticipant.platform_user_id]).then(activityData => {
                        const userActivity = activityData[otherParticipant.platform_user_id];
                        const chatStatus = getActiveElements().chatStatus;
                        
                        if (userActivity) {
                            if (userActivity.is_online) {
                                chatStatus.innerHTML = '<span class="status-indicator"></span><span class="status-text">В сети</span>';
                                chatStatus.classList.add('online');
                            } else {
                                chatStatus.textContent = formatLastSeen(userActivity.last_online);
                                chatStatus.classList.remove('online');
                            }
                        }
                    });
                }
            }
        } else {
            sendOfflineStatus();
        }
    });

    // Обновление при активации окна
    window.addEventListener('focus', () => {
        updateChatStatuses();
        updateUserActivity(true);
    });

    // Обновление статуса активности
    setTimeout(() => {
        updateUserActivity(true);
    }, 100);

    const activityInterval = setInterval(() => {
        updateUserActivity(true);
    }, 30000);
    
    // Очистка интервалов при закрытии страницы
    window.addEventListener('beforeunload', () => {
        clearInterval(activityInterval);
        clearInterval(statusUpdateInterval);
        sendOfflineStatus();
    });

    window.addEventListener('pagehide', () => {
        clearInterval(activityInterval);
        clearInterval(statusUpdateInterval);
        sendOfflineStatus();
    });

    window.addEventListener('unload', () => {
        clearInterval(activityInterval);
        clearInterval(statusUpdateInterval);
        sendOfflineStatus();
    });
    
    // Обработчики для дополнительных кнопок
    const menuButton = document.querySelector('.menu-button');
    if (menuButton) {
        menuButton.addEventListener('click', () => {
            console.log('Menu button clicked');
            // Здесь можно добавить функциональность меню
        });
    }


    const contactsSearchBtn = document.querySelector('.contacts-search-btn');
    if (contactsSearchBtn) {
        contactsSearchBtn.addEventListener('click', () => {
            contactsSearchInput.focus();
        });
    }

    // Настройка высоты для мобильных устройств
    if (!isDesktop) {
        setupMobileChatHeight();
        window.addEventListener('resize', setupMobileChatHeight);
    }

    console.log('Page initialized successfully');
}




function filterChats(searchTerm) {
    const { chatsList } = getActiveElements();
    const chatItems = chatsList.querySelectorAll('.chat-item');
    
    chatItems.forEach(item => {
        const chatName = item.querySelector('.chat-name').textContent.toLowerCase();
        const lastMessage = item.querySelector('.last-message').textContent.toLowerCase();
        
        if (chatName.includes(searchTerm.toLowerCase()) || lastMessage.includes(searchTerm.toLowerCase())) {
            item.style.display = 'flex';
        } else {
            item.style.display = 'none';
        }
    });
}


function handleOrientationChange() {
    console.log('Orientation changed');
    
    isDesktop = window.matchMedia("(min-width: 768px)").matches;
    
    setTimeout(() => {
        // Переприменяем обои при изменении ориентации
        applyWallpaper();
        
        if (!isDesktop && currentChat) {
            setupMobileChatHeight();
            
            const { messagesContainer } = getActiveElements();
            if (messagesContainer && currentMessages.length > 0) {
                setTimeout(() => {
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }, 100);
            }
        }
    }, 100);
}

function filterContacts(searchTerm) {
    const contactItems = contactsList.querySelectorAll('.contact-item');
    
    contactItems.forEach(item => {
        const contactName = item.querySelector('.contact-name').textContent.toLowerCase();
        
        if (contactName.includes(searchTerm.toLowerCase())) {
            item.style.display = 'flex';
        } else {
            item.style.display = 'none';
        }
    });
}
      
        document.addEventListener('DOMContentLoaded', initializePage);
        
        
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                initializePage();
            }
        });
    </script>
