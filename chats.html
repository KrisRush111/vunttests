   /* Обновленные стили для кнопки отправки */
.send-button {
    background: linear-gradient(135deg, #4CAF50 0%, #8BC34A 50%, #4CAF50 100%);
    color: white;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    margin-left: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background-size: 200% 200%;
    animation: gradientShift 2s ease infinite;
    box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.send-button:before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
        45deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.1) 50%,
        rgba(255, 255, 255, 0) 100%
    );
    transform: rotate(45deg);
    animation: shine 3s infinite;
}

.send-button:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
}

.send-button:active {
    transform: scale(0.95);
    box-shadow: 0 1px 4px rgba(76, 175, 80, 0.2);

}




function adjustColor(hex, percent) {
    const num = parseInt(hex.replace("#", ""), 16);
    const amt = Math.round(2.55 * percent);
    const R = (num >> 16) + amt;
    const G = (num >> 8 & 0x00FF) + amt;
    const B = (num & 0x0000FF) + amt;

    return `#${
        (0x1000000 +
        (R < 255 ? (R < 1 ? 0 : R) : 255) * 0x10000 +
        (G < 255 ? (G < 1 ? 0 : G) : 255) * 0x100 +
        (B < 255 ? (B < 1 ? 0 : B) : 255)
    ).toString(16).slice(1)}`;
}

function formatDateHeader(timestamp) {
    if (!timestamp) return '';
    
    const date = new Date(timestamp);
    const now = new Date();
    

    const today = new Date(now);
    today.setHours(0, 0, 0, 0);
    
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    
   
    const messageDate = new Date(date);
    messageDate.setHours(0, 0, 0, 0);
    

    if (messageDate.getTime() === today.getTime()) {
        return 'Сегодня';
    } else if (messageDate.getTime() === yesterday.getTime()) {
        return 'Вчера';
    } else {
        const months = [
            'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
            'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'
        ];
        const day = messageDate.getDate();
        const month = months[messageDate.getMonth()];
        return `${day} ${month}`;
    }
}

function formatLastSeen(lastOnline) {
    if (!lastOnline) return 'в сети';
    
    const now = new Date();
    const lastSeen = new Date(lastOnline);
    const diffMs = now - lastSeen;
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);

    if (diffMins < 1) {
        return 'только что';
    } else if (diffMins < 60) {
        return `был(а) ${diffMins} ${getRussianNoun(diffMins, ['минуту', 'минуты', 'минут'])} назад`;
    } else if (diffHours < 10) {
        return `был(а) ${diffHours} ${getRussianNoun(diffHours, ['час', 'часа', 'часов'])} назад`;
    } else if (diffHours < 24) {
        return `был(а) в ${lastSeen.getHours().toString().padStart(2, '0')}:${lastSeen.getMinutes().toString().padStart(2, '0')}`;
    } else if (diffDays < 2) {
        return `был(а) вчера в ${lastSeen.getHours().toString().padStart(2, '0')}:${lastSeen.getMinutes().toString().padStart(2, '0')}`;
    } else {
        return `был(а) ${lastSeen.getDate().toString().padStart(2, '0')}.${(lastSeen.getMonth() + 1).toString().padStart(2, '0')}.${lastSeen.getFullYear()}`;
    }
}

function getRussianNoun(number, forms) {
    number = Math.abs(number) % 100;
    const n1 = number % 10;
    
    if (number > 10 && number < 20) return forms[2];
    if (n1 > 1 && n1 < 5) return forms[1];
    if (n1 === 1) return forms[0];
    return forms[2];
}

async function sendMessage() {
    const isMobile = !isDesktop;
    const messageInput = isMobile ? document.getElementById('messageInputMobile') : document.getElementById('messageInputDesktop');
    const sendButton = isMobile ? document.getElementById('sendMessageButtonMobile') : document.getElementById('sendMessageButtonDesktop');
    const mobileInputContainer = document.querySelector('.message-input-container.mobile-input');
    const { messagesContainer, noMessages } = getActiveElements();
    
    const content = messageInput.value.trim();
    if (!content || !currentChat) return;
    
    sendButton.disabled = true;
    
    try {
        // Создаем чат если это временный чат
        if (currentChat.is_temp) {
            const response = await fetch(`${SERVER_URL}/create_chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    platform_user_id: userData.platform_user_id,
                    contact_id: currentChat.participants[0].platform_user_id
                }),
                credentials: 'include'
            });
            
            const data = await response.json();
            
            if (data.status !== 'success') {
                throw new Error(data.error || 'Не удалось создать чат');
            }
            
            currentChat.id = data.chat_id;
            currentChat.is_temp = false;
            
            await loadChats();
        }
        
        // Отправляем сообщение
        const messageResponse = await fetch(`${SERVER_URL}/send_message`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: currentChat.id,
                sender_id: userData.platform_user_id,
                content: content
            }),
            credentials: 'include'
        });
        
        const messageData = await messageResponse.json();
        
        if (messageData.status !== 'success') {
            throw new Error(messageData.error || 'Не удалось отправить сообщение');
        }
        
        // Создаем объект сообщения
        const newMessage = {
            id: messageData.message_id,
            sender_id: userData.platform_user_id,
            content: content,
            sent_at: new Date().toISOString(),
            is_read: false,
            sender_name: userData.nickname,
            sender_avatar: userData.avatar_url,
            sender_avatar_background: userData.avatar_background,
            is_me: true
        };
        
        // Обновляем список сообщений
        currentMessages = [...currentMessages, newMessage];
        
        // Обновляем UI
        noMessages.style.display = 'none';
        renderMessages(currentMessages);
        
        // Прокручиваем к последнему сообщению
        setTimeout(() => {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }, 50);
        
        // Обновляем список чатов если это не временный чат
        if (!currentChat.is_temp) {
            updateChatItemInDOM(currentChat.id, {
                last_message: content,
                last_message_time: newMessage.sent_at,
                unread_count: 0
            });
            
            updateChatInList(currentChat.id, {
                last_message: content,
                last_message_time: newMessage.sent_at
            }).catch(error => {
                console.error('Background chat update error:', error);
            });
        }

        // Очищаем поле ввода и обновляем UI для мобильной версии
        messageInput.value = '';
        if (isMobile) {
            mobileInputContainer.classList.remove('has-text');
        }
        
        // Возвращаем фокус на поле ввода
        setTimeout(() => {
            messageInput.focus();
        }, 100);
        
    } catch (error) {
        console.error('Error sending message:', error);
        showMessage('Ошибка отправки сообщения: ' + error.message, 'error');
        
        // Восстанавливаем текст в поле ввода при ошибке
        messageInput.value = content;
        
        // Для мобильной версии показываем кнопку отправки если есть текст
        if (isMobile && content) {
            mobileInputContainer.classList.add('has-text');
        }
        
        // Показываем сообщение "нет сообщений" если сообщений действительно нет
        if (currentMessages.length === 0) {
            noMessages.style.display = 'block';
        }
    } finally {
        sendButton.disabled = false;
    }
}

function updateChatItemInDOM(chatId, chatData) {

        if (chatItem) {

                lastMessageEl.textContent = chatData.last_message;
            }
            
            if (chatTimeEl && chatData.last_message_time) {
                chatTimeEl.textContent = formatChatListTime(chatData.last_message_time);
            }
            
            if (chatData.unread_count > 0) {
                let badge = chatItem.querySelector('.unread-badge');
                if (!badge) {
                    badge = document.createElement('div');
                    badge.className = 'unread-badge';
                    chatItem.appendChild(badge);
                }
                badge.textContent = chatData.unread_count;
            } else {
                const badge = chatItem.querySelector('.unread-badge');
                if (badge) {
                    badge.remove();
                }
            }
            
            list.prepend(chatItem);
        }
    });
}

                    <div class="status-circle ${isRead ? 'green' : 'gray'}"></div>
                </div>
            </div>
        `;
    }
    
    messageElement.innerHTML = `
        <div class="message-content">${message.content}</div>
        <div class="message-time">
            ${messageTime}
            ${message.is_me ? statusCircles : ''}
        </div>
    `;
    
    setTimeout(() => {
        messageElement.style.opacity = '1';
        messageElement.style.transform = 'translateY(0)';
    }, 10);
    
    messagesContainer.appendChild(messageElement);

async function markAllMessagesAsRead(chatId) {
    try {
        const response = await fetch(`${SERVER_URL}/mark_all_as_read`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                chat_id: chatId,
                reader_id: userData.platform_user_id
            }),
            credentials: 'include'
        });
        
        const data = await response.json();
        
        if (data.status === 'success') {
            // Update the status of all messages in the UI
            currentMessages.forEach(message => {
                if (!message.is_me) { // Only mark incoming messages as read
                    message.is_read = true;
                }
            });
            
            // Update visual display
            updateAllMessageStatusesInUI();
        }
    } catch (error) {
        console.error('Error marking all messages as read:', error);
    }
}

function updateAllMessageStatusesInUI() {
    const { messagesContainer } = getActiveElements();
    const messageElements = messagesContainer.querySelectorAll('.message[data-message-id]');
    
    messageElements.forEach(element => {
        const messageId = element.getAttribute('data-message-id');
        const message = currentMessages.find(m => m.id === messageId);
        
        if (message && message.is_me && message.is_read) { // Only update outgoing messages that are marked as read
            const circles = element.querySelectorAll('.status-circle');
            circles.forEach(circle => {
                circle.classList.remove('gray');
                circle.classList.add('green');
            });
        }
    });
}

async function updateChatStatuses() {
    if (!currentChatsList || currentChatsList.length === 0) {
        return;
    }

    const userIds = [];
    currentChatsList.forEach(chat => {
        if (chat.participants && chat.participants.length > 0) {
            chat.participants.forEach(participant => {
                if (participant.platform_user_id !== userData.platform_user_id) {
                    userIds.push(participant.platform_user_id);
                }
            });
        }
    });

    if (userIds.length === 0) return;

    try {
        const activityData = await getUsersActivityStatus(userIds);
        currentActivityData = activityData; // Сохраняем данные для использования
        
        [chatsListDesktop, chatsListMobile].forEach(list => {
            if (!list) return;
            
            const chatItems = list.querySelectorAll('.chat-item');
            chatItems.forEach(chatItem => {
                const chatId = chatItem.getAttribute('data-chat-id');
                const chat = currentChatsList.find(c => c.id === chatId);
                
                if (chat && chat.participants) {
                    const otherParticipant = chat.participants.find(p => p.platform_user_id !== userData.platform_user_id);
                    if (otherParticipant) {
                        const userActivity = activityData[otherParticipant.platform_user_id];
                        const statusElement = chatItem.querySelector('.chat-status');
                        
                        if (statusElement) {
                            if (userActivity && userActivity.is_online) {
                                statusElement.innerHTML = '<span class="status-indicator"></span><span class="status-text">В сети</span>';
                                statusElement.classList.add('online');
                            } else {
                                const statusText = userActivity ? formatLastSeen(userActivity.last_online) : 'был(а) недавно';
                                statusElement.innerHTML = statusText;
                                statusElement.classList.remove('online');
                            }
                        }
                    }
                }
            });
        });
    } catch (error) {
        console.error('Error updating chat statuses:', error);
    }
}

        chatModalMobile.classList.remove('active'); 
    }

    // Параллельная загрузка данных без индикаторов
    await Promise.all([
        loadUserData(),
        loadChats()
    ]);
    
    // Обработка открытого чата без задержек
    const openChatId = sessionStorage.getItem('openChatId');
    const openChatName = sessionStorage.getItem('openChatName');
    
    if (openChatId && openChatName) {
        const tempChat = {
            id: openChatId,
            name: openChatName,
            is_temp: false
        };
        
        sessionStorage.removeItem('openChatId');
        sessionStorage.removeItem('openChatName');
        
        // Открываем чат сразу без задержки
        openChat(openChatId);
    }

    // Настройка обработчиков событий для новой строки ввода
    const { addChatButton, searchInput, backToChats } = getActiveElements();

    // Получаем элементы для новой системы ввода
    const messageInputMobile = document.getElementById('messageInputMobile');
    const sendButtonMobile = document.getElementById('sendMessageButtonMobile');
    const messageInputDesktop = document.getElementById('messageInputDesktop');
    const sendButtonDesktop = document.getElementById('sendMessageButtonDesktop');
    const mobileInputContainer = document.querySelector('.message-input-container.mobile-input');

    // Обработчики для мобильной строки ввода
    messageInputMobile.addEventListener('input', function() {
        if (this.value.trim()) {
            mobileInputContainer.classList.add('has-text');
        } else {
            mobileInputContainer.classList.remove('has-text');
        }
    });

    // Обработчики для кнопок (заглушки)
    document.querySelectorAll('.voice-button, .attach-button, .emoji-button').forEach(button => {
        button.addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Button clicked:', this.className);
            // Здесь можно добавить функциональность для этих кнопок
        });
    });

    addChatButton.addEventListener('click', (e) => {
        e.preventDefault();
        showContactsModal();
    });

    closeContacts.addEventListener('click', hideContactsModal);
    modalOverlay.addEventListener('click', hideContactsModal);
    
    contactsSearchInput.addEventListener('input', (e) => {
        filterContacts(e.target.value);
    });

    searchInput.addEventListener('input', (e) => {
        filterChats(e.target.value);
    });

    if (backToChats) { 
        backToChats.addEventListener('click', (e) => {
            e.preventDefault();
            closeChat();
        });
    }
    
    // Обработка отправки сообщения для обеих версий
    sendButtonMobile.addEventListener('click', sendMessage);
    messageInputMobile.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    sendButtonDesktop.addEventListener('click', sendMessage);
    messageInputDesktop.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
    
    // Обновление статусов каждые 5 секунд
    setInterval(async () => {
        const { chatModal } = getActiveElements();
        
        // Фоновое обновление статусов без блокировки UI
        Promise.all([
            fetch(`${SERVER_URL}/refresh_activity`, {
                method: 'POST',
                credentials: 'include'
            }).catch(() => {}),
            updateChatStatuses()
        ]).then(() => {
            // Обновляем статус в открытом чате
            if (currentChat && (chatModal.classList.contains('active') || chatModal.style.display === 'flex')) {
                const otherParticipant = currentChat.participants?.find(p => p.platform_user_id !== userData.platform_user_id);
                if (otherParticipant) {
                    getUsersActivityStatus([otherParticipant.platform_user_id]).then(activityData => {
                        const userActivity = activityData[otherParticipant.platform_user_id];
                        const chatStatus = getActiveElements().chatStatus;
                        
                        if (userActivity) {
                            if (userActivity.is_online) {
                                chatStatus.innerHTML = '<span class="status-indicator"></span><span class="status-text">В сети</span>';
                                chatStatus.classList.add('online');
                            } else {
                                chatStatus.textContent = formatLastSeen(userActivity.last_online);
                                chatStatus.classList.remove('online');
                            }
                        } else {
                            chatStatus.textContent = 'был(а) недавно';
                            chatStatus.classList.remove('online');
                        }
                    });
                }
            }
        });
    }, 5000);

    setupKeyboardHandlers();
    
    // Запрет масштабирования жестами
    document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
    });
    
    document.addEventListener('gesturechange', function(e) {
        e.preventDefault();
    });
    
    document.addEventListener('gestureend', function(e) {
        e.preventDefault();
    });

    // Обновление статусов при возвращении на вкладку
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            updateChatStatuses();
            if (currentChat) {
                const otherParticipant = currentChat.participants?.find(p => p.platform_user_id !== userData.platform_user_id);
                if (otherParticipant) {
                    getUsersActivityStatus([otherParticipant.platform_user_id]).then(activityData => {
                        const userActivity = activityData[otherParticipant.platform_user_id];
                        const chatStatus = getActiveElements().chatStatus;
                        
                        if (userActivity) {
                            if (userActivity.is_online) {
                                chatStatus.innerHTML = '<span class="status-indicator"></span><span class="status-text">В сети</span>';
                                chatStatus.classList.add('online');
                            } else {
                                chatStatus.textContent = formatLastSeen(userActivity.last_online);
                                chatStatus.classList.remove('online');
                            }
                        }
                    });
                }
            }
        }
    });

    // Обновление при активации окна
    window.addEventListener('focus', () => {
        updateChatStatuses();
    });

    // Обновление статуса активности
    setTimeout(() => {
        updateUserActivity(true);
    }, 100);

    const activityInterval = setInterval(() => {
        updateUserActivity(true);
    }, 30000);
    
    // Обработчики для отправки статуса офлайн
    window.addEventListener('beforeunload', () => {
        clearInterval(activityInterval);
        sendOfflineStatus();
    });

    window.addEventListener('pagehide', () => {
        sendOfflineStatus();
    });

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            updateUserActivity(true);
        } else {
            sendOfflineStatus();
        }
    });
    
    const menuButton = document.querySelector('.menu-button');
    if (menuButton) {
        menuButton.addEventListener('click', () => {
            console.log('Menu button clicked');
        });
    }

    const contactsSearchBtn = document.querySelector('.contacts-search-btn');
    if (contactsSearchBtn) {
        contactsSearchBtn.addEventListener('click', () => {
            contactsSearchInput.focus();
        });
    }
}


function filterChats(searchTerm) {
    const { chatsList } = getActiveElements();
    const chatItems = chatsList.querySelectorAll('.chat-item');
    
    chatItems.forEach(item => {
        const chatName = item.querySelector('.chat-name').textContent.toLowerCase();
        const lastMessage = item.querySelector('.last-message').textContent.toLowerCase();
        
        if (chatName.includes(searchTerm.toLowerCase()) || lastMessage.includes(searchTerm.toLowerCase())) {
            item.style.display = 'flex';
        } else {
            item.style.display = 'none';
        }
    });
}


function filterContacts(searchTerm) {
    const contactItems = contactsList.querySelectorAll('.contact-item');
    
    contactItems.forEach(item => {
        const contactName = item.querySelector('.contact-name').textContent.toLowerCase();
        
        if (contactName.includes(searchTerm.toLowerCase())) {
            item.style.display = 'flex';
        } else {
            item.style.display = 'none';
        }
    });
}
      
        document.addEventListener('DOMContentLoaded', initializePage);
        
        
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                initializePage();
            }
        });
    </script>

     <script src="activity-tracker.js"></script>
</body>
</html>
