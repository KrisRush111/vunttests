<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чаты - TheVuntgram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --tg-theme-bg-color: #17212b;
            --tg-theme-secondary-bg-color: #242f3d;
            --tg-theme-header-bg-color: #242f3d;
            --tg-theme-section-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #708499;
            --tg-theme-link-color: #2481cc;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-destructive-text-color: #ee686f;
            --telegram-blue: #0088cc;
            --telegram-light-blue: #40a7e3;
            --telegram-bg: #ffffff;
            --telegram-secondary-bg: #f4f4f5;
            --telegram-text: #000000;
            --telegram-hint: #8e8e93;
            --online-green: #00c73c;
            --telegram-divider: rgba(0,0,0,0.08);
            --telegram-shadow: 0 1px 3px rgba(0,0,0,0.06);
            --telegram-shadow-large: 0 4px 16px rgba(0,0,0,0.08);
            --telegram-destructive: #ee686f;
            --telegram-success: #00c73c;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --telegram-bg: #212121;
                --telegram-secondary-bg: #1d1d1d;
                --telegram-text: #ffffff;
                --telegram-hint: #8e8e93;
                --telegram-divider: rgba(255,255,255,0.12);
                --telegram-shadow: 0 1px 3px rgba(0,0,0,0.24);
                --telegram-shadow-large: 0 4px 16px rgba(0,0,0,0.24);
            }
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background-color: var(--telegram-secondary-bg);
            color: var(--telegram-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .chats-container {
            flex: 1;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            padding: 12px 12px 80px;
            animation: fadeInUp 0.3s ease-out;
        }
        
        .search-container {
            margin-bottom: 12px;
            padding: 16px;
            background: var(--telegram-bg);
            border-radius: 12px;
            box-shadow: var(--telegram-shadow);
            transition: all 0.2s ease;
            animation: fadeInUp 0.3s ease-out;
            position: relative;
        }
        
        .search-container:active {
            transform: scale(0.99);
        }
        
        .search-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--telegram-text);
            letter-spacing: -0.02em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .search-input-container {
            display: flex;
            align-items: center;
            position: relative;
        }
        
        .search-input {
            flex: 1;
            padding: 12px 16px;
            padding-left: 44px;
            border: 1px solid var(--telegram-divider);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s ease;
            background-color: var(--telegram-secondary-bg);
            color: var(--telegram-text);
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--telegram-blue);
            box-shadow: 0 0 0 2px rgba(36, 129, 204, 0.1);
            background-color: var(--telegram-bg);
        }
        
        .search-icon {
            position: absolute;
            left: 16px;
            color: var(--telegram-hint);
            font-size: 16px;
            pointer-events: none;
        }
        
        .add-chat-button {
            padding: 10px;
            background-color: var(--telegram-blue);
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .add-chat-button:hover {
            background-color: #006ba1;
            transform: translateY(-1px);
            box-shadow: var(--telegram-shadow-large);
        }

        .add-chat-button:active {
            transform: scale(0.95);
        }
        
        .chats-content {
            background: var(--telegram-bg);
            border-radius: 12px;
            padding: 0;
            box-shadow: var(--telegram-shadow);
            min-height: 200px;
            display: flex;
            flex-direction: column;
            animation: fadeInUp 0.3s ease-out 0.1s;
            animation-fill-mode: both;
            overflow: hidden;
        }
        
        .no-chats {
            color: var(--telegram-hint);
            font-size: 15px;
            text-align: center;
            margin: auto;
            opacity: 0;
            animation: fadeIn 0.3s ease-out 0.2s forwards;
            padding: 40px 20px;
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--telegram-divider);
            margin: 0;
            background-color: var(--telegram-bg);
            animation: fadeIn 0.3s ease-out;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chat-item:last-child {
            border-bottom: none;
        }

        .chat-item:hover {
            background-color: rgba(0,0,0,0.02);
        }

        .chat-item:active {
            background-color: rgba(0,0,0,0.04);
            transform: scale(0.98);
        }

        @media (prefers-color-scheme: dark) {
            .chat-item:hover {
                background-color: rgba(255,255,255,0.04);
            }

            .chat-item:active {
                background-color: rgba(255,255,255,0.08);
            }
        }
        
        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
            margin-right: 12px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: var(--telegram-shadow);
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        .chat-avatar:hover {
            transform: scale(1.02);
        }
        
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        
        .chat-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--telegram-text);
        }
        
        .last-message {
            font-size: 14px;
            color: var(--telegram-hint);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-time {
            font-size: 12px;
            color: var(--telegram-hint);
            margin-top: 4px;
        }
        
        .unread-badge {
            background-color: var(--telegram-blue);
            color: white;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 600;
            min-width: 20px;
            text-align: center;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.3s ease-in-out;
            backdrop-filter: blur(8px);
        }
        
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(36, 129, 204, 0.2);
            border-radius: 50%;
            border-top-color: var(--telegram-blue);
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        
        .loading-text {
            color: var(--telegram-text);
            font-size: 15px;
            font-weight: 500;
            background: var(--telegram-bg);
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: var(--telegram-shadow-large);
        }
        
        .message-box {
            text-align: center;
            padding: 12px 16px;
            margin: 12px;
            border-radius: 12px;
            display: none;
            font-size: 15px;
            font-weight: 500;
            animation: slideDown 0.3s ease;
        }

        .message-box.error {
            color: white;
            background: var(--telegram-destructive);
        }

        .message-box.success {
            color: white;
            background: var(--telegram-success);
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--telegram-bg);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--telegram-divider);
            backdrop-filter: blur(20px);
            z-index: 100;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--telegram-hint);
            font-size: 10px;
            font-weight: 500;
            transition: all 0.2s ease;
            padding: 8px 12px;
            border-radius: 12px;
            min-width: 60px;
        }
        
        .nav-item i {
            font-size: 22px;
            margin-bottom: 2px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-item span {
            transition: all 0.2s ease;
        }
        
        .nav-item.active {
            color: var(--telegram-blue);
        }

        .nav-item.active i {
            animation: bounce 0.6s ease;
        }
        
        .nav-item:hover i {
            transform: translateY(-2px) scale(1.1);
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        @media (max-width: 480px) {
            .chats-container {
                padding: 8px 8px 80px;
            }
            
            .search-container {
                padding: 12px;
            }
            
            .search-title {
                font-size: 20px;
                margin-bottom: 12px;
            }
            
            .search-input {
                padding: 10px 14px;
                padding-left: 40px;
                font-size: 16px;
            }
            
            .chat-avatar {
                width: 40px;
                height: 40px;
                font-size: 16px;
                margin-right: 10px;
            }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes fadeInUp {
            from { 
                opacity: 0;
                transform: translateY(20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 20%, 53%, 100% {
                transform: translateY(0);
            }
            40%, 43% {
                transform: translateY(-8px);
            }
            70% {
                transform: translateY(-4px);
            }
            90% {
                transform: translateY(-2px);
            }
        }
    </style>
</head>
<body>
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Загрузка данных...</div>
    </div>

    <div class="chats-container">
        <!-- Message box -->
        <div id="messageBox" class="message-box"></div>
        
        <!-- Search section -->
        <div class="search-container">
            <div class="search-title">
                Чаты
                <button id="addChatButton" class="add-chat-button">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <div class="search-input-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Поиск чатов...">
            </div>
        </div>
        
        <!-- Chats content -->
        <div class="chats-content">
            <div id="noChats" class="no-chats">Нет чатов</div>
            <div id="chatsList"></div>
        </div>
    </div>

    <!-- Bottom navigation -->
    <div class="bottom-nav">
        <a href="contacts.html" class="nav-item">
            <i class="fas fa-user-circle"></i>
            <span>Контакты</span>
        </a>
        
        <a href="chats.html" class="nav-item active">
            <i class="fas fa-comments"></i>
            <span>Чаты</span>
        </a>
     
        <a href="profile.html" class="nav-item">
            <i class="fas fa-cog"></i>
            <span>Профиль</span>
        </a>
    </div>

    <script>
        // Configuration
        const SERVER_URL = 'https://vuntserver-p1cx.onrender.com';
        
        // DOM elements
        const loadingOverlay = document.getElementById('loadingOverlay');
        const noChats = document.getElementById('noChats');
        const searchInput = document.getElementById('searchInput');
        const addChatButton = document.getElementById('addChatButton');
        const chatsList = document.getElementById('chatsList');
        const messageBox = document.getElementById('messageBox');
        
        // User data from profile page
        let userData = {};
        
        // Show loading overlay
        function showLoading(text = 'Загрузка...') {
            loadingOverlay.querySelector('.loading-text').textContent = text;
            loadingOverlay.style.display = 'flex';
            loadingOverlay.style.opacity = '1';
        }
        
        // Hide loading overlay
        function hideLoading() {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => {
                loadingOverlay.style.display = 'none';
            }, 300);
        }
        
        // Show message (error or success)
        function showMessage(message, type = 'error') {
            messageBox.textContent = message;
            messageBox.className = `message-box ${type}`;
            messageBox.style.display = 'block';
            setTimeout(() => {
                messageBox.style.display = 'none';
            }, 5000);
        }
        
        // Load user data from sessionStorage
        function loadUserData() {
            showLoading('Загрузка данных пользователя...');
            
            try {
                const data = JSON.parse(sessionStorage.getItem('userData'));
                
                if (data && data.platform_user_id) {
                    userData = {
                        nickname: data.nickname || "не указано",
                        identity: data.identity || "не указано",
                        main_school_code: data.main_school_code || "не указано",
                        main_school_name: data.main_school_name || "не указано",
                        class_number: data.class_number || "не указано",
                        class_letter: data.class_letter || "не указано",
                        additional_school_code: data.additional_school_code || "не указано",
                        additional_school_name: data.additional_school_name || "не указано",
                        specialization: data.specialization || "не указано",
                        course: data.course || "не указано",
                        platform_user_id: data.platform_user_id
                    };
                    
                    console.log('User data loaded:', userData);
                    hideLoading();
                } else {
                    throw new Error('No user data found');
                }
            } catch (error) {
                console.error('Error loading user data:', error);
                hideLoading();
                // Redirect to profile if no data
                window.location.href = 'profile.html';
            }
        }
        
        // Load chats (placeholder - no actual data loading yet)
        function loadChats() {
            showLoading('Загрузка чатов...');
            chatsList.innerHTML = '';
            noChats.style.display = 'block';
            hideLoading();
        }
        
        // Event listeners
        window.addEventListener('DOMContentLoaded', () => {
            loadUserData();
            loadChats();
            
            addChatButton.addEventListener('click', () => {
                showMessage('Функция добавления чата будет реализована позже', 'info');
            });
        });
        
        // Handle back/forward cache (BFCache)
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                loadUserData();
                loadChats();
            }
        });
    </script>
</body>
</html>
