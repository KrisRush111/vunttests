    <script>
     
        const SERVER_URL = 'https://vuntserverrr.site'; 
        


let deferredPrompt;
const installButton = document.getElementById('installButton');

// Определяем платформу
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const isAndroid = /Android/.test(navigator.userAgent);
const isSafari = /Safari/.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent);
const isMobile = isIOS || isAndroid;

// Функция для показа инструкций по установке
function getInstallInstructions() {
    if (isIOS) {
        return 'Для установки: нажмите кнопку "Поделиться" 📤 и выберите "На экран «Домой»"';
    } else if (isAndroid && isSafari) {
        return 'Для установки: в меню браузера выберите "Добавить на главный экран"';
    } else if (isAndroid) {
        return 'Для установки: нажмите "Установить" или в меню выберите "Добавить на главный экран"';
    } else {
        return 'Для установки: нажмите кнопку "Установить" или используйте меню браузера';
    }
}

// Функция показа кнопки установки для ВСЕХ платформ
function showInstallButton() {
    // Всегда показываем кнопку, если приложение еще не установлено
    if (checkIfAppIsInstalled()) {
        installButton.style.display = 'none';
        return;
    }
    
    const instructions = getInstallInstructions();
    
    if (isIOS || isSafari) {
        // Для iOS/Safari показываем специальную кнопку с инструкциями
        installButton.innerHTML = `<i class="fas fa-mobile-alt"></i>Установить приложение`;
        installButton.style.background = '#0077ff';
        installButton.title = instructions;
    } else if (isAndroid) {
        // Для Android
        installButton.innerHTML = `<i class="fas fa-download"></i>Установить приложение`;
        installButton.style.background = '#0077ff';
        installButton.title = instructions;
    } else {
        // Для Windows/Desktop
        installButton.innerHTML = `<i class="fas fa-desktop"></i>Установить приложение`;
        installButton.style.background = '#0077ff';
        installButton.title = 'Установите Vuntgram как приложение для быстрого доступа';
    }
    
    installButton.style.display = 'block';
    installButton.style.animation = 'slideInUp 0.3s ease';
}

// Показываем кнопку когда приложение можно установить (Chrome/Android)
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    showInstallButton();
});

// Обработка клика по кнопке установки для всех платформ
installButton.addEventListener('click', async () => {
    // Chrome/Android с поддержкой beforeinstallprompt
    if (deferredPrompt) {
        try {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installButton.style.display = 'none';
            }
            deferredPrompt = null;
        } catch (error) {
            console.error('Installation error:', error);
            // Если произошла ошибка, показываем инструкции
            showInstallInstructions();
        }
    } 
    // iOS/Safari и другие браузеры - показываем инструкции
    else {
        showInstallInstructions();
    }
});

// Функция показа инструкций по установке
function showInstallInstructions() {
    const instruction = getInstallInstructions();
    
    // Создаем красивый alert с инструкциями
    let message = `📱 Установка Vuntgram\n\n${instruction}\n\nПосле установки приложение будет доступно с главного экрана!`;
    
    if (!isMobile) {
        message += '\n\nChrome: ⋮ → "Установить Vuntgram"\nFirefox: ⋮ → "Установить"\nEdge: ... → "Приложения" → "Установить этот сайт как приложение"';
    }
    
    alert(message);
    
    // Для iOS обновляем кнопку с визуальной подсказкой
    if (isIOS) {
        installButton.innerHTML = `<i class="fas fa-share"></i>Нажмите 📤 затем "На экран «Домой»"`;
        installButton.style.background = '#0077ff';
        
        // Показываем кнопку еще 10 секунд потом скрываем
        setTimeout(() => {
            if (!checkIfAppIsInstalled()) {
                showInstallButton(); // Возвращаем обычную кнопку
            }
        }, 10000);
    }
}

// Скрываем кнопку если приложение уже установлено
window.addEventListener('appinstalled', (evt) => {
    installButton.style.display = 'none';
    deferredPrompt = null;
});

// Проверяем если приложение уже установлено
function checkIfAppIsInstalled() {
    // Android/Desktop Chrome
    if (window.matchMedia('(display-mode: standalone)').matches) {
        return true;
    }
    
    // iOS Safari
    if (window.navigator.standalone) {
        return true;
    }
    
    // Дополнительные проверки
    if (window.location.search.includes('mode=standalone')) {
        return true;
    }
    
    return false;
}

// Регистрация Service Worker с улучшенной обработкой ошибок
function registerServiceWorker() {
    if (!('serviceWorker' in navigator)) {
        console.log('Service Worker не поддерживается');
        return;
    }

    window.addEventListener('load', async function() {
        try {
            const registration = await navigator.serviceWorker.register('/sw.js');
            console.log('ServiceWorker зарегистрирован успешно');
            
            registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                
                newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'activated') {
                        console.log('ServiceWorker активирован');
                        // После активации SW показываем кнопку установки
                        setTimeout(() => {
                            showInstallButton();
                        }, 1000);
                    }
                });
            });
            
        } catch (error) {
            console.log('Ошибка регистрации ServiceWorker:', error);
            // Даже если SW не работает, показываем кнопку установки
            setTimeout(() => {
                showInstallButton();
            }, 2000);
        }
    });
}

// Инициализация PWA
function initializePWA() {
    console.log('Инициализация PWA...');
    
    // Сначала проверяем не установлено ли уже приложение
    if (checkIfAppIsInstalled()) {
        console.log('Приложение уже установлено');
        installButton.style.display = 'none';
        return;
    }
    
    // Регистрируем Service Worker
    registerServiceWorker();
    
    // Показываем кнопку установки через 3 секунды независимо от платформы
    setTimeout(() => {
        if (!checkIfAppIsInstalled()) {
            showInstallButton();
        }
    }, 3000);
    
    // Дополнительная проверка через 5 секунд
    setTimeout(() => {
        if (installButton.style.display === 'none' && !checkIfAppIsInstalled()) {
            showInstallButton();
        }
    }, 5000);
    
    // Периодическая проверка статуса
    setInterval(() => {
        if (checkIfAppIsInstalled()) {
            installButton.style.display = 'none';
        }
    }, 10000);
}

// Запускаем инициализацию PWA
initializePWA();



        const loginForm = document.getElementById('loginForm');
        const errorElement = document.getElementById('error-message');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('email-error');
        const passwordError = document.getElementById('password-error');
        const loginButton = document.getElementById('login-button');
        const buttonText = document.getElementById('button-text');
        const buttonLoader = document.getElementById('button-loader');
        
       
        const consentCheckbox = document.getElementById('consent');
        const consentError = document.getElementById('consent-error');

        // Скрываем текст "Необходимо дать согласие" сразу, как только поставили галочку
        consentCheckbox.addEventListener('change', () => {
            if (consentCheckbox.checked) {
                consentError.classList.add('hidden');
            }
        });

        // Определяет, куда вести пользователя после успешной проверки авторизации:
        // при самом первом входе — на profile.html (как раньше), а при всех
        // последующих заходах (флаг уже стоит) — сразу на chats.html.
        function getPostAuthDestination() {
            if (localStorage.getItem('vg_onboarded') === '1') {
                return 'chats.html';
            }
            localStorage.setItem('vg_onboarded', '1');
            return 'profile.html';
        }

     
        // Проверка сохраненного пользователя
        function checkRememberedUser() {
            const rememberedUser = localStorage.getItem('rememberedUser');
            if (rememberedUser) {
                try {
                    const userData = JSON.parse(rememberedUser);
                    // Проверяем, что данные валидны
                    if (userData && userData.platform_user_id) {
                        console.log('Auto-login with remembered user:', userData.platform_user_id);
                        // Сохраняем в sessionStorage для текущей сессии
                        sessionStorage.setItem('userData', JSON.stringify(userData));
                        // Не блокируем редирект — регистрация SW/подписка продолжится в фоне
                        // и на следующей странице (SW и permission живут на уровне браузера,
                        // а не конкретной вкладки/навигации)
                        if (typeof initPushNotifications === 'function') {
                            initPushNotifications(userData.platform_user_id);
                        }
                        // Перенаправляем сразу на профиль
                        window.location.href = getPostAuthDestination();
                        return true;
                    }
                } catch (error) {
                    console.error('Error parsing remembered user:', error);
                    localStorage.removeItem('rememberedUser');
                }
            }
            return false;
        }

        // Вызов при загрузке страницы ДО всего остального
        document.addEventListener('DOMContentLoaded', function() {
            // Сначала проверяем авторизацию
            if (checkRememberedUser()) {
                return; // Прерываем дальнейшую загрузку, т.к. идет редирект
            }
            
            // Только если пользователь не авторизован, показываем форму входа
            const animatedElements = document.querySelectorAll('[class*="animate-"]');
            animatedElements.forEach(el => {
                el.style.opacity = '0';
            });
            
            setTimeout(() => {
                animatedElements.forEach(el => {
                    el.style.opacity = '';
                });
            }, 100);
            
            // Добавляем чекбокс "Запомнить меня" в форму
            const rememberMeHTML = `
                <div class="animate-fade-in-up animate-delay-450">
                    <div class="flex items-start">
                        <div class="flex items-center h-5">
                            <input id="remember" name="remember" type="checkbox" 
                                class="h-4 w-4 text-emerald-400 focus:ring-emerald-400 border-gray-300 rounded">
                        </div>
                        <div class="ml-3 text-sm">
                            <label for="remember" class="text-gray-200">
                                Запомнить меня
                            </label>
                        </div>
                    </div>
                </div>
            `;
            
            // Вставляем перед кнопкой входа
            const submitButton = loginForm.querySelector('button[type="submit"]');
            submitButton.parentElement.insertAdjacentHTML('beforebegin', rememberMeHTML);
        });

       
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = emailInput.value;
            const password = passwordInput.value;
            
       
            resetErrors();
            

            if (!consentCheckbox.checked) {
                showConsentError();
                return;
            }
    
            showLoadingState();
            
          
            if (!email || !password) {
                showError('Пожалуйста, заполните все поля');
                resetButtonState();
                return;
            }
            
            if (!email.endsWith('@vibe.ye')) {
                showFieldError(emailInput, emailError, 'Пожалуйста, используйте email, заканчивающийся на vibe.ye');
                resetButtonState();
                return;
            }
            
            try {
         
                const loginData = {
                    email: email,
                    password: password
                };
                
             
                const response = await fetch(`${SERVER_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams(loginData)
                });
                
                
                const result = await response.json();
                
                if (response.ok) {
                    // Если отмечен чекбокс "Запомнить меня" - сохраняем в localStorage
                    const rememberCheckbox = document.getElementById('remember');
                    finishLogin(result, rememberCheckbox && rememberCheckbox.checked);
                } else {
                   
                    handleServerError(result.error, email);
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Ошибка соединения с сервером');
                resetButtonState();
            }
        });

        // Общая часть успешного входа — вызывается и обычным логином по
        // паролю, и подтверждённым входом по QR (см. ниже), т.к. сервер в
        // обоих случаях отдаёт один и тот же формат ответа (см. /login и
        // /api/qrlogin/poll).
        function finishLogin(result, remember) {
            sessionStorage.setItem('userData', JSON.stringify(result.user));

            // Токен устройства сервер уже выдал и создал строку в
            // user_devices прямо здесь, при входе (см. /login на
            // сервере) — и уже отправил "devices_changed" всем
            // остальным сеансам аккаунта. Раньше этот токен нигде не
            // сохранялся, и при первом же открытии chats.html/profile.html
            // VGAuth.bootstrap() регистрировал ЭТО ЖЕ устройство ещё
            // раз — как отдельную, вторую строку (задвоение в списке
            // "Устройства"). Сохраняя токен сразу, привязываем ровно
            // одну запись к этому входу.
            if (result.device_token) localStorage.setItem('vg_device_token', result.device_token);
            if (result.device_id) localStorage.setItem('vg_device_id', result.device_id);

            if (remember) {
                localStorage.setItem('rememberedUser', JSON.stringify(result.user));
                console.log('User saved to localStorage for auto-login');
            }

            if (typeof initPushNotifications === 'function') {
                initPushNotifications(result.user.platform_user_id);
            }

            window.location.href = getPostAuthDestination();
        }

        /* ═══════════════════════════════════════════════════════════
           Вход по QR-коду

           1) создаём одноразовый token на сервере;
           2) рисуем из него QR ЛОКАЛЬНО (QRCode.js), не отдавая токен
              на сторонний сервис генерации картинок;
           3) опрашиваем /api/qrlogin/poll/<token> — как только другое
              устройство подтвердит вход камерой в profile.html, этот же
              ответ уже содержит готовую сессию (device_token/user), и
              обрабатывается той же finishLogin(), что и обычный логин.
           ═══════════════════════════════════════════════════════════ */
        (function setupQrLogin() {
            const passwordCard = document.querySelector('.login-card:not(#qrLoginCard)');
            const qrCard = document.getElementById('qrLoginCard');
            const showQrBtn = document.getElementById('showQrLoginBtn');
            const showPasswordBtn = document.getElementById('showPasswordLoginBtn');
            const codeBox = document.getElementById('qrLoginCode');
            const overlay = document.getElementById('qrLoginOverlay');
            const overlayText = document.getElementById('qrLoginOverlayText');
            const refreshBtn = document.getElementById('qrLoginRefreshBtn');
            if (!qrCard || !showQrBtn) return;

            let qrObj = null;
            let pollTimer = null;
            let active = false;

            function stopPolling() {
                if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
            }

            async function createAndShowCode() {
                overlay.style.display = 'none';
                refreshBtn.style.display = 'none';
                codeBox.style.opacity = '0.35';
                try {
                    const res = await fetch(`${SERVER_URL}/api/qrlogin/create`, { method: 'POST' });
                    const data = await res.json();
                    codeBox.style.opacity = '1';
                    if (!res.ok || data.status !== 'success') {
                        overlayText.textContent = 'Не удалось создать код';
                        overlay.style.display = 'flex';
                        refreshBtn.style.display = 'inline-block';
                        return;
                    }

                    codeBox.innerHTML = '';
                    qrObj = new QRCode(codeBox, {
                        text: 'vuntgram-login:' + data.token,
                        width: 200,
                        height: 200,
                        colorDark: '#000000',
                        colorLight: '#ffffff'
                    });

                    poll(data.token, Date.now() + data.expires_in * 1000);
                } catch (e) {
                    codeBox.style.opacity = '1';
                    overlayText.textContent = 'Ошибка соединения с сервером';
                    overlay.style.display = 'flex';
                    refreshBtn.style.display = 'inline-block';
                }
            }

            async function poll(token, expiresAtMs) {
                if (!active) return;
                if (Date.now() > expiresAtMs) {
                    overlayText.textContent = 'Код устарел';
                    overlay.querySelector('i').className = 'fas fa-rotate-right';
                    overlay.style.display = 'flex';
                    refreshBtn.style.display = 'inline-block';
                    return;
                }
                try {
                    const res = await fetch(`${SERVER_URL}/api/qrlogin/poll/${token}`);
                    const data = await res.json();

                    if (res.ok && data.status === 'success') {
                        stopPolling();
                        overlayText.textContent = 'Вход выполнен';
                        overlay.querySelector('i').className = 'fas fa-check';
                        overlay.style.display = 'flex';
                        // У QR-входа нет чекбокса "Запомнить меня" — сам факт
                        // сканирования кода уже является явным подтверждением
                        // входа (как и при добавлении устройства в Telegram),
                        // поэтому запоминаем всегда. Раньше здесь стояло
                        // false, из-за чего rememberedUser не сохранялся, и
                        // при следующем открытии приложение снова показывало
                        // экран логина, даже если device_token оставался
                        // валидным.
                        finishLogin(data, true);
                        return;
                    }

                    if (data.status === 'expired' || data.status === 'cancelled' ||
                        data.status === 'consumed' || data.status === 'not_found') {
                        overlayText.textContent = 'Код устарел';
                        overlay.querySelector('i').className = 'fas fa-rotate-right';
                        overlay.style.display = 'flex';
                        refreshBtn.style.display = 'inline-block';
                        return;
                    }

                    // status === 'pending' (или confirmed на долю секунды до
                    // финализации) — продолжаем опрос
                    pollTimer = setTimeout(() => poll(token, expiresAtMs), 1500);
                } catch (e) {
                    pollTimer = setTimeout(() => poll(token, expiresAtMs), 2500);
                }
            }

            showQrBtn.addEventListener('click', () => {
                if (passwordCard) passwordCard.style.display = 'none';
                qrCard.style.display = 'block';
                active = true;
                createAndShowCode();
            });

            showPasswordBtn.addEventListener('click', () => {
                active = false;
                stopPolling();
                qrCard.style.display = 'none';
                if (passwordCard) passwordCard.style.display = 'block';
            });

            refreshBtn.addEventListener('click', () => {
                active = true;
                createAndShowCode();
            });
        })();
        
   
        function showError(message) {
            errorElement.textContent = message;
            errorElement.classList.remove('hidden');
            
         
            errorElement.style.animation = 'none';
            setTimeout(() => {
                errorElement.style.animation = 'shake 0.5s ease-in-out';
            }, 10);
        }
        
   
        function showFieldError(inputElement, errorElement, message) {
            inputElement.classList.add('input-error');
            errorElement.textContent = message;
            errorElement.classList.remove('hidden');
            
         
            inputElement.style.animation = 'none';
            setTimeout(() => {
                inputElement.style.animation = 'shake 0.5s ease-in-out';
            }, 10);
        }
        
      
        function showConsentError() {
            consentError.classList.remove('hidden');
            consentError.style.animation = 'none';
            setTimeout(() => {
                consentError.style.animation = 'shake 0.5s ease-in-out';
            }, 10);
        }
        
       
        function resetErrors() {
            errorElement.classList.add('hidden');
            errorElement.textContent = '';
            
            emailInput.classList.remove('input-error');
            passwordInput.classList.remove('input-error');
            
            emailError.classList.add('hidden');
            passwordError.classList.add('hidden');
            consentError.classList.add('hidden');
            
            emailError.textContent = '';
            passwordError.textContent = '';
        }
        
      
        function showLoadingState() {
            loginButton.classList.add('btn-loading');
            buttonText.textContent = 'Вход...';
            buttonLoader.classList.remove('hidden');
            loginButton.disabled = true;
        }
        
  
        function resetButtonState() {
            loginButton.classList.remove('btn-loading');
            buttonText.textContent = 'Войти';
            buttonLoader.classList.add('hidden');
            loginButton.disabled = false;
        }
        
        
        function clearFormFields() {
            emailInput.value = '';
            passwordInput.value = '';
        }
        
    
        function handleServerError(errorType, email) {
            switch (errorType) {
                case 'Неверный адрес электронной почты или пароль':
                    showFieldError(passwordInput, passwordError, 'Неверный пароль');
                    passwordInput.value = ''; 
                    break;
                    
                case 'Такого аккаунта нет':
                    showFieldError(emailInput, emailError, 'Такого аккаунта нет');
                    clearFormFields(); 
                    break;
                    
                case 'Пожалуйста, используйте email, заканчивающийся на vibe.ye':
                    showFieldError(emailInput, emailError, errorType);
                    break;
                    
                case 'Заполните все поля':
                    showError(errorType);
                    break;
                    
                default:
                    showError(errorType || 'Ошибка при входе');
                    clearFormFields();
            }
            
            resetButtonState();
        }

        // Script for loading screen and auth check
        (function() {
            const loadingScreen = document.getElementById('loadingScreen');
            const mainContent = document.getElementById('mainContent');
            
            function checkAuthAndRedirect() {
                // Сначала проверяем sessionStorage (текущая сессия)
                const sessionUser = sessionStorage.getItem('userData');
                if (sessionUser) {
                    try {
                        const userData = JSON.parse(sessionUser);
                        if (userData && userData.platform_user_id) {
                            if (typeof initPushNotifications === 'function') {
                                initPushNotifications(userData.platform_user_id);
                            }
                            // Редиректим с небольшой задержкой для показа анимации
                            setTimeout(() => {
                                window.location.replace(getPostAuthDestination());
                            }, 600);
                            return;
                        }
                    } catch (error) {
                        console.error('Error parsing session user data:', error);
                        showLoginPage();
                    }
                }
                
                // Если в sessionStorage нет, проверяем localStorage (remember me)
                const rememberedUser = localStorage.getItem('rememberedUser');
                if (rememberedUser) {
                    try {
                        const userData = JSON.parse(rememberedUser);
                        if (userData && userData.platform_user_id) {
                            // Восстанавливаем сессию
                            sessionStorage.setItem('userData', rememberedUser);
                            
                            if (typeof initPushNotifications === 'function') {
                                initPushNotifications(userData.platform_user_id);
                            }
                            
                            // Редиректим с задержкой для показа анимации
                            setTimeout(() => {
                                window.location.replace(getPostAuthDestination());
                            }, 800);
                            return;
                        }
                    } catch (error) {
                        console.error('Error parsing remembered user:', error);
                        localStorage.removeItem('rememberedUser');
                        showLoginPage();
                    }
                }
                
                // Если не авторизован - показываем страницу входа
                showLoginPage();
            }
            
            function showLoginPage() {
                // Плавно скрываем белый экран и показываем основное содержимое
                loadingScreen.style.opacity = '0';
                
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    mainContent.classList.add('visible');
                }, 300);
            }
            
            // Сразу запускаем проверку
            checkAuthAndRedirect();
        })();
    </script>
