<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нет соединения - TheVuntgram</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #17212b, #242f3d);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        
        .liquid-glass {
            background: rgba(20, 25, 35, 0.3);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            padding: 40px;
            position: relative;
            overflow: hidden;
            max-width: 400px;
            width: 90%;
        }
        
        .liquid-glass::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 30%, rgba(100, 150, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(255, 100, 150, 0.05) 0%, transparent 50%);
            animation: liquidMove 15s ease-in-out infinite alternate;
            z-index: -1;
        }
        
        .icon {
            width: 128px;
            height: 128px;
            margin-bottom: 20px;
        }
        
        h1 {
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        p {
            margin-bottom: 25px;
            opacity: 0.8;
            line-height: 1.5;
        }
        
        button {
            background: rgba(36, 129, 204, 0.8);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        button:hover {
            background: rgba(36, 129, 204, 0.9);
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        @keyframes liquidMove {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(20px, 20px) scale(1.1);
            }
        }
    </style>
</html>
    <div class="offline-container">
        <div class="icon">📶</div>
        <h1>Нет соединения</h1>
        <p>Проверьте подключение к интернету и попробуйте снова</p>
        <button onclick="window.location.reload()">Повторить</button>
    </div>
</body>

</html>
